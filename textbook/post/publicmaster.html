<!-- 공공데이터로 정책 문제를 진단하고 대안·리스크까지 이어 보고서를 만드는 의사결정 지원 앱 -->
<!DOCTYPE html>
<html lang="ko" class="theme-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정책분석 마스터 v0.1 — 데이터 기반 정책 의사결정</title>
<style>
:root{
  --bg:#FFFFFF; --surface:#F8FAFF; --surface-hover:#EEF3FD;
  --border:rgba(22,82,216,0.12); --text:#1A1A1A; --text-secondary:#666666;
  --accent:#1652D8; --accent-secondary:#0F3D99;
  --positive:#059669; --negative:#e11d48; --warning:#d97706;
  --cr-header-bar:#1652D8; --cr-light-bg:#EEF3FD; --cr-card-border:#D0D9F5;
  --s1:#1652D8; --s2:#0EA5A5; --s3:#d97706; --s4:#7C3AED; --s5:#e11d48; --s6:#059669;
}
html.theme-dark{
  --bg:#0F0F0F; --surface:#1A1A2E; --surface-hover:#252540;
  --border:rgba(255,255,255,0.1); --text:#EDEDED; --text-secondary:#999999;
  --accent:#4B7BF5; --accent-secondary:#6B8FFF;
  --positive:#10b981; --negative:#f43f5e; --warning:#f59e0b;
  --cr-light-bg:#1E2A4A; --cr-card-border:#2E3A5A;
  --s1:#4B7BF5; --s2:#2DD4BF; --s3:#f59e0b; --s4:#A78BFA; --s5:#f43f5e; --s6:#10b981;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  background:var(--bg); color:var(--text); line-height:1.7; letter-spacing:-0.01em;
}
.skip{position:absolute;left:-9999px;}
.skip:focus{left:8px;top:8px;background:var(--accent);color:#fff;padding:8px 14px;z-index:99;}

header.appbar{
  background:var(--cr-header-bar); color:#fff; padding:16px 24px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  position:sticky; top:0; z-index:50;
}
.appbar h1{font-size:1.18rem; font-weight:700; letter-spacing:-0.02em;}
.appbar .sub{font-size:0.79rem; opacity:0.85;}
.appbar .right{display:flex; gap:7px; align-items:center;}
.appbar .proj{font-size:0.84rem; opacity:.92; background:rgba(255,255,255,.14); padding:4px 12px; border-radius:99px;}

.btn{
  border:1px solid var(--cr-card-border); background:var(--surface); color:var(--text);
  padding:8px 15px; border-radius:6px; font-size:0.9rem; font-weight:500;
  cursor:pointer; transition:background .15s; font-family:inherit;
}
.btn:hover:not(:disabled){background:var(--surface-hover);}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-primary:hover:not(:disabled){background:var(--accent-secondary);}
.btn-ghost-white{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;}
.btn-ghost-white:hover{background:rgba(255,255,255,.14);}
.btn-sm{padding:5px 11px;font-size:0.82rem;}
.btn-danger{color:var(--negative); border-color:rgba(225,29,72,.3);}
.btn-danger:hover{background:rgba(225,29,72,.08);}

.layout{display:grid; grid-template-columns:252px 1fr; min-height:calc(100vh - 60px);}

/* 사이드바 */
aside.nav{border-right:1px solid var(--cr-card-border); background:var(--surface); padding:16px 12px 40px;}
.nav .projbox{
  background:var(--bg); border:1px solid var(--cr-card-border); border-radius:9px;
  padding:11px 13px; margin-bottom:14px;
}
.nav .projbox .nm{font-weight:700; font-size:0.94rem; margin-bottom:6px; word-break:keep-all;}
.nav .projbox .mt{font-size:0.75rem; color:var(--text-secondary);}
.pbar{height:6px; background:var(--cr-card-border); border-radius:99px; overflow:hidden; margin:7px 0 4px;}
.pbar i{display:block; height:100%; background:var(--accent); transition:width .3s;}

.navitem{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:9px 11px; border:none; background:none; color:var(--text-secondary);
  font-family:inherit; font-size:0.88rem; cursor:pointer; border-radius:7px; margin-bottom:2px;
  transition:background .13s;
}
.navitem:hover:not(:disabled){background:var(--surface-hover); color:var(--text);}
.navitem:disabled{opacity:.35; cursor:not-allowed;}
.navitem.active{background:var(--cr-light-bg); color:var(--accent); font-weight:600;}
.navitem .n{
  width:21px;height:21px;border-radius:5px;background:var(--cr-card-border);color:var(--text-secondary);
  display:inline-flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;flex:none;
}
.navitem.active .n{background:var(--accent);color:#fff;}
.navitem.done .n{background:var(--positive);color:#fff;}
.navitem .tick{margin-left:auto; font-size:0.72rem; color:var(--text-secondary);}
.navsec{font-size:0.71rem; font-weight:700; color:var(--text-secondary); padding:12px 11px 5px; letter-spacing:.04em;}

main{padding:24px 28px 90px; max-width:1120px;}
.pagehead{margin-bottom:20px;}
.pagehead h2{font-size:1.42rem; font-weight:700; letter-spacing:-0.02em;}
.pagehead p{color:var(--text-secondary); font-size:0.92rem; margin-top:3px;}

.card{
  background:var(--surface); border:1px solid var(--cr-card-border); border-radius:10px;
  padding:19px 21px; margin-bottom:18px; border-top:3px solid var(--accent);
}
.card > h3{font-size:1.03rem; font-weight:700; margin-bottom:2px;}
.card > .desc{font-size:0.86rem; color:var(--text-secondary); margin-bottom:14px;}
.card.plain{border-top-color:var(--cr-card-border);}

.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:11px;}
.tile{background:var(--bg); border:1px solid var(--cr-card-border); border-radius:9px; padding:12px 14px;}
.tile .k{font-size:0.76rem; color:var(--text-secondary);}
.tile .v{font-size:1.4rem; font-weight:700; line-height:1.35; font-variant-numeric:tabular-nums;}
.tile .v.warn{color:var(--warning);} .tile .v.bad{color:var(--negative);} .tile .v.ok{color:var(--positive);}
.tile .s{font-size:0.73rem; color:var(--text-secondary);}

.field{margin-bottom:14px;}
.field > label{display:block; font-size:0.84rem; font-weight:700; margin-bottom:5px;}
.field .hint{font-size:0.79rem; color:var(--text-secondary); margin-top:4px;}
.req{color:var(--negative); font-weight:700;}
input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{
  font-family:inherit; font-size:0.9rem; padding:8px 11px; border:1px solid var(--cr-card-border);
  border-radius:6px; background:var(--bg); color:var(--text); width:100%;
}
textarea{resize:vertical; line-height:1.65;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:-1px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}

.badge{display:inline-block; padding:2px 9px; border-radius:99px; font-size:0.74rem; font-weight:600; white-space:nowrap;}
.b-ok{background:rgba(5,150,105,.14); color:var(--positive);}
.b-warn{background:rgba(217,119,6,.14); color:var(--warning);}
.b-bad{background:rgba(225,29,72,.14); color:var(--negative);}
.b-info{background:var(--cr-light-bg); color:var(--accent);}
.b-mute{background:var(--surface-hover); color:var(--text-secondary);}
.b-ai{background:rgba(124,58,237,.14); color:var(--s4);}

.note{background:var(--cr-light-bg); border-left:3px solid var(--accent); padding:11px 14px; border-radius:0 7px 7px 0; font-size:0.86rem; margin:12px 0;}
.note.warn{background:rgba(217,119,6,.1); border-left-color:var(--warning);}
.note.bad{background:rgba(225,29,72,.1); border-left-color:var(--negative);}
.note.ok{background:rgba(5,150,105,.1); border-left-color:var(--positive);}

.tblwrap{overflow:auto; max-height:420px; border:1px solid var(--cr-card-border); border-radius:8px; background:var(--bg);}
table{border-collapse:collapse; width:100%; font-size:0.85rem;}
th,td{border-bottom:1px solid var(--border); padding:7px 10px; text-align:left; white-space:nowrap;}
th{background:var(--cr-light-bg); position:sticky; top:0; font-weight:600; z-index:2;}
td.num{text-align:right; font-variant-numeric:tabular-nums;}
tbody tr:hover{background:var(--surface-hover);}

.actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; align-items:center;}
.empty{padding:46px 20px; text-align:center; color:var(--text-secondary);}
.empty .big{font-size:2rem; margin-bottom:8px;}

/* 프로젝트 카드 */
.projgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(258px,1fr)); gap:14px;}
.projcard{
  background:var(--bg); border:1px solid var(--cr-card-border); border-radius:10px; padding:15px 17px;
  cursor:pointer; transition:all .15s; border-left:4px solid var(--accent);
}
.projcard:hover{background:var(--surface-hover); transform:translateY(-2px); box-shadow:0 4px 14px rgba(22,82,216,.09);}
.projcard.cur{border-left-color:var(--positive); background:var(--cr-light-bg);}
.projcard h4{font-size:0.98rem; font-weight:700; margin-bottom:3px; word-break:keep-all;}
.projcard .q{font-size:0.81rem; color:var(--text-secondary); margin-bottom:9px; min-height:2.6em;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.projcard .meta{display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-secondary); margin-top:5px;}

/* 체크리스트 */
.checks{display:flex; flex-direction:column; gap:7px;}
.checkrow{display:flex; align-items:center; gap:9px; padding:9px 12px; background:var(--bg); border:1px solid var(--cr-card-border); border-radius:7px; font-size:0.87rem;}
.checkrow.on{border-color:var(--positive); background:rgba(5,150,105,.06);}
.checkrow .ic{flex:none;}
.checkrow .gap{margin-left:auto; font-size:0.79rem; color:var(--text-secondary);}

/* AI 블록 */
.ai{border:1px solid var(--s4); border-radius:10px; padding:16px 18px; background:var(--bg); margin-bottom:18px;}
.ai h3{font-size:0.98rem; font-weight:700; display:flex; align-items:center; gap:8px; margin-bottom:3px;}
.ai .desc{font-size:0.84rem; color:var(--text-secondary); margin-bottom:12px;}
.ai .modes{display:flex; gap:0; border:1px solid var(--cr-card-border); border-radius:7px; overflow:hidden; margin-bottom:12px; width:fit-content;}
.ai .modes button{border:none; background:var(--surface); padding:7px 15px; font-family:inherit; font-size:0.84rem; cursor:pointer; color:var(--text-secondary); border-right:1px solid var(--cr-card-border);}
.ai .modes button:last-child{border-right:none;}
.ai .modes button.on{background:var(--s4); color:#fff; font-weight:600;}
.aiout{margin-top:13px;}
.aiitem{
  background:var(--surface); border:1px solid var(--cr-card-border); border-left:3px solid var(--s4);
  border-radius:0 8px 8px 0; padding:11px 14px; margin-bottom:9px; font-size:0.88rem;
}
.aiitem .top{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
.aiitem .top b{flex:1;}

/* 차트 */
.chartbox{background:var(--bg); border:1px solid var(--cr-card-border); border-radius:9px; padding:15px; overflow-x:auto;}
svg .ax{stroke:var(--cr-card-border); stroke-width:1;}
svg .gl{stroke:var(--border); stroke-width:1; stroke-dasharray:3 3;}
svg text{fill:var(--text-secondary); font-size:11px; font-family:inherit;}
svg text.lbl{fill:var(--text); font-size:11.5px;}
svg .bar{transition:opacity .15s;} svg .bar:hover{opacity:.75;}

/* 신호 카드 */
.signal{background:var(--bg); border:1px solid var(--cr-card-border); border-left:4px solid var(--accent); border-radius:0 9px 9px 0; padding:13px 16px; margin-bottom:10px;}
.signal.done{border-left-color:var(--positive); background:rgba(5,150,105,.05);}
.signal .sh{display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
.signal .sh .sic{font-size:1.05rem; line-height:1;}
.signal .sh b{flex:1; font-size:0.95rem; min-width:220px; word-break:keep-all;}
.signal .sb{font-size:0.86rem; color:var(--text); margin-top:7px; line-height:1.65;}
.signal .scols{font-size:0.78rem; color:var(--text-secondary); margin-top:5px;}
.signal .sq{margin-top:9px;}
.signal .sq summary{font-size:0.82rem; color:var(--accent); cursor:pointer; padding:3px 0;}
.signal .sq .quote{margin-top:7px; border-left-color:var(--text-secondary);}
.chip{border:1px solid var(--cr-card-border); background:var(--bg); color:var(--text-secondary); border-radius:99px; padding:4px 12px; font-size:0.8rem; font-family:inherit; cursor:pointer;}
.chip:hover{background:var(--surface-hover);}
.chip.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
.aiitem .ev{font-size:0.81rem; color:var(--text-secondary); margin-top:4px; padding-left:2px; line-height:1.6;}

/* 사례 카드 */
.casecard{background:var(--bg); border:1px solid var(--cr-card-border); border-left:4px solid var(--accent); border-radius:0 10px 10px 0; padding:16px 18px; margin-bottom:14px;}
.casecard.unver{border-left-color:var(--warning);}
.ch{display:flex; align-items:center; gap:9px; margin-bottom:13px; flex-wrap:wrap;}
.ch b{flex:1; font-size:0.98rem; min-width:200px;}
.field label.req::after{content:' *'; color:var(--negative);}

/* 대안 점수 */
.scoregrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:10px; margin-top:12px;}
.scoregrid .sc label{display:block; font-size:0.78rem; color:var(--text-secondary); margin-bottom:3px; cursor:help;}
.scoregrid .sc select{padding:5px 8px; font-size:0.86rem;}
.wrow{display:grid; grid-template-columns:minmax(190px,260px) 1fr 42px; gap:12px; align-items:center; margin-bottom:9px;}
.wrow label{font-size:0.87rem; font-weight:600;}
.wrow label .wd{display:block; font-size:0.75rem; font-weight:400; color:var(--text-secondary);}
.wrow input[type=range]{width:100%; accent-color:var(--accent);}
.wrow .wv{text-align:right; font-variant-numeric:tabular-nums; font-weight:700; color:var(--accent);}

/* 비교 히트맵 */
.hm td{text-align:center; font-variant-numeric:tabular-nums;}
.hm td.v1{background:rgba(225,29,72,.16);}
.hm td.v2{background:rgba(217,119,6,.15);}
.hm td.v3{background:rgba(148,163,184,.14);}
.hm td.v4{background:rgba(22,82,216,.14);}
.hm td.v5{background:rgba(5,150,105,.18);}
.hm tr.win td{font-weight:700;}
.hm tr.win{outline:2px solid var(--accent); outline-offset:-2px;}

/* 기준별 1위 */
.solo{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:7px; margin-bottom:13px;}
.srow{display:flex; gap:9px; align-items:center; padding:8px 12px; background:var(--bg); border:1px solid var(--cr-card-border); border-radius:7px; font-size:0.85rem;}
.srow.same{border-color:var(--positive); background:rgba(5,150,105,.06);}
.srow .sk{color:var(--text-secondary); min-width:70px;}
.srow .sv{font-weight:600;}

/* 일정 역산 */
.timeline{display:flex; flex-direction:column; gap:9px;}
.tl{display:grid; grid-template-columns:104px 1fr auto; gap:13px; align-items:center; padding:11px 14px; background:var(--bg); border:1px solid var(--cr-card-border); border-left:3px solid var(--accent); border-radius:0 8px 8px 0;}
.tl.past{border-left-color:var(--negative); opacity:.72;}
.tl.soon{border-left-color:var(--warning);}
.tl .dt{font-size:0.84rem; font-variant-numeric:tabular-nums; color:var(--text-secondary);}
.tl .tx b{display:block; font-size:0.9rem;}
.tl .tx span{font-size:0.78rem; color:var(--text-secondary);}

/* 신호 읽는 법 */
.signal .sread{font-size:0.83rem; color:var(--text-secondary); margin-top:7px; padding:8px 11px; background:var(--surface); border-radius:6px; line-height:1.65;}
.signal .sread b{color:var(--accent);}
.legend{margin-top:14px; border:1px solid var(--cr-card-border); border-radius:9px; background:var(--bg); padding:0 16px;}
.legend summary{cursor:pointer; padding:12px 0; font-size:0.9rem; font-weight:700; color:var(--accent);}
.legend[open]{padding-bottom:16px;}
.legend h4.sub{margin:14px 0 7px; font-size:0.9rem;}
.legend p{font-size:0.85rem; line-height:1.7; margin-bottom:9px;}
.legend p.cau{background:rgba(217,119,6,.09); border-left:3px solid var(--warning); padding:9px 12px; border-radius:0 6px 6px 0;}
.legtbl{width:auto; min-width:min(100%,440px); font-size:0.83rem; margin-bottom:9px; border:1px solid var(--cr-card-border); border-radius:6px; overflow:hidden;}
.legtbl th{position:static; padding:6px 12px;}
.legtbl td{padding:6px 12px; white-space:nowrap;}

/* 서술형 답변 목록 */
.quotes{display:flex; flex-direction:column; gap:9px; max-height:520px; overflow-y:auto; padding-right:4px;}
.quote{display:flex; gap:11px; background:var(--bg); border:1px solid var(--cr-card-border); border-left:3px solid var(--accent); border-radius:0 8px 8px 0; padding:11px 14px;}
.quote .no{flex:none; color:var(--text-secondary); font-size:0.78rem; font-variant-numeric:tabular-nums; padding-top:2px; min-width:22px;}
.quote .tx{font-size:0.88rem; line-height:1.7; white-space:pre-wrap; word-break:break-word;}

/* 문제 카드 */
.probcard{background:var(--bg); border:1px solid var(--cr-card-border); border-radius:10px; padding:16px 18px; margin-bottom:13px; border-left:4px solid var(--warning);}
.probcard.p1{border-left-color:var(--negative);}
.probcard .hd{display:flex; align-items:flex-start; gap:10px; margin-bottom:11px;}
.probcard .hd .rank{background:var(--negative); color:#fff; width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;flex:none;}
.probcard .hd .ttl{flex:1; font-weight:700; font-size:1rem;}
.chain{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:0.85rem; margin:9px 0;}
.chain .node{background:var(--surface); border:1px solid var(--cr-card-border); border-radius:7px; padding:6px 11px;}
.chain .node.root{border-color:var(--negative); background:rgba(225,29,72,.07);}
.chain .node.lever{border-color:var(--positive); background:rgba(5,150,105,.07);}
.chain .arw{color:var(--text-secondary);}
.scorerow{display:grid; grid-template-columns:repeat(4,1fr); gap:11px; margin-top:11px;}
.scorerow .sc label{display:block; font-size:0.76rem; color:var(--text-secondary); margin-bottom:3px;}
.scorerow .sc select{padding:5px 8px; font-size:0.84rem;}

.tagin{display:flex; flex-wrap:wrap; gap:6px; padding:7px; border:1px solid var(--cr-card-border); border-radius:6px; background:var(--bg); min-height:40px;}
.tag{background:var(--cr-light-bg); color:var(--accent); border-radius:5px; padding:3px 8px; font-size:0.82rem; display:inline-flex; gap:6px; align-items:center;}
.tag button{border:none;background:none;color:inherit;cursor:pointer;font-size:.92rem;line-height:1;padding:0;opacity:.6;}
.tag button:hover{opacity:1;}
.tagin input{border:none; outline:none; flex:1; min-width:110px; padding:3px; background:none;}

.saveflag{font-size:0.78rem; color:var(--text-secondary); opacity:0; transition:opacity .3s;}
.saveflag.on{opacity:1;}
h4.sub{font-size:0.9rem; font-weight:700; margin:16px 0 8px;}
.rowbar{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:12px; font-size:0.87rem;}
.inline{display:flex; gap:8px; align-items:center;}
.inline select,.inline input{width:auto; min-width:160px;}

.runtoast{position:fixed; bottom:66px; right:18px; background:var(--accent); color:#fff; padding:10px 16px; border-radius:8px; font-size:.85rem; box-shadow:0 4px 14px rgba(0,0,0,.18); z-index:999; display:none; max-width:320px;}
.runbar{position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:2px solid var(--accent); box-shadow:0 -4px 14px rgba(0,0,0,.12); padding:10px 18px; display:none; gap:14px; align-items:center; z-index:998; font-size:.85rem;}
</style>
</head>
<body>
<a href="#main" class="skip">본문으로 건너뛰기</a>

<header class="appbar">
  <div>
    <h1>정책분석 마스터 <span style="font-weight:400;opacity:.65;font-size:.9rem">v0.1</span></h1>
    <div class="sub">데이터로 문제를 찾고, 대안을 비교하고, 리스크까지 정리해 보고서로 냅니다.</div>
  </div>
  <div class="right">
    <span class="proj" id="curproj">프로젝트 없음</span>
    <span class="saveflag" id="saveflag">저장됨</span>
    <button class="btn btn-ghost-white btn-sm" onclick="openAIConf()">🤖 AI 설정</button>

function josa(word, pair){
  var w = String(word==null?'':word).trim(), p = pair.split('/');
  if(!w) return p[0];
  var c = w.charCodeAt(w.length-1), jong;
  if(c>=0xAC00 && c<=0xD7A3) jong = ((c-0xAC00)%28) !== 0;
  else if(/[0-9]$/.test(w)) jong = '0136780'.indexOf(w.charAt(w.length-1)) >= 0;
  else jong = /[a-zA-Z]$/.test(w) ? 'lmnrLMNR'.indexOf(w.charAt(w.length-1))>=0 : false;
  return jong ? p[1] : p[0];
}
function withJosa(word, pair){ return word + josa(word, pair); }

/* ═══════════════ 통계 ═══════════════ */
function stats(vals){
  var v = vals.filter(function(x){ return typeof x==='number' && !isNaN(x); }).sort(function(a,b){return a-b;});
  if(!v.length) return null;
  var n=v.length, sum=v.reduce(function(a,b){return a+b;},0), mean=sum/n;
  var q=function(p){ var i=(n-1)*p, lo=Math.floor(i), hi=Math.ceil(i); return lo===hi? v[lo] : v[lo]+(v[hi]-v[lo])*(i-lo); };
  var sd = Math.sqrt(v.reduce(function(a,b){return a+(b-mean)*(b-mean);},0)/(n>1?n-1:1));
  return {n:n, 합:sum, 평균:mean, 중앙:q(.5), 표준편차:sd, 최소:v[0], 최대:v[n-1], Q1:q(.25), Q3:q(.75)};
}
function freq(vals){
  var m={}, out=[];
  vals.forEach(function(v){ if(v===null||v===undefined||v==='') return; var k=String(v); m[k]=(m[k]||0)+1; });
  for(var k in m) out.push({값:k, 수:m[k]});
  return out.sort(function(a,b){return b.수-a.수;});
}
// 텍스트 열을 어떻게 보여 줄지 정한다. 서술형 응답은 세는 것이 의미가 없어 그림 대신 내용을 읽어야 한다.
//   bar  값별 건수 막대 — 보기에서 고르는 항목
//   text 내용 그대로 목록 — 서술형 답변, 비고, AI 분석 결과
//   id   식별자 안내 — 행마다 값이 다르지만 짧은 열(응답ID 등)
function textMode(vals){
  var s = vals.filter(function(v){ return typeof v==='string' && v!==''; });
  if(s.length < 3) return 'bar';
  var maxLen = 0, sum = 0;
  s.forEach(function(v){ if(v.length>maxLen) maxLen = v.length; sum += v.length; });
  var avg = sum/s.length, uniqN = freq(s).length, ratio = uniqN/s.length;
  // 같은 값이 자주 반복되면 보기 항목이다. 문장이 길더라도 막대로 세는 편이 낫다.
  if(ratio < 0.6) return 'bar';
  if(maxLen >= 60 || avg >= 25) return 'text';
  if(uniqN > 30) return 'id';
  return 'bar';
}

function stripKo(w){
  var s = w, i;
  for(i=0;i<EOMI.length;i++){
    if(s.length > EOMI[i].length+1 && s.slice(-EOMI[i].length)===EOMI[i]){ s = s.slice(0,-EOMI[i].length); break; }

    }
    if(cut) break;
  }
  return s;
}

function tokenizeKo(text){

  var t = text.replace(/[^0-9A-Za-z가-힣%]+/g,' ').trim();
  if(!t) return [];
  var out = [];
  t.split(/\s+/).forEach(function(w){
    if(w.length < 2) return;
    var s = stripKo(w);
    if(s.length < 2 || STOPW[s] || EOMI_SET[s] || /^\d+$/.test(s)) return;
    out.push(s);
  });
  return out;
}
function pearson(xs, ys){
  var n=0, sx=0, sy=0, sxx=0, syy=0, sxy=0;
  for(var i=0;i<xs.length;i++){
    var a=xs[i], b=ys[i];
    if(typeof a!=='number'||isNaN(a)||typeof b!=='number'||isNaN(b)) continue;
    n++; sx+=a; sy+=b; sxx+=a*a; syy+=b*b; sxy+=a*b;
  }
  if(n<3) return null;
  var den = Math.sqrt((n*sxx-sx*sx)*(n*syy-sy*sy));
  if(!den) return null;
  return {r:(n*sxy-sx*sy)/den, n:n};
}
function jaccard(a, b){
  var ka = Object.keys(a), inter = 0;
  for(var i=0;i<ka.length;i++) if(b[ka[i]]) inter++;
  var uni = ka.length + Object.keys(b).length - inter;
  return uni ? inter/uni : 0;
}

/* ═══════════════════════════════════════════════════════════
   자동 스캔 — 앱이 먼저 숫자와 낱말을 훑어 후보 신호를 만든다.
   신호는 {유형, 강도, 제목, 근거, 열[], 원문[]} 형태로 고정한다.
   근거는 사람이 그대로 읽는 수치 한 줄이며 보고서 각주가 된다.
   결과는 저장하지 않고 메모리에만 담는다. 데이터에서 다시 계산되는 파생물이기 때문이다.
   ═══════════════════════════════════════════════════════════ */
var SCAN_CACHE = {}, DOC_CACHE = {};
var TEXT_LIMIT = 2000;   // 유사도 계산이 건수의 제곱으로 늘어나 브라우저가 멈추는 것을 막는다

// 스캔 대상 텍스트 열인지 본다. 화면의 textMode()와 기준이 다르다.
// textMode는 「막대로 세는 것이 의미 있나」를 보지만, 여기서는 「문장이 들어 있나」만 본다.
// 반복이 잦은 열을 빼면 유사묶음·빈출어처럼 반복을 찾는 신호가 아예 돌지 못한다.
// 참거짓 열의 값이 화면에 true/false로 나오면 읽기 어색하다. 사람이 쓰는 말로 바꾼다.
// 상관계수의 세기를 말로 옮긴다. 사회과학에서 흔히 쓰는 구간을 따랐다.
function corrGrade(r){
  var a = Math.abs(r);
  if(a>=0.9) return '매우 강함';
  if(a>=0.7) return '강함';
  if(a>=0.5) return '뚜렷함';
  if(a>=0.3) return '보통';
  return '약함';
}
// 두 집단 평균 차이의 크기(표준화 차이, Cohen's d 기준).
// 배수만으로는 절대 크기를 알 수 없어 이 값을 함께 본다.
function effectGrade(d){
  if(d>=0.8) return '큼';
  if(d>=0.5) return '중간';
  if(d>=0.2) return '작음';
  return '미미함';
}
// 표본이 작으면 방향은 참고하되 수치는 믿지 않는 편이 낫다.
function sampleNote(n){
  if(n < 15) return '표본이 '+n+'건으로 매우 적어 우연일 가능성이 큽니다. 방향만 참고하세요.';
  if(n < 30) return '표본이 '+n+'건으로 적은 편입니다. 방향은 참고하되 수치를 그대로 인용하지 마세요.';
  if(n < 100) return '표본 '+n+'건입니다. 경향을 보기에는 무리가 없습니다.';
  return '표본 '+n+'건으로 충분합니다.';
}
function keyLabel(v){
  if(v===true || v==='true') return '예';
  if(v===false || v==='false') return '아니오';
  return String(v);
}
function isScanText(ds, col){
  if(col.타입 !== '텍스트') return false;
  var v = colVals(ds, col.이름).filter(function(x){ return typeof x==='string' && x!==''; });
  if(v.length < 5) return false;
  var sum = 0;
  v.forEach(function(x){ sum += x.length; });
  return (sum/v.length) >= 12;   // 평균 12자 이상이면 문장으로 본다
}
function scanKey(ds){
  return ((ds.카탈로그&&ds.카탈로그.데이터셋명) || ds.원본파일 || '') + '|' + ds.행수 + '|' + ds.열.length;
}
function docsOf(ds, colName){
  var key = scanKey(ds)+'|'+colName;
  if(DOC_CACHE[key]) return DOC_CACHE[key];
  var docs = [], over = false;
  ds.데이터.forEach(function(r, i){
    var v = r[colName];
    if(typeof v==='string' && v.length>=2) docs.push({i:i, t:v, row:r});
  });
  if(docs.length > TEXT_LIMIT){
    over = true;
    var step = docs.length/TEXT_LIMIT, s = [];
    for(var k=0;k<TEXT_LIMIT;k++) s.push(docs[Math.floor(k*step)]);
    docs = s;
  }
  docs.forEach(function(d){
    d.toks = tokenizeKo(d.t);
    d.set = {};
    d.toks.forEach(function(w){ d.set[w] = 1; });
  });
  var res = {docs:docs, over:over};
  DOC_CACHE[key] = res;
  return res;
}

function scanDataset(ds, force){
  var key = scanKey(ds);
  if(!force && SCAN_CACHE[key]) return SCAN_CACHE[key];
  if(force){ SCAN_CACHE[key] = null; DOC_CACHE = {}; }

  var sig = [];
  var nums  = ds.열.filter(function(c){ return c.타입==='수치'; });
  var cats  = ds.열.filter(function(c){ return c.타입==='범주' || c.타입==='참거짓'; });
  var dates = ds.열.filter(function(c){ return c.타입==='날짜'; });
  var texts = ds.열.filter(function(c){ return isScanText(ds, c); });

  // 한 신호가 실패해도 나머지는 나오게 한다.
  function safe(name, fn){ try{ fn(); }catch(e){ console.warn('신호 계산 실패 — '+name, e); } }

  safe('그룹격차',   function(){ sigGroupGap(ds, nums, cats, sig); });
  safe('쏠림',       function(){ sigConcentration(ds, cats, sig); });
  safe('이상치',     function(){ sigOutlier(ds, nums, sig); });
  safe('평균중앙',   function(){ sigSkew(ds, nums, sig); });
  safe('시간추세',   function(){ sigTrend(ds, nums, dates, sig); });
  safe('결측편중',   function(){ sigMissingBias(ds, nums.concat(texts), cats, sig); });
  safe('수치상관',   function(){ sigCorr(ds, nums, sig); });
  safe('빈출어',     function(){ sigTopWords(ds, texts, sig); });
  safe('급증어',     function(){ sigSurge(ds, texts, dates, sig); });
  safe('그룹특징어', function(){ sigGroupWords(ds, texts, cats, sig); });
  safe('유사묶음',   function(){ sigDuplicates(ds, texts, sig); });
  safe('부정표현',   function(){ sigNegative(ds, texts, cats, sig); });
  safe('재차제기',   function(){ sigRepeat(ds, texts, sig); });

  sig.sort(function(a,b){ return b.강도 - a.강도; });
  sig = interleave(sig);
  SCAN_CACHE[key] = sig;
  return sig;
}

// 강도 순으로만 늘어놓으면 같은 유형이 상단을 독점해 다른 관점을 놓친다.
// 유형별로 번갈아 배치하되 유형 안에서는 강도 순을 지킨다.
function interleave(sigs){
  var by = {};
  sigs.forEach(function(s){ (by[s.유형] = by[s.유형] || []).push(s); });
  var types = Object.keys(by).sort(function(a,b){ return by[b][0].강도 - by[a][0].강도; });
  var out = [], guard = 0;
  while(out.length < sigs.length && guard++ < 200){
    var moved = false;
    for(var t=0; t<types.length; t++){
      var take = (guard===1) ? 2 : 1;   // 첫 바퀴만 유형당 2건까지
      for(var k=0; k<take; k++){
        if(by[types[t]].length){ out.push(by[types[t]].shift()); moved = true; }
      }
    }
    if(!moved) break;
  }
  return out;
}

/* ───────── 수치 신호 ───────── */
function sigGroupGap(ds, nums, cats, out){
  nums.forEach(function(nc){
    var all = stats(colVals(ds, nc.이름));
    cats.forEach(function(cc){
      var g = {};
      ds.데이터.forEach(function(r){
        var k = r[cc.이름], v = r[nc.이름];
        if(k===null||k===undefined||k==='') return;
        if(typeof v!=='number'||isNaN(v)) return;
        (g[keyLabel(k)] = g[keyLabel(k)] || []).push(v);
      });
      var keys = Object.keys(g).filter(function(k){ return g[k].length>=3; });
      if(keys.length < 2) return;
      var arr = keys.map(function(k){ var s = stats(g[k]); return {키:k, 평균:s.평균, n:s.n}; })
                    .sort(function(a,b){ return b.평균 - a.평균; });
      var hi = arr[0], lo = arr[arr.length-1];
      if(!lo.평균) return;
      var ratio = hi.평균/lo.평균;
      var d = (all && all.표준편차) ? Math.abs(hi.평균-lo.평균)/all.표준편차 : 0;
      if(ratio < 1.5 && d < 0.5) return;
      out.push({
        유형:'그룹격차', 강도: Math.min(1, Math.max((ratio-1)/2, d/2)),
        제목: cc.이름+'에 따라 '+withJosa(nc.이름,'가/이')+' 크게 다릅니다',
        근거: hi.키+' '+fmt1(hi.평균)+(nc.단위||'')+'(n='+hi.n+') vs '+lo.키+' '+fmt1(lo.평균)+(nc.단위||'')+'(n='+lo.n+') — '+fmt1(ratio)+'배 차이'
          + (d ? ', 표준화 차이 '+(Math.round(d*100)/100) : ''),
        해석:'차이의 크기는 「'+effectGrade(d)+'」입니다'+(d?'(표준화 차이 '+(Math.round(d*100)/100)+')':'')+'. '
          + sampleNote(Math.min(hi.n, lo.n))
          + ' 배수는 절대 크기를 나타내지 않습니다. 그룹의 성격 자체가 달라 생긴 차이인지 함께 살펴보세요.',
        열:[nc.이름, cc.이름], 원문:[]
      });
    });
  });
}
function sigConcentration(ds, cats, out){
  cats.forEach(function(cc){
    var fr = freq(colVals(ds, cc.이름));
    var tot = fr.reduce(function(a,b){ return a+b.수; }, 0);
    if(!tot || fr.length < 2) return;
    var p = fr[0].수/tot;
    if(p < 0.7) return;
    out.push({유형:'쏠림', 강도: Math.min(1, (p-0.6)*2.5),
      제목: withJosa(cc.이름,'가/이')+' '+keyLabel(fr[0].값)+'에 몰려 있습니다',
      근거: keyLabel(fr[0].값)+' '+fmt(fr[0].수)+'건 / 전체 '+fmt(tot)+'건('+Math.round(p*100)+'%). 나머지 '+(fr.length-1)+'가지는 사례가 적어 비율로 비교하기 어렵습니다',
      열:[cc.이름], 원문:[]});
  });
}
function sigOutlier(ds, nums, out){
  nums.forEach(function(nc){
    var vals = colVals(ds, nc.이름).filter(function(v){ return typeof v==='number' && !isNaN(v); });
    var s = stats(vals);
    if(!s || s.n < 8) return;
    var iqr = s.Q3 - s.Q1;
    if(iqr <= 0) return;
    var lo = s.Q1-1.5*iqr, hi = s.Q3+1.5*iqr;
    var od = vals.filter(function(v){ return v<lo || v>hi; });
    if(!od.length) return;
    out.push({유형:'이상치', 강도: Math.min(0.9, od.length/vals.length*4),
      제목: nc.이름+'에 동떨어진 값이 있습니다',
      근거: od.length+'건이 일반 범위('+fmt1(lo)+'~'+fmt1(hi)+') 밖입니다. 가장 큰 값 '+fmt1(Math.max.apply(null, od))+(nc.단위||'')+'. 입력 오류인지 실제 사례인지 확인이 필요합니다',
      열:[nc.이름], 원문:[]});
  });
}
function sigSkew(ds, nums, out){
  nums.forEach(function(nc){
    var s = stats(colVals(ds, nc.이름));
    if(!s || s.n < 8 || !s.평균) return;
    var gap = Math.abs(s.평균-s.중앙)/Math.abs(s.평균);
    if(gap < 0.2) return;
    out.push({유형:'평균중앙괴리', 강도: Math.min(0.8, gap*2),
      제목: nc.이름+'은(는) 평균만 보면 실제와 다릅니다',
      근거:'평균 '+fmt1(s.평균)+' vs 중앙값 '+fmt1(s.중앙)+' ('+Math.round(gap*100)+'% 차이). 값이 한쪽으로 치우쳐 있어 보고에는 중앙값을 함께 쓰시는 편이 안전합니다',
      열:[nc.이름], 원문:[]});
  });
}
function sigTrend(ds, nums, dates, out){
  if(!dates.length) return;
  var dc = dates[0];
  nums.forEach(function(nc){
    var pts = [];
    ds.데이터.forEach(function(r){
      var d = r[dc.이름], v = r[nc.이름];
      if(!d || typeof v!=='number' || isNaN(v)) return;
      pts.push({d:String(d), v:v});
    });
    if(pts.length < 8) return;
    pts.sort(function(a,b){ return a.d < b.d ? -1 : 1; });
    var half = Math.floor(pts.length/2);
    var a = stats(pts.slice(0,half).map(function(p){return p.v;}));
    var b = stats(pts.slice(half).map(function(p){return p.v;}));
    if(!a || !b || !a.평균) return;
    var ratio = b.평균/a.평균;
    if(ratio >= 0.77 && ratio <= 1.3) return;
    out.push({유형:'시간추세', 강도: Math.min(1, Math.abs(ratio-1)),
      제목: withJosa(nc.이름,'가/이')+' 시간이 지나며 '+(ratio>1?'늘고':'줄고')+' 있습니다',
      근거:'앞 기간('+pts[0].d.slice(0,10)+'부터) 평균 '+fmt1(a.평균)+' → 뒤 기간('+pts[pts.length-1].d.slice(0,10)+'까지) 평균 '+fmt1(b.평균)+' ('+fmt1(ratio)+'배)',
      열:[nc.이름, dc.이름], 원문:[]});
  });
}
function sigMissingBias(ds, targets, cats, out){
  targets.forEach(function(tc){
    cats.forEach(function(cc){
      if(tc.이름===cc.이름) return;
      var g = {};
      ds.데이터.forEach(function(r){
        var k = r[cc.이름];
        if(k===null||k===undefined||k==='') return;
        k = keyLabel(k);
        g[k] = g[k] || {n:0, miss:0};
        g[k].n++;
        var v = r[tc.이름];
        if(v===null||v===undefined||v==='') g[k].miss++;
      });
      var arr = Object.keys(g).filter(function(k){ return g[k].n>=5; })
        .map(function(k){ return {키:k, 율:g[k].miss/g[k].n, n:g[k].n, miss:g[k].miss}; })
        .sort(function(a,b){ return b.율 - a.율; });
      if(arr.length < 2) return;
      var d = arr[0].율 - arr[arr.length-1].율;
      if(d < 0.2 || !arr[0].miss) return;
      out.push({유형:'결측편중', 강도: Math.min(0.9, d*2),
        제목: tc.이름+'의 빈칸이 '+arr[0].키+'에 몰려 있습니다',
        근거: arr[0].키+' '+arr[0].miss+'/'+arr[0].n+'건 비어 있음('+Math.round(arr[0].율*100)+'%) vs '+arr[arr.length-1].키+' '+Math.round(arr[arr.length-1].율*100)+'%. 빈칸이 생기는 이유 자체가 시사점일 수 있습니다',
        열:[tc.이름, cc.이름], 원문:[]});
    });
  });
}
function sigCorr(ds, nums, out){
  for(var i=0;i<nums.length;i++) for(var j=i+1;j<nums.length;j++){
    var c = pearson(colVals(ds,nums[i].이름), colVals(ds,nums[j].이름));
    if(!c || c.n<10 || Math.abs(c.r)<0.5) continue;
    var pos = c.r > 0, rr = Math.round(c.r*100)/100;
    out.push({유형:'수치상관', 강도: Math.min(0.85, (Math.abs(c.r)-0.4)*1.6),
      제목: pos
        ? withJosa(nums[i].이름,'가/이')+' 클수록 '+withJosa(nums[j].이름,'도/도')+' 큽니다'
        : withJosa(nums[i].이름,'가/이')+' 클수록 '+withJosa(nums[j].이름,'는/은')+' 작습니다',
      근거:'상관계수 '+(rr>0?'+':'')+rr+' (n='+c.n+'). '
        + (pos ? '한쪽이 커질 때 다른 쪽도 함께 커지는 관계입니다.' : '한쪽이 커질 때 다른 쪽은 반대로 작아지는 관계입니다.'),
      해석:'관계의 세기는 「'+corrGrade(c.r)+'」입니다. '+sampleNote(c.n)
        + ' 함께 움직인다는 뜻일 뿐 한쪽이 다른 쪽의 원인이라는 근거는 아닙니다.',
      열:[nums[i].이름, nums[j].이름], 원문:[]});
  }
}

/* ───────── 텍스트 신호 ───────── */
function sigTopWords(ds, texts, out){
  texts.forEach(function(tc){
    var D = docsOf(ds, tc.이름);
    if(D.docs.length < 5) return;
    var df = {};   // 문서 빈도로 센다. 한 글에서 여러 번 나와도 1건이다.
    D.docs.forEach(function(d){ Object.keys(d.set).forEach(function(w){ df[w] = (df[w]||0)+1; }); });
    Object.keys(df).map(function(w){ return {w:w, n:df[w]}; })
      .filter(function(x){ return x.n>=3 && x.n < D.docs.length*0.9; })
      .sort(function(a,b){ return b.n-a.n; }).slice(0,3)
      .forEach(function(x){
        out.push({유형:'빈출어', 강도: Math.min(0.7, x.n/D.docs.length + 0.12),
          제목:'「'+x.w+'」'+josa(x.w,'가/이')+' 반복해서 나옵니다 — '+tc.이름,
          근거: D.docs.length+'건 가운데 '+x.n+'건('+Math.round(x.n/D.docs.length*100)+'%)에 나옵니다',
          열:[tc.이름],
          원문: D.docs.filter(function(d){ return d.set[x.w]; }).slice(0,3).map(function(d){ return d.t; })});
      });
  });
}
function sigSurge(ds, texts, dates, out){
  if(!dates.length) return;
  var dc = dates[0];
  texts.forEach(function(tc){
    var D = docsOf(ds, tc.이름);
    var wd = D.docs.filter(function(d){ return d.row[dc.이름]; });
    if(wd.length < 12) return;
    wd = wd.slice().sort(function(a,b){ return String(a.row[dc.이름]) < String(b.row[dc.이름]) ? -1 : 1; });
    var half = Math.floor(wd.length/2), A = wd.slice(0,half), B = wd.slice(half);
    var dfA = {}, dfB = {};
    A.forEach(function(d){ Object.keys(d.set).forEach(function(w){ dfA[w]=(dfA[w]||0)+1; }); });
    B.forEach(function(d){ Object.keys(d.set).forEach(function(w){ dfB[w]=(dfB[w]||0)+1; }); });
    Object.keys(dfB).filter(function(w){ return dfB[w] >= Math.max(3, B.length*0.15); })
      .map(function(w){
        var a = (dfA[w]||0)/A.length, b = dfB[w]/B.length;
        return {w:w, a:dfA[w]||0, b:dfB[w], ratio: a ? b/a : 99};
      })
      .filter(function(x){ return x.ratio >= 2; })
      .sort(function(p,q){ return q.ratio - p.ratio; }).slice(0,3)
      .forEach(function(x){
        out.push({유형:'급증어', 강도: Math.min(1, 0.62 + Math.min(x.ratio,6)/16),
          제목:'「'+x.w+'」'+josa(x.w,'가/이')+' 최근 들어 늘었습니다 — '+tc.이름,
          근거:'앞 기간 '+x.a+'건 → 뒤 기간 '+x.b+'건'+(x.ratio<99 ? ' ('+fmt1(x.ratio)+'배)' : ' — 앞 기간에는 없던 말입니다')+'. '+dc.이름+' 기준으로 반씩 나눠 비교했습니다',
          열:[tc.이름, dc.이름],
          원문: B.filter(function(d){ return d.set[x.w]; }).slice(0,3).map(function(d){ return d.t; })});
      });
  });
}
function sigGroupWords(ds, texts, cats, out){
  texts.forEach(function(tc){
    var D = docsOf(ds, tc.이름);
    if(D.docs.length < 10) return;
    var dfAll = {};
    D.docs.forEach(function(d){ Object.keys(d.set).forEach(function(w){ dfAll[w]=(dfAll[w]||0)+1; }); });
    cats.forEach(function(cc){
      var g = {};
      D.docs.forEach(function(d){
        var k = d.row[cc.이름];
        if(k===null||k===undefined||k==='') return;
        (g[keyLabel(k)] = g[keyLabel(k)]||[]).push(d);
      });
      Object.keys(g).forEach(function(k){
        var gd = g[k];
        if(gd.length < 4) return;
        var dfg = {};
        gd.forEach(function(d){ Object.keys(d.set).forEach(function(w){ dfg[w]=(dfg[w]||0)+1; }); });
        var best = Object.keys(dfg).filter(function(w){ return dfg[w]>=3; })
          .map(function(w){ return {w:w, n:dfg[w], lift:(dfg[w]/gd.length)/(dfAll[w]/D.docs.length)}; })
          .filter(function(x){ return x.lift >= 2; })
          .sort(function(a,b){ return b.lift - a.lift; })[0];
        if(!best) return;
        out.push({유형:'그룹특징어', 강도: Math.min(0.9, 0.4 + best.lift/8),
          제목: k+'에서만 「'+best.w+'」'+josa(best.w,'가/이')+' 유독 많습니다 — '+tc.이름,
          근거: k+' '+gd.length+'건 중 '+best.n+'건('+Math.round(best.n/gd.length*100)+'%)에 나옵니다. 전체 평균의 '+fmt1(best.lift)+'배',
          열:[tc.이름, cc.이름],
          원문: gd.filter(function(d){ return d.set[best.w]; }).slice(0,3).map(function(d){ return d.t; })});
      });
    });
  });
}
function sigDuplicates(ds, texts, out){
  texts.forEach(function(tc){
    var D = docsOf(ds, tc.이름), docs = D.docs;
    if(docs.length < 6) return;
    // 역색인으로 공통 낱말이 있는 쌍만 비교한다. 전량 비교하면 건수가 늘 때 브라우저가 멈춘다.
    var inv = {};
    docs.forEach(function(d, i){ Object.keys(d.set).forEach(function(w){ (inv[w] = inv[w]||[]).push(i); }); });
    var parent = docs.map(function(_, i){ return i; });
    function find(x){ while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; }
    function uni(a,b){ a=find(a); b=find(b); if(a!==b) parent[b]=a; }
    var seen = {}, pairs = 0;
    var ws = Object.keys(inv);
    for(var wi=0; wi<ws.length && pairs<300000; wi++){
      var lst = inv[ws[wi]];
      if(lst.length > 60) continue;   // 너무 흔한 낱말로는 후보 쌍을 만들지 않는다
      for(var a=0;a<lst.length && pairs<300000;a++) for(var b=a+1;b<lst.length && pairs<300000;b++){
        var key = lst[a]+'_'+lst[b];
        if(seen[key]) continue;
        seen[key] = 1; pairs++;
        if(jaccard(docs[lst[a]].set, docs[lst[b]].set) >= 0.5) uni(lst[a], lst[b]);
      }
    }
    var groups = {};
    docs.forEach(function(_, i){ var r = find(i); (groups[r] = groups[r]||[]).push(i); });
    Object.keys(groups).map(function(k){ return groups[k]; })
      .filter(function(g){ return g.length >= 3; })
      .sort(function(a,b){ return b.length - a.length; }).slice(0,2)
      .forEach(function(g){
        out.push({유형:'유사묶음', 강도: Math.min(1, 0.5 + g.length/docs.length*2),
          제목:'비슷한 내용이 '+g.length+'건 반복됩니다 — '+tc.이름,
          근거: docs.length+'건 가운데 '+g.length+'건('+Math.round(g.length/docs.length*100)+'%)이 서로 비슷합니다. 같은 사안이 여러 번 제기됐을 수 있습니다'+(D.over?' (건수가 많아 일부만 확인했습니다)':''),
          열:[tc.이름], 원문: g.slice(0,3).map(function(i){ return docs[i].t; })});
      });
  });
}
function sigNegative(ds, texts, cats, out){
  texts.forEach(function(tc){
    var D = docsOf(ds, tc.이름), docs = D.docs;
    if(docs.length < 5) return;
    docs.forEach(function(d){
      d.neg = NEG_WORDS.filter(function(w){ return d.t.indexOf(w) !== -1; }).length;
    });
    var hit = docs.filter(function(d){ return d.neg > 0; });
    var rate = hit.length/docs.length;
    if(rate < 0.3) return;
    var extra = '', strength = Math.min(0.85, rate);
    cats.forEach(function(cc){
      if(extra) return;
      var g = {};
      docs.forEach(function(d){
        var k = d.row[cc.이름];
        if(k===null||k===undefined||k==='') return;
        k = keyLabel(k);
        g[k] = g[k] || {n:0, h:0};
        g[k].n++;
        if(d.neg>0) g[k].h++;
      });
      var arr = Object.keys(g).filter(function(k){ return g[k].n>=4; })
        .map(function(k){ return {키:k, 율:g[k].h/g[k].n}; })
        .sort(function(a,b){ return b.율-a.율; });
      if(arr.length>=2 && (arr[0].율 - arr[arr.length-1].율) >= 0.15){
        extra = ' 특히 '+cc.이름+'이 '+arr[0].키+'인 경우 '+Math.round(arr[0].율*100)+'%로 가장 높습니다.';
        strength = Math.min(1, strength+0.15);
      }
    });
    out.push({유형:'부정표현', 강도: strength,
      제목:'불만·불편을 나타내는 말이 자주 나옵니다 — '+tc.이름,
      근거: docs.length+'건 가운데 '+hit.length+'건('+Math.round(rate*100)+'%)에 불편·지연·부족 같은 말이 들어 있습니다.'+extra,
      열:[tc.이름],
      원문: hit.slice().sort(function(a,b){ return b.neg-a.neg; }).slice(0,3).map(function(d){ return d.t; })});
  });
}
function sigRepeat(ds, texts, out){
  texts.forEach(function(tc){
    var D = docsOf(ds, tc.이름), docs = D.docs;
    if(docs.length < 5) return;
    var hit = docs.filter(function(d){
      return AGAIN_WORDS.some(function(w){ return d.t.indexOf(w) !== -1; });
    });
    var rate = hit.length/docs.length;
    if(rate < 0.1 || hit.length < 2) return;
    out.push({유형:'재차제기', 강도: Math.min(0.95, 0.45+rate),
      제목:'이미 제기했던 일이라는 표현이 보입니다 — '+tc.이름,
      근거: docs.length+'건 가운데 '+hit.length+'건('+Math.round(rate*100)+'%)에 「다시·여전히·지난번」 같은 말이 있습니다. 해결되지 않고 되돌아온 건일 수 있습니다',
      열:[tc.이름], 원문: hit.slice(0,3).map(function(d){ return d.t; })});
  });
}

/* ═══════════════ 차트 (외부 라이브러리 없이 SVG 직접) ═══════════════ */
var PAL = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)'];

function svgBars(items, opt){
  opt = opt||{};
  var W = opt.w||760, rowH=26, padL=opt.padL||150, padR=54, padT=10;
  var H = padT + items.length*rowH + 12;
  var max = Math.max.apply(null, items.map(function(d){return d.값;}).concat([0]));
  if(max<=0) max=1;
  var bw = W - padL - padR;
  var s = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img">';
  items.forEach(function(d,i){
    var y = padT + i*rowH, w = Math.max(1, d.값/max*bw);
    var lb = d.라벨.length>20 ? d.라벨.slice(0,20)+'…' : d.라벨;
    s += '<text class="lbl" x="'+(padL-9)+'" y="'+(y+16)+'" text-anchor="end">'+esc(lb)+'<title>'+esc(d.라벨)+'</title></text>';
    s += '<rect class="bar" x="'+padL+'" y="'+(y+4)+'" width="'+w+'" height="'+(rowH-11)+'" rx="3" fill="'+(d.색||PAL[0])+'"><title>'+esc(d.라벨)+': '+fmt1(d.값)+'</title></rect>';
    s += '<text x="'+(padL+w+7)+'" y="'+(y+16)+'">'+ (opt.표기? opt.표기(d) : fmt1(d.값)) +'</text>';
  });
  return s+'</svg>';
}

function svgHist(values, opt){
  opt = opt||{};
  var v = values.filter(function(x){return typeof x==='number' && !isNaN(x);});
  if(v.length<2) return '<div class="empty">막대를 그리기에 값이 부족합니다.</div>';
  var mn=Math.min.apply(null,v), mx=Math.max.apply(null,v);
  if(mn===mx){ mx=mn+1; }
  var bins = Math.max(5, Math.min(14, Math.round(Math.sqrt(v.length))));
  var w=(mx-mn)/bins, cnt=new Array(bins).fill(0);
  v.forEach(function(x){ var i=Math.min(bins-1, Math.floor((x-mn)/w)); cnt[i]++; });
  var W=760,H=250, padL=48,padB=42,padT=12,padR=14;
  var cw=(W-padL-padR)/bins, mc=Math.max.apply(null,cnt);
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img">';
  for(var g=0; g<=4; g++){
    var yy = padT + (H-padT-padB)*g/4, val = mc*(1-g/4);
    s += '<line class="gl" x1="'+padL+'" y1="'+yy+'" x2="'+(W-padR)+'" y2="'+yy+'"/>';
    s += '<text x="'+(padL-7)+'" y="'+(yy+4)+'" text-anchor="end">'+Math.round(val)+'</text>';
  }
  cnt.forEach(function(c,i){
    var h=(H-padT-padB)*(c/(mc||1)), x=padL+i*cw, y=H-padB-h;
    s += '<rect class="bar" x="'+(x+1.5)+'" y="'+y+'" width="'+(cw-3)+'" height="'+Math.max(h,0)+'" rx="2" fill="var(--s1)">'
       + '<title>'+fmt1(mn+i*w)+' ~ '+fmt1(mn+(i+1)*w)+' : '+c+'건</title></rect>';
  });
  s += '<line class="ax" x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padR)+'" y2="'+(H-padB)+'"/>';
  s += '<text x="'+padL+'" y="'+(H-padB+18)+'">'+fmt1(mn)+'</text>';
  s += '<text x="'+(W-padR)+'" y="'+(H-padB+18)+'" text-anchor="end">'+fmt1(mx)+'</text>';
  s += '<text x="'+((padL+W-padR)/2)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(opt.축||'')+'</text>';
  return s+'</svg>';
}

function svgLine(points, opt){
  opt=opt||{};
  if(points.length<2) return '<div class="empty">선을 그리기에 시점이 부족합니다.</div>';
  var W=760,H=250,padL=54,padB=40,padT=14,padR=16;
  var ys=points.map(function(p){return p.y;});
  var mn=Math.min.apply(null,ys), mx=Math.max.apply(null,ys);
  if(mn===mx){ mn=mn-1; mx=mx+1; }
  var iw=W-padL-padR, ih=H-padT-padB;
  var px=function(i){ return padL + iw*i/(points.length-1); };
  var py=function(y){ return padT + ih*(1-(y-mn)/(mx-mn)); };
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img">';
  for(var g=0; g<=4; g++){
    var yy=padT+ih*g/4, val=mx-(mx-mn)*g/4;
    s+='<line class="gl" x1="'+padL+'" y1="'+yy+'" x2="'+(W-padR)+'" y2="'+yy+'"/>';
    s+='<text x="'+(padL-7)+'" y="'+(yy+4)+'" text-anchor="end">'+fmt1(val)+'</text>';
  }
  s += '<polyline fill="none" stroke="var(--s1)" stroke-width="2.2" stroke-linejoin="round" points="'
     + points.map(function(p,i){return px(i)+','+py(p.y);}).join(' ') + '"/>';
  points.forEach(function(p,i){
    s+='<circle cx="'+px(i)+'" cy="'+py(p.y)+'" r="3.4" fill="var(--s1)"><title>'+esc(p.x)+': '+fmt1(p.y)+'</title></circle>';
  });
  var step=Math.max(1, Math.ceil(points.length/8));
  points.forEach(function(p,i){
    if(i%step) return;
    s+='<text x="'+px(i)+'" y="'+(H-padB+17)+'" text-anchor="middle">'+esc(String(p.x).slice(0,10))+'</text>';
  });
  s+='<line class="ax" x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padR)+'" y2="'+(H-padB)+'"/>';
  return s+'</svg>';
}

// 심각도 × 긴급도 매트릭스. 문제 우선순위를 눈으로 보여 준다.
function svgMatrix(items){
  var W=560,H=420,pad=52;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img">';
  s+='<rect x="'+((W+pad)/2)+'" y="'+pad+'" width="'+((W-pad-14)/2)+'" height="'+((H-pad-40)/2)+'" fill="rgba(225,29,72,.07)"/>';
  for(var g=0;g<=4;g++){
    var x=pad+(W-pad-14)*g/4, y=pad+(H-pad-40)*g/4;
    s+='<line class="gl" x1="'+x+'" y1="'+pad+'" x2="'+x+'" y2="'+(H-40)+'"/>';
    s+='<line class="gl" x1="'+pad+'" y1="'+y+'" x2="'+(W-14)+'" y2="'+y+'"/>';
  }
  items.forEach(function(it,i){
    var x=pad+(W-pad-14)*((it.x-1)/4), y=(H-40)-(H-pad-40)*((it.y-1)/4);
    s+='<circle cx="'+x+'" cy="'+y+'" r="14" fill="'+PAL[i%6]+'" opacity=".85"><title>'+esc(it.라벨)+'</title></circle>';
    s+='<text x="'+x+'" y="'+(y+4)+'" text-anchor="middle" style="fill:#fff;font-weight:700">'+(i+1)+'</text>';
  });
  s+='<line class="ax" x1="'+pad+'" y1="'+(H-40)+'" x2="'+(W-14)+'" y2="'+(H-40)+'"/>';
  s+='<line class="ax" x1="'+pad+'" y1="'+pad+'" x2="'+pad+'" y2="'+(H-40)+'"/>';
  s+='<text x="'+((W+pad)/2)+'" y="'+(H-12)+'" text-anchor="middle">긴급도 →</text>';
  s+='<text transform="rotate(-90 16 '+((H-40+pad)/2)+')" x="16" y="'+((H-40+pad)/2)+'" text-anchor="middle">심각도 →</text>';
  s+='<text x="'+(W-18)+'" y="'+(pad-9)+'" text-anchor="end" style="fill:var(--negative);font-weight:700">먼저 다룰 영역</text>';
  return s+'</svg>';
}

// 클립보드 API가 없는 환경(오래된 브라우저, 사용자 클릭 없이 코드로 호출한 경우)에서도
// textarea+execCommand로 그대로 복사되게 한다.
function clipFallback(t, elId){
  var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
  $(elId).innerHTML = '<span style="color:var(--positive)">✔ 복사했습니다.</span>';
}
function aiCopy(id){
  var t = AISPEC[id].프롬프트();
  if(!navigator.clipboard){ clipFallback(t, 'aimsg-'+id); return; }
  navigator.clipboard.writeText(t).then(function(){
    $('aimsg-'+id).innerHTML = '<span style="color:var(--positive)">✔ 복사했습니다. AI에 붙여넣어 주세요.</span>';
  }, function(){ clipFallback(t, 'aimsg-'+id); });
}
function aiParse(id){
  var spec = AISPEC[id], txt = $('aipaste-'+id).value.trim();
  if(!txt){ $('aimsg-'+id).innerHTML='<span style="color:var(--negative)">붙여넣은 내용이 없습니다.</span>'; return; }
  var items;
  try{ items = spec.파서(txt); }
  catch(e){ $('aimsg-'+id).innerHTML='<span style="color:var(--negative)">형식을 알아보지 못했습니다. AI에게 다시 물어보시거나 직접 입력해 주세요.</span>'; return; }
  if(!items || !items.length){ $('aimsg-'+id).innerHTML='<span style="color:var(--negative)">읽어낼 항목이 없습니다.</span>'; return; }
  spec.수용(items);
  $('aimsg-'+id).innerHTML='<span style="color:var(--positive)">✔ '+items.length+'건을 반영했습니다. 내용을 확인하고 검증 표시를 바꿔 주세요.</span>';
}
// 제공사마다 요청·응답 형식이 다르다. 여기서만 그 차이를 흡수하고,
// 위쪽(aiRun 등)은 "텍스트 프롬프트 넣으면 텍스트 답이 나온다"로만 다룬다.
async function callAIProvider(provider, key, model, promptText){
  if(provider==='anthropic'){
    var res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'content-type':'application/json','x-api-key':key,
               'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({model:model, max_tokens:2000, messages:[{role:'user', content:promptText}]})
    });
    if(!res.ok){ var t=await res.text(); throw new Error('서버가 '+res.status+'로 응답했습니다. '+t.slice(0,180)); }
    var j = await res.json();
    return (j.content||[]).map(function(c){return c.text||'';}).join('\n');
  }
  if(provider==='openai'){
    var res = await fetch('https://api.openai.com/v1/chat/completions', {
      method:'POST',
      headers:{'content-type':'application/json','authorization':'Bearer '+key},
      body: JSON.stringify({model:model, max_tokens:2000, messages:[{role:'user', content:promptText}]})
    });
    if(!res.ok){ var t=await res.text(); throw new Error('서버가 '+res.status+'로 응답했습니다. '+t.slice(0,180)); }
    var j = await res.json();
    var choice = (j.choices||[])[0];
    return (choice && choice.message && choice.message.content) || '';
  }
  if(provider==='gemini'){
    var url = 'https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key);
    var res = await fetch(url, {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({contents:[{parts:[{text:promptText}]}]})
    });
    if(!res.ok){ var t=await res.text(); throw new Error('서버가 '+res.status+'로 응답했습니다. '+t.slice(0,180)); }
    var j = await res.json();
    var cand = (j.candidates||[])[0];
    var parts = (cand && cand.content && cand.content.parts) || [];
    return parts.map(function(p){return p.text||'';}).join('\n');
  }
  throw new Error('알 수 없는 AI 제공사입니다.');
}
// 반환값은 "전체 자동 실행"이 다음 단계로 넘어가도 되는지 판단하는 데만 쓴다.
// 버튼을 직접 누르는 평소 흐름은 이 값을 보지 않는다.
async function aiRun(id){
  var spec = AISPEC[id], prov = curAIProvider();
  if(!prov.key){ $('aimsg-'+id).innerHTML='<span style="color:var(--negative)">API 키를 먼저 등록해 주세요.</span>'; return false; }
  $('aimsg-'+id).textContent = '분석하고 있습니다…';
  try{
    var txt = await callAIProvider(DB.ai.provider, prov.key, prov.model, spec.프롬프트());
    var items = spec.파서(txt);
    if(!items.length) throw new Error('결과에서 읽어낼 항목이 없습니다.');
    spec.수용(items);
    $('aimsg-'+id).innerHTML='<span style="color:var(--positive)">✔ '+items.length+'건을 반영했습니다.</span>';
    return true;
  }catch(e){
    $('aimsg-'+id).innerHTML='<span style="color:var(--negative)">실패했습니다 — '+esc(e.message)
      +'</span><br><span style="font-size:.83rem">내부망이라 외부 접속이 막힌 경우일 수 있습니다. 그때는 복사·붙여넣기 방식을 쓰시면 됩니다.</span>';
    return false;
  }
}
/* ═══════════════════════════════════════════════════════════
   전체 자동 실행 — 3·4·5·8단계(AI가 붙은 단계)를 순서대로 이어서 돌린다.
   9단계 보고서는 절대 이 큐에 넣지 않는다. 미검증 항목을 사람이 확인하는
   절차는 자동화하지 않는다는 원칙이 여기서도 그대로 적용된다.

function toastRun(msg){
  var t = $('runtoast');
  if(!t){ t = document.createElement('div'); t.id='runtoast'; t.className='runtoast'; document.body.appendChild(t); }
  t.textContent = msg; t.style.display='block';
  clearTimeout(toastRun._h);
  toastRun._h = setTimeout(function(){ t.style.display='none'; }, 4500);
}
function pendingAISteps(){
  return [
    {id:'status',  라벨:'데이터 현황',   ok:function(){ return CUR.데이터.데이터셋.length>0; }},
    {id:'problem', 라벨:'문제 진단',     ok:function(){ return CUR.현황.발견.length>0 || CUR.진단.문제.length>0; }},
    {id:'case',    라벨:'정책 사례',     ok:function(){ return CUR.진단.문제.length>0; }},
    {id:'risk',    라벨:'리스크·대응',   ok:function(){ return !!CUR.정의.의사결정질문; }}
  ];
}
function runAll(){
  if(!CUR) return;
  if(DB.ai.mode==='api') runAllAPI(); else runAllBridgeStart();
}
async function runAllAPI(){
  if(!curAIProvider().key){ alert('API 키를 먼저 등록해 주세요.'); openAIConf(); return; }
  var order = pendingAISteps(), skipped=[];
  for(var i=0;i<order.length;i++){
    var st = order[i];
    if(!st.ok()){ skipped.push(st.라벨); continue; }
    go(st.id);
    toastRun((i+1)+'/'+order.length+'단계 진행 중 — '+st.라벨);
    var ok = await aiRun(st.id);
    if(ok===false){
      alert('「'+st.라벨+'」 단계에서 실패해 전체 실행을 멈췄습니다. 화면의 안내 메시지를 확인해 주세요.');
      return;
    }
  }
  go('home');
  alert('전체 자동 실행을 마쳤습니다.'+(skipped.length?' (건너뛴 단계 — 필요한 정보가 아직 없습니다: '+skipped.join(', ')+')':'')
    +' AI가 만든 항목은 미검증 상태입니다. 확인하신 뒤 검증 완료로 바꿔 주세요.');
}
var RUNQ = null;   // 브릿지 모드 순차 안내 큐. {list, idx}
function runAllBridgeStart(){
  var order = pendingAISteps().filter(function(st){ return st.ok(); });
  if(!order.length){ alert('아직 실행할 수 있는 AI 단계가 없습니다. 2단계에서 데이터를 먼저 넣어 주세요.'); return; }
  RUNQ = {list:order, idx:0};
  runAllBridgeStep();
}
function runAllBridgeStep(){
  if(!RUNQ) return;
  if(RUNQ.idx >= RUNQ.list.length){
    RUNQ = null; render(); go('home');
    alert('순서대로 안내를 마쳤습니다. 각 단계에서 붙여넣으신 결과를 확인하고 검증 완료로 바꿔 주세요.');
    return;
  }
  var st = RUNQ.list[RUNQ.idx];
  go(st.id);

  toastRun((RUNQ.idx+1)+'/'+RUNQ.list.length+'단계 — '+st.라벨+' 프롬프트를 복사했습니다. AI에 붙여넣고 결과를 이 화면 붙여넣기 칸에 넣은 뒤 «결과 반영»을 눌러 주세요. 다 되면 아래 바에서 다음 단계로 넘어가세요.');
}

// AI 응답에서 항목을 읽어 낸다. AI는 늘 "다음은 분석 결과입니다" 같은 서두와 맺음말을 붙이므로
// 형식을 지킨 줄부터 우선 찾고, 없을 때만 범위를 넓힌다. 그래야 인사말이 항목으로 섞이지 않는다.
function parseList(txt){
  var lines = txt.split('\n').map(function(L){ return L.trim(); }).filter(Boolean);
  function strip(s){ return s.replace(/^[-*•]\s*/,'').replace(/^\d+[.)]\s*/,'').replace(/\*\*/g,'').trim(); }
  function mk(s){
    var m = s.split(/\s*(?:::|\|)\s*/);
    return m.length>=2 ? {제목:m[0].trim(), 내용:m.slice(1).join(' | ').trim()} : {제목:'', 내용:s};
  }
  function heading(L){ return /^#{1,4}\s/.test(L); }

  // 1순위 — 구분자를 지킨 줄. AI가 형식을 따랐다는 뜻이다.
  var sep = lines.filter(function(L){ return /(?:::|\|)/.test(L) && !heading(L); });
  if(sep.length) return sep.map(function(L){ return mk(strip(L)); });

  // 2순위 — 목록 표시로 시작하는 줄. 서두 인사말이 여기서 걸러진다.
  var bul = lines.filter(function(L){ return /^(?:[-*•]|\d+[.)])\s+/.test(L); });
  if(bul.length) return bul.map(function(L){ return mk(strip(L)); });

  // 3순위 — 형식을 전혀 못 지킨 경우. 너무 짧은 줄과 제목 줄만 걸러 낸다.
  return lines.filter(function(L){ return L.length>=10 && !heading(L); }).map(function(L){ return mk(strip(L)); });
}

    });
    h += '</div>';

    var next = null;
    STEPS.forEach(function(s){ if(!next && s.검증 && pr.단계[s.id].채움<1) next=s; });
    if(next) h += '<div class="note"><b>다음에 하실 일 — '+next.번호+'. '+esc(next.제목)+'.</b> '
                + esc(pr.단계[next.id].미완.slice(0,3).join(' · ') || '내용을 채워 주세요.')
                + ' <button class="btn btn-sm btn-primary" style="margin-left:8px" onclick="go(\''+next.id+'\')">바로 가기</button></div>';

    h += '</div>';
  }

function createProj(){
  var n = prompt('과제 이름을 지어 주세요.\n예: 청년 인구 유출 대응 방안', '');
  if(n===null) return;
  var p = newProject(n.trim());
  DB.projects.push(p); DB.curId=p.id; CUR=p;
  save(); go('define');
}
function openProj(id){
  DB.curId=id; CUR = DB.projects.filter(function(p){return p.id===id;})[0]||null;
  save(); go('define');
}
function delProj(){
  if(!CUR) return;
  if(!confirm('「'+CUR.이름+'」 과제를 지웁니다. 되돌릴 수 없습니다. 계속하시겠습니까?')) return;
  DB.projects = DB.projects.filter(function(p){return p.id!==CUR.id;});
  CUR=null; DB.curId=null; save(); go('home');
}
function exportProj(){
  if(!CUR) return;
  download(CUR.이름.replace(/[\\/:*?"<>|]/g,'_')+'_과제.json',
    JSON.stringify({format:'정책분석-과제', version:1, 내보낸시각:new Date().toISOString(), 과제:CUR}, null, 2),
    'application/json');
}
function importProj(input){
  var f = input.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var d = JSON.parse(rd.result);
      var p = d.과제 || d;
      if(!p || !p.정의) throw new Error('과제 파일이 아닙니다.');
      p.id = 'P'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      // 예전 버전 파일에 없는 칸을 채워 넣는다.
      var base = newProject(p.이름);
      PROJ_MERGE_KEYS.forEach(function(k){ p[k] = Object.assign(base[k], p[k]||{}); });
      DB.projects.push(p); DB.curId=p.id; CUR=p; save(); go('home');
      alert('「'+p.이름+'」 과제를 불러왔습니다.');
    }catch(e){ alert('불러오지 못했습니다 — '+e.message); }
  };
  rd.readAsText(f);
  input.value='';
}

function importDS(input){
  var files = Array.prototype.slice.call(input.files), ok=0, ng=[];
  var left = files.length;
  files.forEach(function(f){
    var rd = new FileReader();
    rd.onload = function(){
      try{
        var d = JSON.parse(rd.result);
        if(d.format !== '정책분석-정제본') throw new Error('전처리툴이 만든 정제본이 아닙니다.');
        if(!d.열 || !d.데이터) throw new Error('열 또는 데이터가 없습니다.');
        CUR.데이터.데이터셋.push(d); ok++;
      }catch(e){ ng.push(f.name+' — '+e.message); }
      if(--left===0){ finish(); }
    };
    rd.onerror = function(){ ng.push(f.name+' — 읽지 못했습니다.'); if(--left===0) finish(); };
    rd.readAsText(f);
  });
  function finish(){
    save(); render();
    var el = $('dsmsg');
    if(el) el.innerHTML = (ok?'<span style="color:var(--positive)">✔ '+ok+'개를 불러왔습니다.</span> ':'')
      + (ng.length?'<span style="color:var(--negative)">'+esc(ng.join(' / '))+'</span>':'');
  }
  input.value='';
}
function delDS(i){
  if(!confirm('이 데이터를 목록에서 제거합니다. 계속하시겠습니까?')) return;
  CUR.데이터.데이터셋.splice(i,1);
  if(CUR.데이터.활성>=CUR.데이터.데이터셋.length) CUR.데이터.활성=0;
  save(); render();
}

  };
  JSON.stringify(스키마예시, null, 2).split('\n').forEach(function(line){ L.push(line); });

  L.push('- 「데이터」 배열의 각 행은 위 「열」 목록의 「이름」을 키로 쓰는 객체입니다. 열이 늘어나면 그만큼 키도 늘어납니다.');
  L.push('');

  L.push('1. 위 의사결정 질문과 가장 관련 있는 공공데이터를 찾아 주세요. 최신 자료를 우선해 주세요.');
  L.push('2. 데이터를 가져온 출처 URL을 처리이력에 반드시 남겨 주세요. 이것이 나중에 사람이 검증할 유일한 단서입니다.');
  L.push('3. 확인되지 않는 수치나 항목은 절대 지어내지 마세요. 원본에 없으면 빈 값으로 두고 채우지 마세요.');
  L.push('4. 표본이 작아 개인이 특정될 수 있는 소분류 항목(예: 응답자가 한두 명뿐인 세부 지역·연령 구간)은 데이터에 넣지 말고, 제외했다는 사실만 처리이력에 남겨 주세요.');
  L.push('5. 완성된 JSON을 "'+(CUR.정의.의사결정질문||'수집데이터').slice(0,20).replace(/[\\/:*?"<>|]/g,'_')+'.json" 파일로 만들어서 다운로드할 수 있게 해줘.');
  return L.join('\n');
}

/* ═══════════════════════════════════════════════════════════
   3단계 — 데이터 현황
   ═══════════════════════════════════════════════════════════ */
function kStatus(p){
  var m=[];
  if(!p.데이터.데이터셋.length) return {채움:0, 미완:['데이터를 먼저 불러와 주세요']};
  if(!p.현황.스캔시각) m.push('자동 분석 실행');
  if(!p.현황.발견.length) m.push('발견 채택');
  return {채움: 1 - m.length/2, 미완:m};
}
var UI = { ds:0, col:'', by:'', q:'', sigType:'', 열보기:false, collectOpen:false };   // 화면에서만 쓰는 상태. 저장하지 않는다.

var SIGTYPE = {
  그룹격차:{ic:'⚖️', cls:'b-bad'},   쏠림:{ic:'📊', cls:'b-warn'},   이상치:{ic:'📍', cls:'b-warn'},
  평균중앙괴리:{ic:'⚠️', cls:'b-warn'}, 시간추세:{ic:'📈', cls:'b-bad'}, 결측편중:{ic:'🕳️', cls:'b-warn'},
  수치상관:{ic:'🔗', cls:'b-info'},   빈출어:{ic:'💬', cls:'b-info'}, 급증어:{ic:'🔥', cls:'b-bad'},
  그룹특징어:{ic:'🎯', cls:'b-warn'}, 유사묶음:{ic:'👥', cls:'b-warn'}, 부정표현:{ic:'😟', cls:'b-bad'},
  재차제기:{ic:'🔁', cls:'b-bad'}
};
function curSignals(){
  var ds = CUR.데이터.데이터셋[UI.ds];
  if(!ds) return [];
  return scanDataset(ds);
}
function adopted(title){ return CUR.현황.발견.some(function(f){ return f.내용===title; }); }

// 같은 열이 그룹격차·수치상관 등 서로 다른 신호에 여러 번 등장하면
// "같은 항목인데 숫자가 다르다"는 오해를 산다. 실제로는 서로 다른 관계를 각각 잰 것이므로
// 열 단위로 한데 모아 보여 준다. scanDataset의 원래 신호 배열은 건드리지 않는다.
var VARSUM_TYPES = {그룹격차:1, 수치상관:1, 시간추세:1, 평균중앙괴리:1, 이상치:1};
function varSummary(sigs){
  var byCol = {};
  sigs.forEach(function(s){
    if(!VARSUM_TYPES[s.유형]) return;
    s.열.forEach(function(col){ (byCol[col] = byCol[col] || []).push(s); });
  });
  return Object.keys(byCol).filter(function(c){ return byCol[c].length >= 2; })
    .sort(function(a,b){ return byCol[b].length - byCol[a].length; })
    .map(function(c){ return {열:c, 신호:byCol[c]}; });
}

function vStatus(){
  var h = head('status');
  var list = CUR.데이터.데이터셋;
  if(!list.length){
    return h + '<div class="card"><div class="empty"><div class="big">📦</div>불러온 데이터가 없습니다.<br>2단계에서 정제본을 먼저 불러와 주세요.'
      + '<div class="actions" style="justify-content:center"><button class="btn btn-primary" onclick="go(\'data\')">2단계로 가기</button></div></div></div>';
  }
  if(UI.ds >= list.length) UI.ds = 0;
  var ds = list[UI.ds];
  if(!UI.col || !colMeta(ds, UI.col)) UI.col = (ds.열[0]||{}).이름 || '';

  var t0 = performance.now();
  var sigs = scanDataset(ds);
  var took = Math.round(performance.now()-t0);
  if(!CUR.현황.스캔시각){
    CUR.현황.스캔시각 = new Date().toISOString();
    save(true); setTimeout(renderNav, 0);   // 렌더 도중에 다시 그리지 않고 사이드바만 갱신한다
  }

  var types = {};
  sigs.forEach(function(s){ types[s.유형] = (types[s.유형]||0)+1; });
  var shown = UI.sigType ? sigs.filter(function(s){ return s.유형===UI.sigType; }) : sigs;

  /* ── 1. 자동 분석 결과 ── */
  h += '<div class="card"><h3>자동 분석 결과 — 앱이 찾은 신호 '+sigs.length+'건</h3>'
    + '<p class="desc">데이터를 열자마자 숫자와 낱말을 훑어 눈여겨볼 지점을 먼저 뽑아 드립니다. 전부 보실 필요 없이 위에서부터 확인하시면 됩니다.</p>'
    + '<div class="rowbar">'
    + '<span class="inline">데이터 <select onchange="UI.ds=+this.value;UI.col=\'\';UI.by=\'\';UI.q=\'\';UI.sigType=\'\';render()">'
      + list.map(function(d,i){ return '<option value="'+i+'"'+(i===UI.ds?' selected':'')+'>'+esc((d.카탈로그||{}).데이터셋명||d.원본파일||('데이터'+(i+1)))+'</option>'; }).join('')
    + '</select></span>'
    + '<button class="btn btn-sm" onclick="rescan()">다시 분석</button>'
    + '<span style="color:var(--text-secondary);font-size:.8rem">'+fmt(ds.행수)+'행 · '+took+'ms</span>'
    + '</div>';

  if(Object.keys(types).length > 1){
    h += '<div class="rowbar" style="gap:6px">'
      + '<button class="chip'+(UI.sigType?'':' on')+'" onclick="UI.sigType=\'\';render()">전체 '+sigs.length+'</button>'
      + Object.keys(types).sort(function(a,b){return types[b]-types[a];}).map(function(t){
          return '<button class="chip'+(UI.sigType===t?' on':'')+'" onclick="UI.sigType=\''+t+'\';render()">'
            + (SIGTYPE[t]?SIGTYPE[t].ic:'')+' '+t+' '+types[t]+'</button>';
        }).join('')
      + '</div>';
  }

  var vs = varSummary(sigs);
  if(vs.length){
    h += '<div class="note"><b>같은 항목이 여러 신호에 나올 수 있습니다.</b> 아래처럼 한 열이 여러 줄에 걸쳐 나오는 건 값이 어긋난 게 아니라, '
      + '<b>서로 다른 관계를 각각 잰 것</b>이기 때문입니다(상관계수·배수·표준화 차이는 서로 다른 잣대입니다 — 아래 「신호에 나오는 수치를 어떻게 읽나요?」 참고).</div>'
      + '<div class="checks" style="margin-bottom:14px">' + vs.map(function(row){
          return '<div class="checkrow"><span class="ic">🔗</span><b style="min-width:88px">'+esc(row.열)+'</b>'
            + '<span style="font-size:.83rem;color:var(--text-secondary)">'
            + row.신호.map(function(s){ return (SIGTYPE[s.유형]?SIGTYPE[s.유형].ic:'')+' '+esc(s.제목); }).join(' &nbsp;·&nbsp; ')
            + '</span></div>';
        }).join('') + '</div>';
  }

  if(!sigs.length){
    h += '<div class="empty">뚜렷한 신호를 찾지 못했습니다.<br>아래 「열별로 자세히 보기」에서 직접 살펴보시거나, AI 해석을 받아 보세요.</div>';
  } else {
    shown.forEach(function(s, i){
      var meta = SIGTYPE[s.유형] || {ic:'•', cls:'b-mute'};
      var done = adopted(s.제목);
      var gi = sigs.indexOf(s);
      h += '<div class="signal'+(done?' done':'')+'">'
        + '<div class="sh"><span class="sic">'+meta.ic+'</span>'
        + '<span class="badge '+meta.cls+'">'+s.유형+'</span>'
        + '<b>'+esc(s.제목)+'</b>'
        + (done ? '<span class="badge b-ok">채택함</span>'
                : '<button class="btn btn-sm btn-primary" onclick="adoptSig('+gi+')">채택</button>')
        + '</div>'
        + '<div class="sb">'+esc(s.근거)+'</div>'
        + (s.해석 ? '<div class="sread"><b>읽는 법</b> '+esc(s.해석)+'</div>' : '')
        + '<div class="scols">관련 열 — '+s.열.map(esc).join(' · ')+'</div>';
      if(s.원문 && s.원문.length){
        h += '<details class="sq"><summary>근거가 된 원문 '+s.원문.length+'건 보기</summary>'
          + s.원문.map(function(t){ return '<div class="quote"><div class="tx">'+esc(t.length>600?t.slice(0,600)+'…':t)+'</div></div>'; }).join('')
          + '</details>';
      }
      h += '</div>';
    });
    var hasText = sigs.some(function(s){ return ['빈출어','급증어','그룹특징어','유사묶음','부정표현','재차제기'].indexOf(s.유형)!==-1; });
    if(hasText){
      h += '<div class="note warn"><b>낱말 신호는 정교하지 않습니다.</b> 형태소 분석기 없이 조사와 어미를 규칙으로 떼어 센 결과라 잘못 잘린 낱말이 섞일 수 있습니다. '
        + '그래서 모든 낱말 신호에 근거가 된 원문을 붙여 두었습니다. <b>원문을 함께 확인하신 뒤 채택해 주세요.</b></div>';
    }
    h += legendHTML();
  }
  h += '</div>';

  /* ── 2. AI 해석 ── */
  h += aiBlock({
    id:'status',
    제목:'신호를 정책 시사점으로 바꾸기',
    설명:'위에서 찾은 신호의 수치와 원문을 AI에게 보내 정책적으로 무슨 뜻인지 해석받습니다. 앱이 계산한 수치를 근거로 주기 때문에 AI가 숫자를 지어낼 여지가 줄어듭니다.',
    프롬프트:function(){ return promptStatus(CUR.데이터.데이터셋[UI.ds], curSignals()); },
    파서:parseList,
    수용:function(items){
      items.forEach(function(it){
        CUR.현황.발견.push({내용:(it.제목? it.제목+' — ':'')+it.내용, 출처:'AI', 검증:false, 근거:null});
      });
      save(); render();
    }
  });

  /* ── 3. 채택한 발견 ── */
  h += '<div class="card"><h3>채택한 발견 '+CUR.현황.발견.length+'건</h3>'
    + '<p class="desc">여기 담긴 내용이 4단계에서 문제를 정리할 때 그대로 쓰입니다.</p>';
  if(CUR.현황.발견.length){
    CUR.현황.발견.forEach(function(f,i){
      var color = f.출처==='AI' ? 'var(--s4)' : (f.출처==='스캔' ? 'var(--positive)' : 'var(--accent)');
      h += '<div class="aiitem" style="border-left-color:'+color+'">'
        + '<div class="top"><b>'+esc(f.내용)+'</b>'
        + (f.출처==='AI'
            ? '<span class="badge '+(f.검증?'b-ok':'b-warn')+'">'+(f.검증?'검증 완료':'AI 초안 · 미검증')+'</span>'
              + '<button class="btn btn-sm" onclick="togFind('+i+')">'+(f.검증?'되돌리기':'검증 완료로')+'</button>'
            : '<span class="badge '+(f.출처==='스캔'?'b-ok':'b-info')+'">'+(f.출처==='스캔'?'자동 분석':'직접 입력')+'</span>')
        + '<button class="btn btn-sm btn-danger" onclick="delFind('+i+')">삭제</button></div>'
        + (f.근거 && f.근거.수치 ? '<div class="ev">'+esc(f.근거.수치)+'</div>' : '')
        + '</div>';
    });
  } else {
    h += '<div class="note">아직 채택한 내용이 없습니다. 위 신호에서 쓸 만한 것을 골라 «채택»을 눌러 주세요.</div>';
  }
  h += '<div class="field" style="margin-top:14px"><label>직접 덧붙이기</label>'
    + '<textarea rows="2" id="findin" placeholder="신호에 잡히지 않았지만 현장에서 아시는 내용을 적어 주세요."></textarea></div>'
    + '<div class="actions"><button class="btn" onclick="addFind()">+ 직접 추가</button></div>'
    + '</div>';

  /* ── 4. 열별로 자세히 보기 (검증용) ── */
  h += '<div class="card plain"><h3>열별로 자세히 보기</h3>'
    + '<p class="desc">신호가 맞는지 눈으로 확인하실 때 쓰시면 됩니다. 필요할 때만 펼쳐 보세요.</p>'
    + '<div class="rowbar">'
    + '<span class="inline">열 <select onchange="UI.col=this.value;UI.q=\'\';UI.열보기=true;render()">'
      + ds.열.map(function(c){ return '<option value="'+esc(c.이름)+'"'+(c.이름===UI.col?' selected':'')+'>'+esc(c.이름)+' ('+c.타입+')</option>'; }).join('')
    + '</select></span>';
  var cats2 = ds.열.filter(function(c){ return c.타입==='범주'||c.타입==='참거짓'; });
  var meta2 = colMeta(ds, UI.col);
  if(meta2 && meta2.타입==='수치' && cats2.length){
    h += '<span class="inline">나눠 보기 <select onchange="UI.by=this.value;UI.열보기=true;render()">'
      + '<option value="">전체</option>'
      + cats2.map(function(c){ return '<option value="'+esc(c.이름)+'"'+(c.이름===UI.by?' selected':'')+'>'+esc(c.이름)+'별</option>'; }).join('')
      + '</select></span>';
  }
  h += '<button class="btn btn-sm" onclick="UI.열보기=!UI.열보기;render()">'+(UI.열보기?'접기':'펼쳐 보기')+'</button></div>';
  if(UI.열보기) h += renderColView(ds, UI.col);
  h += '</div>';

  h += navBtns('status');
  return h;
}
// 신호에 붙은 수치를 어떤 기준으로 읽어야 하는지 정리해 둔다.
// 기준을 모르면 채택할지 말지 판단할 수 없다.
function legendHTML(){
  return '<details class="legend"><summary>신호에 나오는 수치를 어떻게 읽나요?</summary>'
  + '<h4 class="sub">상관계수</h4>'
  + '<p>두 수치가 같이 움직이는 정도를 <b>−1에서 +1 사이</b> 값으로 나타낸 것입니다. '

function renderColView(ds, name){
  var meta = colMeta(ds, name);
  if(!meta) return '';
  var vals = colVals(ds, name);
  var miss = vals.filter(function(v){return v===null||v===undefined||v==='';}).length;
  var h = '<div class="card"><h3>'+esc(name)+' <span class="badge b-info">'+meta.타입+'</span></h3>'
        + '<p class="desc">'+fmt(ds.행수)+'행 가운데 값이 있는 행 '+fmt(ds.행수-miss)+'개, 비어 있는 행 '+fmt(miss)+'개입니다.</p>';

  if(meta.타입==='수치'){
    var st = stats(vals);
    if(!st) return h+'<div class="empty">숫자로 읽을 수 있는 값이 없습니다.</div></div>';
    h += '<div class="tiles" style="margin-bottom:15px">'
      + tile('평균', fmt1(st.평균)+(meta.단위||'')) + tile('중앙값', fmt1(st.중앙)+(meta.단위||''))
      + tile('표준편차', fmt1(st.표준편차)) + tile('최소', fmt1(st.최소)) + tile('최대', fmt1(st.최대))
      + tile('사분위(Q1~Q3)', fmt1(st.Q1)+' ~ '+fmt1(st.Q3)) + '</div>';
    if(st.평균 && Math.abs(st.평균-st.중앙)/Math.max(Math.abs(st.평균),1) > 0.2)
      h += '<div class="note warn"><b>평균과 중앙값이 꽤 벌어져 있습니다.</b> 값이 한쪽으로 치우쳐 있다는 뜻이라, 평균만 보고 보고하시면 실제와 다른 인상을 줄 수 있습니다. 중앙값을 함께 쓰시는 편이 안전합니다.</div>';

    if(UI.by){
      var groups = {};
      ds.데이터.forEach(function(r){
        var g = r[UI.by]; if(g===null||g===undefined||g==='') return;
        var x = r[name]; if(typeof x!=='number'||isNaN(x)) return;
        (groups[String(g)] = groups[String(g)]||[]).push(x);
      });
      var items = Object.keys(groups).map(function(k){
        var s2=stats(groups[k]); return {라벨:keyLabel(k)+' (n='+s2.n+')', 값:s2.평균};
      }).sort(function(a,b){return b.값-a.값;});
      h += '<h4 class="sub">'+esc(UI.by)+'별 평균 '+esc(name)+'</h4><div class="chartbox">'+svgBars(items)+'</div>';
      if(items.length>1){
        var gap = items[0].값-items[items.length-1].값;
        var hi = items[0].라벨.split(' (')[0], lo = items[items.length-1].라벨.split(' (')[0];
        h += '<div class="note"><b>가장 높은 '+esc(withJosa(hi,'와/과'))+' 가장 낮은 '
          + esc(lo)+'의 차이가 '+fmt1(gap)+(meta.단위||'')+'입니다.</b> '
          + '이 격차가 정책으로 좁힐 수 있는 것인지 살펴보시면 좋습니다.</div>';
      }
    } else {
      h += '<h4 class="sub">값의 분포</h4><div class="chartbox">'+svgHist(vals,{축:name+(meta.단위?' ('+meta.단위+')':'')})+'</div>';
    }
  }
  else if(meta.타입==='범주' || meta.타입==='텍스트' || meta.타입==='참거짓'){
    var fr = freq(vals);
    if(!fr.length) return h+'<div class="empty">값이 없습니다.</div></div>';
    var mode = (meta.타입==='텍스트') ? textMode(vals) : 'bar';

    if(mode==='text'){
      var texts = vals.filter(function(v){ return typeof v==='string' && v!==''; });
      var mx=0, sm=0;
      texts.forEach(function(v){ if(v.length>mx) mx=v.length; sm+=v.length; });
      h += '<div class="note">서술형 답변으로 보여 그림 대신 내용을 그대로 보여 드립니다. 몇 건인지 세는 것보다 무슨 말이 적혀 있는지가 중요한 열입니다.</div>'
        + '<div class="tiles" style="margin-bottom:14px">'
        + tile('작성된 답변', fmt(texts.length)+'건')
        + tile('평균 길이', fmt(Math.round(sm/texts.length))+'자')
        + tile('가장 긴 답변', fmt(mx)+'자')
        + '</div>'
        + '<div class="rowbar"><span class="inline" style="flex:1;max-width:420px">'
        + '<input type="text" id="txtq" value="'+esc(UI.q||'')+'" placeholder="낱말로 걸러 보기 — 예: 자동화" '
        + 'oninput="filterText()" style="min-width:260px"></span>'
        + '<span id="txtcount" style="color:var(--text-secondary);font-size:.84rem">'+fmt(texts.length)+'건</span></div>'
        + '<div id="txtlist">' + textList(vals) + '</div>';
    }
    else if(mode==='id'){
      h += '<div class="note">행마다 값이 달라 식별자로 보입니다. 건수를 세도 모두 1건이라 그림을 그리지 않았습니다. '
        + '분석에는 쓰이지 않지만, 특정 응답을 되짚을 때 필요한 열입니다.</div>'
        + '<div class="tblwrap" style="max-height:240px"><table><thead><tr><th>값</th></tr></thead><tbody>'
        + fr.slice(0,60).map(function(f){return '<tr><td>'+esc(f.값)+'</td></tr>';}).join('')
        + '</tbody></table></div>'
        + (fr.length>60? '<div class="note">'+fmt(fr.length)+'가지 가운데 60개까지만 보여 드렸습니다.</div>' : '');
    }
    else {
      var tot = fr.reduce(function(a,b){return a+b.수;},0);
      h += '<h4 class="sub">값별 건수</h4><div class="chartbox">'
        + svgBars(fr.slice(0,18).map(function(f,i){return {라벨:keyLabel(f.값), 값:f.수, 색:PAL[i%6]};}),
                  {표기:function(d){return fmt(d.값)+'건 ('+Math.round(d.값/tot*100)+'%)';}})
        + '</div>';
      if(fr.length>18) h += '<div class="note">'+fmt(fr.length)+'가지 가운데 많은 순으로 18개까지 보여 드렸습니다.</div>';
      if(fr.length>1 && fr[0].수/tot > 0.7)
        h += '<div class="note warn"><b>'+esc(keyLabel(fr[0].값))+'에 '+Math.round(fr[0].수/tot*100)+'%가 몰려 있습니다.</b> 나머지 항목은 사례 수가 적어 비율로 비교하시면 오해를 부를 수 있습니다.</div>';
    }
  }
  else if(meta.타입==='날짜'){
    var byDate = {};
    vals.forEach(function(v){ if(!v) return; var k=String(v).slice(0,7); byDate[k]=(byDate[k]||0)+1; });
    var pts = Object.keys(byDate).sort().map(function(k){ return {x:k, y:byDate[k]}; });
    var partial = vals.filter(function(v){ return v && String(v).length===7; }).length;
    h += '<h4 class="sub">월별 건수</h4><div class="chartbox">'+svgLine(pts,{})+'</div>';
    if(partial) h += '<div class="note warn"><b>일자 없이 연-월만 있는 값이 '+fmt(partial)+'건 섞여 있습니다.</b> '
      + '전처리 단계에서 원본에 일자가 없어 채우지 않은 것입니다. 일 단위로 비교하실 때는 이 값들을 빼고 보셔야 합니다.</div>';
  }
  return h+'</div>';
}
// 서술형 답변을 읽기 좋게 늘어놓는다. 낱말로 거르면 걸린 부분에 표시가 남는다.
var TEXT_MAX = 200;
function textList(vals){
  var q = (UI.q||'').trim();
  var items = vals.filter(function(v){ return typeof v==='string' && v!==''; });
  var hit = q ? items.filter(function(v){ return v.indexOf(q) !== -1; }) : items;
  var cnt = $('txtcount');
  if(cnt) cnt.textContent = q ? (fmt(hit.length)+'건이 걸렸습니다 (전체 '+fmt(items.length)+'건)') : (fmt(items.length)+'건');
  if(!hit.length) return '<div class="empty">「'+esc(q)+'」이(가) 들어간 답변이 없습니다.</div>';
  var body = hit.slice(0, TEXT_MAX).map(function(v,i){
    var t = esc(v);
    if(q) t = t.split(esc(q)).join('<mark style="background:var(--cr-light-bg);color:var(--accent);padding:0 2px">'+esc(q)+'</mark>');
    return '<div class="quote"><span class="no">'+(i+1)+'</span><div class="tx">'+t+'</div></div>';
  }).join('');
  return '<div class="quotes">' + body + '</div>'
    + (hit.length>TEXT_MAX ? '<div class="note">앞의 '+TEXT_MAX+'건까지 보여 드렸습니다. 낱말로 걸러 보시면 범위를 좁힐 수 있습니다.</div>' : '');
}

var PROMPT_TEXT_LIMIT = 900;   // 원문 한 건이 프롬프트를 통째로 잡아먹지 않게 자른다

  if(sigs.length){

    sigs.slice(0, 18).forEach(function(s, i){

          var x = t.replace(/\s+/g,' ').trim();

        });
      }
    });
    if(sigs.length > 18) L.push('(신호 '+sigs.length+'건 가운데 중요한 순으로 18건만 실었습니다)');
  } else {

  if(CUR.현황.발견.length){

  L.push('   - 짧은제목 :: 무엇이 관찰되는지와 그래서 무엇을 검토해야 하는지');
  L.push('3. 위에 제시된 수치와 원문만 근거로 삼아 주세요. 없는 통계를 지어내지 마세요.');
  L.push('4. 여러 신호가 하나의 원인을 가리키면 묶어서 설명해 주세요. 신호를 그대로 옮겨 적기만 하는 것은 도움이 되지 않습니다.');
  L.push('5. 표본이 작거나 집계단위 때문에 단정할 수 없으면 그 한계를 함께 적어 주세요.');
  L.push('6. 낱말 신호는 형태소 분석 없이 기계적으로 센 것이라 부정확할 수 있습니다. 원문과 어긋나면 원문을 따라 주세요.');
  return L.join('\n');
}

/* ═══════════════════════════════════════════════════════════

function kProblem(p){

  if(weak) m.push(weak+'건의 근본원인·개입지점');
  return {채움: weak? 0.6 : 1, 미완:m};
}

function fromFinds(){

/* ═══════════════════════════════════════════════════════════
   5단계 — 정책 사례
   남의 해법을 그대로 옮기면 실패한다. 그래서 폐지·축소 사유와
   우리와의 격차를 필수로 받는다. 성공 사례보다 실패 사례가 더 값지다.
   ═══════════════════════════════════════════════════════════ */
var 사례상태 = ['유지','확대','축소','폐지'];
var 상태배지 = {유지:'b-info', 확대:'b-ok', 축소:'b-warn', 폐지:'b-bad'};
var 격차항목 = {
  인구:{라벨:'인구 규모', 보기:['우리보다 큼','비슷','우리보다 작음']},
  재정:{라벨:'재정자립도', 보기:['우리보다 높음','비슷','우리보다 낮음']},
  도농:{라벨:'도농 형태', 보기:['같음','다름']}
};
function newCase(){
  return {id:'C'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),

    상태:'유지', 중단사유:'', 격차:{인구:'비슷', 재정:'비슷', 도농:'같음'},
    출처URL:'', 확인:{조례:false, 예산:false, 성과:false}, 출처구분:'직접'};
}
// AI가 만든 사례는 항목을 하나하나 확인해야 검증으로 친다. 직접 적은 것은 그대로 인정한다.
function caseVerified(c){
  if(c.출처구분 !== 'AI') return true;
  return c.확인.조례 && c.확인.예산 && c.확인.성과;
}
// 우리와 조건이 많이 다르면 그대로 옮길 수 없다. 「저기서 됐다」가 「여기서 된다」를 뜻하지 않는다.
function gapScore(c){
  var n = 0;
  if(c.격차.인구 !== '비슷') n++;
  if(c.격차.재정 !== '비슷') n++;
  if(c.격차.도농 !== '같음') n++;
  return n;
}
function kCase(p){
  var m = [];
  if(!p.사례.목록.length) return {채움:0, 미완:['정책 사례 수집']};
  var un = p.사례.목록.filter(function(c){ return !caseVerified(c); }).length;
  var noStop = p.사례.목록.filter(function(c){ return (c.상태==='폐지'||c.상태==='축소') && !c.중단사유; }).length;
  if(un) m.push(un+'건 출처 확인');
  if(noStop) m.push(noStop+'건 중단 사유');
  var kinds = {};
  p.사례.목록.forEach(function(c){ kinds[c.상태] = 1; });
  if(!kinds['폐지'] && !kinds['축소']) m.push('중단·축소 사례');
  return {채움: 1 - Math.min(m.length,3)/3, 미완:m};
}

  var h = head('case');

     + '성공 사례만 모으면 보고서는 그럴듯해지지만 의회에서 「그럼 왜 ○○시는 접었나요」 한마디에 무너집니다.</div>';

  var lever = [];

          return '<div class="checkrow"><span class="ic">⇒</span>'+esc(l)+'</div>';
        }).join('') + '</div></div>';
  }

  h += '<div class="card"><h3>사례 목록 '+list.length+'건</h3>'
    + '<p class="desc">한 사례가 한 장입니다. 지금 어떤 상태인지와 우리와 무엇이 다른지를 꼭 채워 주세요.</p>'
    + '<div class="actions"><button class="btn btn-primary" onclick="addCase()">+ 사례 추가</button></div>';
  if(!list.length) h += '<div class="empty"><div class="big">🗂️</div>아직 모은 사례가 없습니다.<br>직접 추가하시거나 아래 AI 도움을 받아 보세요.</div>';
  h += '</div>';

  var 상태수 = {};
  list.forEach(function(c){ 상태수[c.상태] = (상태수[c.상태]||0)+1; });
  if(list.length){
    h += '<div class="tiles" style="margin-bottom:18px">'
      + 사례상태.map(function(st){ return tile(st, (상태수[st]||0)+'건', st==='폐지'&&상태수[st]?'bad':''); }).join('')
      + tile('출처 미확인', list.filter(function(c){return !caseVerified(c);}).length+'건',
             list.filter(function(c){return !caseVerified(c);}).length?'warn':'ok')
      + '</div>';
  }

  list.forEach(function(c, i){
    var ok = caseVerified(c), gaps = gapScore(c);
