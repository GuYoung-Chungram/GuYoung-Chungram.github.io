/* ═══════════════════════════════════════════════════════════
   6단계 — 대안 비교
   가중치를 조금 바꿨을 때 순위가 뒤집히는지 보여 주는 것이 핵심이다.
   뒤집히는 줄 모르고 1위를 보고하면 나중에 근거가 무너진다.
   ═══════════════════════════════════════════════════════════ */
var ALT_KEYS = ['효과성','적시성','실현성','비용효율','형평성','수용성','지속가능성'];
var ALT_DESC = {
  효과성:'문제를 실제로 얼마나 줄입니까 (5=크게 줄임)',
  적시성:'결정 시한 안에 실행할 수 있습니까 (5=바로 가능)',
  실현성:'법적·조직적으로 막히는 데가 없습니까 (5=제약 없음)',
  비용효율:'들인 돈에 비해 효과가 큽니까 (5=매우 효율적)',
  형평성:'혜택이 고르게 돌아갑니까 (5=매우 고름)',
  수용성:'주민과 의회가 받아들이겠습니까 (5=반발 없음)',
  지속가능성:'몇 해 뒤에도 유지될 수 있습니까 (5=자립 가능)'
};
function newAlt(name){
  var s = {};
  ALT_KEYS.forEach(function(k){ s[k] = 3; });
  return {id:'A'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    이름:name||'', 설명:'', 근거사례:'', 점수:s, 메모:''};
}
function altScore(a, w){
  var t = 0, sum = 0;
  ALT_KEYS.forEach(function(k){ t += (a.점수[k]||0)*(w[k]||0); sum += (w[k]||0); });
  return sum ? t/sum : 0;
}
function altRank(list, w){
  return list.map(function(a){ return {a:a, s:altScore(a,w)}; })
             .sort(function(x,y){ return y.s - x.s; });
}
// 순위가 얼마나 튼튼한지 세 가지로 확인한다.
//   ① 무게를 ±50% 흔들었을 때 1위가 바뀌는가
//   ② 기준을 하나만 보면 누가 1위인가 — 답이 기준 선택에 좌우되는지 드러난다
//   ③ 모든 기준을 같은 무게로 두면 1위가 그대로인가
// ②가 실무에서 가장 쓸모 있다. 「적시성만 보면 A, 효과성만 보면 B」를 알아야 무게를 정한 이유를 방어할 수 있다.
function sensitivity(list, w){
  if(list.length < 2) return null;
  var base = altRank(list, w), top = base[0].a.id;
  var gap = base[0].s - base[1].s;

  var flips = 0, trials = 0, causes = [];
  ALT_KEYS.forEach(function(k){
    [-0.5, 0.5].forEach(function(dl){
      var w2 = {};
      ALT_KEYS.forEach(function(x){ w2[x] = w[x]; });
      w2[k] = Math.max(0, w[k]*(1+dl));
      trials++;
      if(altRank(list, w2)[0].a.id !== top){
        flips++;
        if(causes.indexOf(k) < 0) causes.push(k);
      }
    });
  });

  var solo = {}, winners = {};
  ALT_KEYS.forEach(function(k){
    var w2 = {};
    ALT_KEYS.forEach(function(x){ w2[x] = (x===k ? 1 : 0); });
    var r = altRank(list, w2);
    var tie = (r.length>1 && Math.abs(r[0].s - r[1].s) < 0.001);
    solo[k] = {이름: r[0].a.이름 || '이름 없음', id: r[0].a.id, 동점: tie};
    if(!tie) winners[r[0].a.id] = 1;
  });
  var distinct = Object.keys(winners).length;

  var eq = {};
  ALT_KEYS.forEach(function(k){ eq[k] = 1; });
  var eqRank = altRank(list, eq);

  return {gap:gap, flips:flips, trials:trials, causes:causes, base:base,
          solo:solo, distinct:distinct, eqSame:(eqRank[0].a.id===top), eqTop:eqRank[0].a.이름};
}
function kAlt(p){
  var m = [];
  if(p.대안.목록.length < 2) return {채움: p.대안.목록.length?0.4:0, 미완:['대안 2개 이상']};
  var noName = p.대안.목록.filter(function(a){ return !a.이름; }).length;
  if(noName) m.push(noName+'건 이름');
  return {채움: m.length?0.7:1, 미완:m};
}

      + '<div class="grid2">'
      + fld('어떤 방식입니까', '<input type="text" value="'+esc(a.설명)+'" oninput="CUR.대안.목록['+i+'].설명=this.value;save()" placeholder="한 문장으로">')
      + fld('참고한 사례', '<input type="text" value="'+esc(a.근거사례)+'" oninput="CUR.대안.목록['+i+'].근거사례=this.value;save()" placeholder="5단계에서 본 사례가 있으면">')
      + '</div>'
      + '<div class="scoregrid">'
      + ALT_KEYS.map(function(k){
          return '<div class="sc"><label title="'+esc(ALT_DESC[k])+'">'+k+'</label>'
            + '<select onchange="CUR.대안.목록['+i+'].점수[\''+k+'\']=+this.value;save();render()">'
            + [1,2,3,4,5].map(function(v){ return '<option value="'+v+'"'+(a.점수[k]===v?' selected':'')+'>'+v+'</option>'; }).join('')
            + '</select></div>';
        }).join('')
      + '</div></div>';
  });

  if(list.length >= 2){
    h += '<div class="card"><h3>기준의 무게</h3>'
      + '<p class="desc">우리 상황에서 무엇이 더 중요한지에 따라 조절하세요. 옆의 순위가 바로 바뀝니다.</p>';
    ALT_KEYS.forEach(function(k){
      h += '<div class="wrow"><label>'+k+'<span class="wd">'+ALT_DESC[k]+'</span></label>'
        + '<input type="range" min="0" max="30" value="'+w[k]+'" oninput="CUR.대안.가중치[\''+k+'\']=+this.value;save();render()">'
        + '<span class="wv">'+w[k]+'</span></div>';
    });
    var tot = ALT_KEYS.reduce(function(x,k){ return x + w[k]; }, 0);
    h += '<div class="actions"><button class="btn btn-sm" onclick="resetWeight()">기본값으로</button>'
      + '<span style="font-size:.83rem;color:var(--text-secondary)">합계 '+tot+' — 합이 얼마든 비율로 계산하므로 100에 맞추지 않으셔도 됩니다.</span></div></div>';

    var sen = sensitivity(list, w), rk = sen.base;
    h += '<div class="card"><h3>비교 결과</h3>'
      + '<p class="desc">칸의 색이 진할수록 높은 점수입니다. 총점은 무게를 반영한 5점 만점 평균입니다.</p>'
      + '<div class="tblwrap"><table class="hm"><thead><tr><th>순위</th><th>대안</th>'
      + ALT_KEYS.map(function(k){ return '<th title="'+esc(ALT_DESC[k])+'">'+k+'</th>'; }).join('')
      + '<th>총점</th></tr></thead><tbody>';
    rk.forEach(function(r, i){
      h += '<tr'+(i===0?' class="win"':'')+'><td class="num">'+(i+1)+'</td>'
        + '<td><b>'+esc(r.a.이름||'이름 없음')+'</b></td>'
        + ALT_KEYS.map(function(k){ return '<td class="v'+r.a.점수[k]+'">'+r.a.점수[k]+'</td>'; }).join('')
        + '<td class="num"><b>'+fmt1(Math.round(r.s*100)/100)+'</b></td></tr>';
    });
    h += '</tbody></table></div>';

    h += '<h4 class="sub">기준을 하나만 놓고 보면 누가 1위입니까</h4>'
      + '<p class="desc">무게를 어떻게 정하느냐에 따라 답이 달라지는지 보여 드립니다. 답이 갈린다면 «무게를 그렇게 정한 이유»가 곧 보고서의 핵심 논거가 됩니다.</p>'
      + '<div class="solo">'
      + ALT_KEYS.map(function(k){
          var v = sen.solo[k];
          return '<div class="srow'+(v.id===rk[0].a.id?' same':'')+'"><span class="sk">'+k+'</span>'
            + '<span class="sv">'+esc(v.이름)+(v.동점?' <span class="badge b-mute">동점</span>':'')+'</span></div>';
        }).join('')
      + '</div>';

    if(sen.flips > 0){
      h += '<div class="note bad"><b>⚠️ 순위가 튼튼하지 않습니다.</b> 기준의 무게를 50% 바꿔 봤더니 '
        + sen.trials+'번 중 <b>'+sen.flips+'번</b> 1위가 달라졌습니다. 특히 <b>'+sen.causes.join(' · ')+'</b>의 무게에 결과가 흔들립니다. '
        + '이 상태로 「'+esc(rk[0].a.이름||'1위 대안')+'이 가장 낫다」고 보고하시면, 의회에서 기준을 문제 삼는 순간 근거가 무너집니다. '
        + '<b>무게를 그렇게 정한 이유</b>를 먼저 정리하시거나 두 대안을 함께 올리세요.</div>';
    } else if(sen.distinct >= 3){
      h += '<div class="note bad"><b>⚠️ 기준에 따라 답이 갈립니다.</b> 기준 하나씩만 놓고 보면 1위가 '+sen.distinct+'가지로 나뉩니다. '
        + '지금 순위는 «무게를 이렇게 정했기 때문에» 나온 결과입니다. 무게를 정한 근거를 보고서에 함께 적지 않으면 '
        + '「왜 효과성을 그렇게 크게 봤나」는 질문에 답할 수 없습니다.</div>';
    } else if(sen.gap < 0.15){
      h += '<div class="note warn"><b>1위와 2위가 사실상 동률입니다.</b> 차이가 '+fmt1(Math.round(sen.gap*100)/100)+'점에 그칩니다. '
        + '점수로 고르지 마시고 다른 잣대(되돌릴 수 있는지, 작게 먼저 해 볼 수 있는지)로 판단하세요.</div>';
    } else if(!sen.eqSame){
      h += '<div class="note warn"><b>무게를 모두 같게 두면 1위가 바뀝니다.</b> 같은 무게일 때는 「'+esc(sen.eqTop)+'」가 앞섭니다. '
        + '지금 순위는 무게 설정에 기대고 있으니, 그 설정을 설명할 수 있어야 합니다.</div>';
    } else {
      h += '<div class="note ok"><b>순위가 안정적입니다.</b> 무게를 50% 흔들어도, 모두 같은 무게로 두어도 1위가 그대로이고 2위와 '
        + fmt1(Math.round(sen.gap*100)/100)+'점 차이가 납니다. 「'+esc(rk[0].a.이름||'1위 대안')+'」을 권고안으로 올리셔도 근거가 섭니다.</div>';
    }
    h += '</div>';
  }
  h += navBtns('alt');
  return h;
}
function addAlt(n){ CUR.대안.목록.push(newAlt(n)); save(); render(); }
function delAlt(i){ if(!confirm('이 대안을 삭제합니다. 계속하시겠습니까?')) return; CUR.대안.목록.splice(i,1); save(); render(); }
function resetWeight(){ CUR.대안.가중치 = defaultWeight(); save(); render(); }
function defaultWeight(){ return {효과성:20, 적시성:15, 실현성:15, 비용효율:15, 형평성:10, 수용성:15, 지속가능성:10}; }
function altFromCase(){
  var n = 0;
  CUR.사례.목록.forEach(function(c){
    if(c.상태==='폐지') return;   // 접은 사례를 그대로 대안으로 올리지 않는다
    var nm = (c.사업명||c.지자체) + ' 방식';
    if(CUR.대안.목록.some(function(a){ return a.이름===nm; })) return;
    var a = newAlt(nm);
    a.설명 = c.전달체계 || c.대상 || '';
    a.근거사례 = c.지자체 + ' ' + c.사업명;
    // 우리와 조건이 다를수록 실현성을 낮게 잡아 둔다. 그대로 옮길 수 없기 때문이다.
    a.점수.실현성 = Math.max(1, 4 - gapScore(c));
    CUR.대안.목록.push(a);
    n++;
  });
  save(); render();
  alert(n ? n+'건을 대안으로 옮겼습니다. 점수를 확인해 주세요.' : '옮길 사례가 없습니다. 폐지된 사례는 대안으로 올리지 않습니다.');
}

/* ═══════════════════════════════════════════════════════════
   7단계 — 재원·일정
   「적시성」의 실체가 여기서 나온다. 예산 편성 일정에서 역산하지 않으면
   아무리 좋은 대안도 한 해를 통째로 넘긴다.
   ═══════════════════════════════════════════════════════════ */
function kFund(p){
  var m = [];
  var f = p.재원;
  if(!f.단가 || !f.대상수) m.push('소요 예산 추계');
  if(!f.조례) m.push('조례 필요 여부');
  var r = f.재원, sum = r.자체+r.국비+r.도비+r.기금;
  if(sum !== 100) m.push('재원 구성 100%');
  return {채움: 1 - Math.min(m.length,3)/3, 미완:m};
}
function fundTotal(){
  var f = CUR.재원;
  return (Number(f.단가)||0) * (Number(f.대상수)||0) * (Number(f.회차)||1);
}
function 억(n){
  if(!n) return '0원';
  if(n >= 100000000) return fmt1(Math.round(n/10000000)/10)+'억원';
  if(n >= 10000) return fmt(Math.round(n/10000))+'만원';
  return fmt(n)+'원';
}
// 지방자치법은 예산안 제출과 의결 기한을 회계연도 시작일 기준으로 정하고 있다.
// 시·도와 시·군·구가 다르므로 유형에 따라 날짜가 바뀐다.
function budgetPlan(){
  var f = CUR.재원;
  var y = Number(f.대상연도) || (new Date().getFullYear()+1);
  var 시도 = (f.유형 === '시도');
  var out = [];
  if(f.요구서마감) out.push({일자:f.요구서마감, 이름:'부서 예산요구서 제출', 근거:'지자체 내부 일정 (부서에서 정한 날짜)'});
  out.push({일자:(y-1)+'-'+(시도?'11-11':'11-21'), 이름:'예산안 지방의회 제출',
            근거:'지방자치법 — 회계연도 시작 '+(시도?'50':'40')+'일 전까지'});
  out.push({일자:(y-1)+'-'+(시도?'12-16':'12-21'), 이름:'지방의회 의결',
            근거:'지방자치법 — 회계연도 시작 '+(시도?'15':'10')+'일 전까지'});
  if(f.조례==='제정 필요' || f.조례==='개정 필요'){
    // 입법예고와 의회 심의에 시간이 걸린다. 예산안 제출 전에 끝나 있어야 안전하다.
    out.push({일자:(y-1)+'-'+(시도?'09-11':'09-21'), 이름:'조례 '+f.조례.replace(' 필요','')+' 착수 권장',
              근거:'입법예고와 의회 심의에 통상 두 달 이상 걸립니다. 예산안 제출 두 달 전을 권장 시점으로 잡았습니다'});
  }
  return out.sort(function(a,b){ return a.일자 < b.일자 ? -1 : 1; });
}

function vFund(){
  var h = head('fund');
  var f = CUR.재원, tot = fundTotal();

  h += '<div class="note"><b>여기서 「적시성」의 실체가 나옵니다.</b> 아무리 좋은 대안도 예산 편성 일정을 놓치면 한 해를 통째로 넘깁니다. '
     + '지금 며칠 남았는지를 먼저 보시고 대안을 다시 살펴보세요.</div>';

  h += '<div class="card"><h3>소요 예산 추계</h3>'
    + '<p class="desc">단가 × 대상 수 × 횟수로 대략을 잡습니다. 정밀 산출은 예산부서와 협의하실 때 다듬으시면 됩니다.</p>'
    + '<div class="grid3">'
    + fld('1인(건)당 단가 (원)', '<input type="number" value="'+(f.단가||'')+'" oninput="CUR.재원.단가=+this.value;save();render()" placeholder="예: 200000">')
    + fld('대상 수', '<input type="number" value="'+(f.대상수||'')+'" oninput="CUR.재원.대상수=+this.value;save();render()" placeholder="예: 1200">')
    + fld('연간 횟수', '<input type="number" value="'+(f.회차||1)+'" oninput="CUR.재원.회차=+this.value;save();render()" placeholder="예: 12">')
    + '</div>'
    + '<div class="tiles"><div class="tile" style="border-color:var(--accent)"><div class="k">연간 소요액</div>'
    + '<div class="v" style="font-size:1.7rem">'+억(tot)+'</div>'

    + '</div></div>';

  var r = f.재원, sum = r.자체+r.국비+r.도비+r.기금;
  h += '<div class="card"><h3>재원 구성</h3>'

    + '<div class="grid2">'
    + ['자체','국비','도비','기금'].map(function(k){
        return fld(k+' (%)', '<input type="number" min="0" max="100" value="'+r[k]+'" oninput="CUR.재원.재원[\''+k+'\']=+this.value;save();render()">'
          + '<div class="hint">'+억(tot*r[k]/100)+'</div>');
      }).join('')
    + '</div>'
    + (sum!==100 ? '<div class="note warn"><b>합이 '+sum+'%입니다.</b> 100%가 되도록 맞춰 주세요.</div>'
                 : '<div class="note ok">합계 100%입니다. 자체 부담은 '+억(tot*r.자체/100)+'입니다.</div>')
    + (r.국비>0 ? '<div class="note warn"><b>국비가 들어갑니다.</b> 국고보조사업은 매칭 비율과 신청 시기가 별도로 정해져 있습니다. '
        + '해당 부처 지침을 먼저 확인하셔야 하며, 신청 시기를 놓치면 자체 재원으로 전액을 메워야 합니다.</div>' : '')
    + '</div>';

  h += '<div class="card"><h3>법적 절차</h3>'
    + '<p class="desc">조례가 필요한지에 따라 일정이 두 달 이상 앞당겨집니다.</p>'
    + '<div class="grid2">'
    + fld('기관 유형', '<select onchange="CUR.재원.유형=this.value;save();render()">'
        + ['시군구','시도'].map(function(t){ return '<option value="'+t+'"'+(f.유형===t?' selected':'')+'>'+(t==='시도'?'시·도 (광역)':'시·군·구 (기초)')+'</option>'; }).join('')
        + '</select>')
    + fld('적용 연도', '<input type="number" value="'+(f.대상연도||new Date().getFullYear()+1)+'" oninput="CUR.재원.대상연도=+this.value;save();render()">')
    + '</div>'
    + '<div class="grid2">'
    + fld('조례 필요 여부', '<select onchange="CUR.재원.조례=this.value;save();render()">'
        + ['','불필요','개정 필요','제정 필요','확인 필요'].map(function(t){ return '<option value="'+t+'"'+(f.조례===t?' selected':'')+'>'+(t||'선택해 주세요')+'</option>'; }).join('')
        + '</select>')
    + fld('부서 예산요구서 제출일 (아시는 경우)', '<input type="date" value="'+esc(f.요구서마감||'')+'" oninput="CUR.재원.요구서마감=this.value;save();render()">')
    + '</div>'
    + (f.조례==='확인 필요' ? '<div class="note warn"><b>조례 필요 여부부터 확인하셔야 합니다.</b> 이걸 모른 채 예산만 세우면 '

    + '</div>';

  var plan = budgetPlan(), today = new Date(new Date().toDateString()).getTime();
  h += '<div class="card"><h3>일정 역산</h3>'
    + '<p class="desc">'+(f.유형==='시도'?'시·도':'시·군·구')+' 기준입니다. 지방자치법이 정한 기한에서 거꾸로 세었습니다.</p>'
    + '<div class="timeline">';
  plan.forEach(function(x){
    var d = Math.round((new Date(x.일자+'T00:00:00').getTime()-today)/86400000);

      + '<div class="dd">'+(d<0 ? '<span class="badge b-bad">'+Math.abs(d)+'일 지남</span>'

      + '올해 본예산으로는 어렵습니다. <b>추경을 노리시거나 적용 연도를 다음 해로 미루셔야 합니다.</b> '

    h += '<div class="note'+(dl<30?' warn':'')+'"><b>1단계에서 정하신 결정 시한은 '+CUR.정의.결정시한+'</b>이고 '
      + (dl<0 ? '<b>'+Math.abs(dl)+'일 지났습니다.</b>' : '<b>'+dl+'일</b> 남았습니다.')
      + ' 위 일정 가운데 가장 이른 것보다 늦다면 시한을 앞당기셔야 합니다.</div>';
  }
  h += '</div>';
  h += navBtns('fund');
  return h;
}

/* ═══════════════════════════════════════════════════════════
   8단계 — 리스크 레지스터 + 의회·언론 반박 Q&A
   좋은 대안도 리스크를 안 짚으면 의회에서 한마디에 막힌다.

function kRisk(p){
  var m=[];
  if(!p.리스크.목록.length) return {채움:0, 미완:['리스크 등록']};
  var weak = p.리스크.목록.filter(function(r){ return !r.대응방안; }).length;
  if(weak) m.push(weak+'건 대응방안');

  p.리스크.목록.forEach(function(r){ kinds[r.유형]=1; });
  if(Object.keys(kinds).length<2) m.push('유형 다양성 — 한 가지 유형에만 몰려 있습니다');
  return {채움: 1 - Math.min(m.length,2)/2, 미완:m};

// "R :: 유형 :: 설명 :: 발생가능성 :: 영향 :: 대응유형 :: 대응방안" 과 "Q :: 질문 :: 답변초안" 두 형식을 함께 읽는다.
function parseRiskQA(txt){
  var lines = txt.split('\n').map(function(L){ return L.trim(); }).filter(Boolean);
  var out = [];
  lines.forEach(function(L){
    var parts = L.replace(/^[-*•]\s*/,'').split(/\s*::\s*/);
    if(parts[0]==='R' && parts.length>=7){
      out.push({종류:'R', 유형:parts[1].trim(), 설명:parts[2].trim(),
        발생가능성:Math.min(5,Math.max(1,+parts[3]||3)), 영향:Math.min(5,Math.max(1,+parts[4]||3)),
        대응유형:parts[5].trim(), 대응방안:parts.slice(6).join(' :: ').trim()});
    } else if(parts[0]==='Q' && parts.length>=3){
      out.push({종류:'Q', 질문:parts[1].trim(), 답변초안:parts.slice(2).join(' :: ').trim()});
    }
  });
  return out;
}

function verifiedQA(){ return CUR.리스크.QA.filter(function(q){ return q.출처!=='AI' || q.검증; }); }

  return (CUR.현황.발견.length-verifiedFinds().length) + (CUR.진단.문제.length-verifiedProbs().length)
    + (CUR.사례.목록.length-verifiedCases().length) + (CUR.리스크.목록.length-verifiedRisks().length)

}

function navBtns(id){

var TAGSEQ = 0;
function tagInput(path, arr, ph){
  var id = 'tg'+(++TAGSEQ);
  var h = '<div class="tagin" onclick="document.getElementById(\''+id+'\').focus()">';
  (arr||[]).forEach(function(v,i){
    h += '<span class="tag">'+esc(v)+'<button onclick="event.stopPropagation();tagDel(\''+path+'\','+i+')" aria-label="삭제">×</button></span>';
  });
  h += '<input id="'+id+'" type="text" placeholder="'+esc(ph||'')+'" onkeydown="tagKey(event,\''+path+'\')"></div>';
  return h;
}
function tagArr(path){
  var ks = path.split('.'), o = CUR;
  for(var i=0;i<ks.length;i++) o = o[ks[i]];
  return o;
}
function tagKey(e, path){
  if(e.key!=='Enter') return;
  e.preventDefault();
  var v = e.target.value.trim();
  if(!v) return;
  tagArr(path).push(v); e.target.value='';
  save(); render();
}
function tagDel(path, i){ tagArr(path).splice(i,1); save(); render(); }

    var dis = (s.id!=='home' && !CUR);
    h += '<button class="navitem '+(VIEW===s.id?'active':'')+(r&&r.채움>=1?' done':'')+'" '
      + (dis?'disabled ':'') + 'onclick="go(\''+s.id+'\')">'
      + '<span class="n">'+(s.번호||'🏠')+'</span><span>'+esc(s.제목)+'</span>'
      + (r? '<span class="tick">'+(r.채움>=1?'✓':Math.round(r.채움*100)+'%')+'</span>':'')
      + '</button>';
  });
  // sec를 되돌리지 않는다. 되돌리면 앞 단계와 같은 구역 이름이 한 번 더 찍힌다.
  COMING.forEach(function(c){
    if(c.구역!==sec){ sec=c.구역; h += '<div class="navsec">'+sec+'</div>'; }
    h += '<button class="navitem" disabled><span class="n">'+c.번호+'</span><span>'+c.제목+'</span><span class="tick">🔒</span></button>';
  });
  $('navlist').innerHTML = h;
}
function render(){
  if(VIEW!=='home' && !CUR) VIEW='home';
  renderNav();
  $('main').innerHTML = stepById(VIEW).렌더();
  renderRunBar();
}

/* ═══════════════ 시작 ═══════════════ */
load();
VIEW = CUR ? 'home' : 'home';
render();
</script>
</body>
</html>
