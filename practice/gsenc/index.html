<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PREP LAB 보고 연습장</title>
<meta name="description" content="신입사원을 위한 PREP 보고 실습 앱. 상황을 선택하고 직접 작성하면 모범 답안과 항목별 피드백을 제공합니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* ==========================================================================
   J-STYLE (제이스타일) — Connect AI Lab 실습 페이지 원본 스타일
   출처: aicitybuilders.com/dubbing 에서 추출·정리. 캐스케이드 순서를 그대로 유지합니다.
   구성: 1 토큰/리셋 · 2 배경 · 3 탑바/버튼 · 4 히어로/오브 · 5 KPI · 6 레일 · 7 섹션/셀 라벨
         8 코드박스 · 9 시각화 카드(.vis)와 부품들 · 10 차트/가격 · 11 푸터 · 12 반응형
         13 폴리시(입체감) 레이어 · 14 필름 플레이어
   ========================================================================== */

/* ---------- 1. 토큰 / 리셋 ---------- */
:root{
  --bg:#06080b; --bg2:#0d1117; --line:#1f2630; --fg:#fff; --dim:#97a3b0;
  --acc:#b8ff5c;   /* 형광 라임: 메인 강조 */
  --vio:#b79dff;   /* 보라: 비교 대상/보조 */
  --gold:#ffd447;  /* 금색: 주의·수치·특수 */
  --red:#ff5d5d;   /* 빨강: 오답/위험/녹화 */
  --sky:#8fd3ff;   /* 하늘: 녹음/입력 */
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Pretendard,-apple-system,system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.mono{font-family:var(--mono)}
.acc{color:var(--acc)}.vio{color:var(--vio)}.gold{color:var(--gold)}.red{color:var(--red)}.dim{color:var(--dim)}.sky{color:var(--sky)}

/* ---------- 2. 배경 레이어 (grid-bg, progress) ---------- */
.grid-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.35;mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%)}
.progress{position:fixed;left:0;top:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--acc),var(--vio));z-index:60}

/* ---------- 3. 탑바 / 버튼 ---------- */
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0;font-family:var(--mono);font-size:13px;letter-spacing:.06em}
.top a{text-decoration:none;color:var(--dim)}
.top a:hover{color:var(--fg)}
.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;border-radius:999px;padding:13px 24px;background:var(--acc);color:#06080b;font-size:16px;box-shadow:0 0 40px rgba(184,255,92,.25)}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}

/* ---------- 4. 히어로 / 오브 ---------- */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;padding:24px 0 40px}
.kicker{font-family:var(--mono);font-size:13px;letter-spacing:.16em;color:var(--acc)}
h1{font-size:clamp(46px,8vw,104px);line-height:.95;margin:14px 0 18px;letter-spacing:-.05em;font-weight:900}
h1 .g{background:linear-gradient(100deg,var(--acc),var(--sky) 55%,var(--vio));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(17px,2vw,20px);color:#d7dde4;max-width:30em;margin:0 0 26px}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.orb{position:relative;aspect-ratio:1;max-width:520px;width:100%;justify-self:center}
.orb canvas{position:absolute;inset:0;width:100%;height:100%}
.orb .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.orb .core b{display:block;font-size:clamp(22px,3vw,32px);font-weight:900;letter-spacing:-.02em}
.orb .core span{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.14em}
.lang{position:absolute;transform:translate(-50%,-50%);border:1px solid var(--line);background:rgba(13,17,23,.85);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:800;white-space:nowrap;color:var(--fg);transition:border-color .2s,box-shadow .2s}
.lang:hover,.lang.on{border-color:var(--acc);box-shadow:0 0 22px rgba(184,255,92,.35)}
.lang small{font-family:var(--mono);color:var(--dim);font-weight:500;margin-left:6px;font-size:11px}

/* ---------- 5. KPI 3분할 ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:10px 0 0}
.kpi{background:var(--bg);padding:22px 24px}
.kpi b{display:block;font-size:clamp(34px,5vw,56px);font-weight:900;letter-spacing:-.04em;line-height:1}
.kpi span{color:var(--dim);font-size:14px}

/* ---------- 6. 스티키 레일(셀 네비) ---------- */
.rail{position:sticky;top:0;z-index:40;background:rgba(6,8,11,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-top:56px}
.rail .wrap{display:flex;gap:6px;overflow-x:auto;padding:10px 20px;scrollbar-width:none}
.rail a{flex:none;text-decoration:none;font-family:var(--mono);font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap}
.rail a.cur{color:#06080b;background:var(--acc);border-color:var(--acc)}

/* ---------- 7. 섹션 / 셀 라벨 / 제목 ---------- */
.s{padding:84px 0;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:.9fr 1.1fr;gap:44px;align-items:center}
.cell{font-family:var(--mono);font-size:13px;color:var(--acc);letter-spacing:.12em;margin-bottom:12px}
.cell i{font-style:normal;color:#06080b;background:var(--acc);padding:2px 8px;margin-right:10px}
h2{font-size:clamp(32px,4.6vw,56px);line-height:1.05;margin:0 0 14px;letter-spacing:-.04em;font-weight:900}
.one{font-size:18px;color:#d7dde4;margin:0 0 18px;max-width:28em}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tag{font-family:var(--mono);font-size:12px;border:1px solid var(--line);padding:3px 10px;border-radius:999px;color:var(--dim)}

/* ---------- 8. 코드 보기 박스 (details + 복사 버튼) ---------- */
details.code{border:1px solid var(--line);background:var(--bg2)}
details.code summary{cursor:pointer;padding:10px 14px;font-family:var(--mono);font-size:13px;color:var(--dim);list-style:none}
details.code summary::-webkit-details-marker{display:none}
details.code summary:before{content:"▸ ";color:var(--acc)}
details.code[open] summary:before{content:"▾ "}
details.code pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#d5dde6;border-top:1px solid var(--line);max-height:420px}
.copy{float:right;margin:6px 8px 0 0;font-family:var(--mono);font-size:12px;background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:2px 10px}

/* ---------- 9. 시각화 카드(.vis)와 부품 ---------- */
.vis{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,#0b0f15,#06080b);min-height:330px;padding:24px;overflow:hidden}
.vis .cap{position:absolute;left:16px;bottom:12px;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.08em}
/* 떨어지는 칩 */
.pk{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.pk div{border:1px solid var(--line);background:var(--bg2);padding:14px 18px;font-family:var(--mono);font-weight:700;font-size:15px}
.on .pk div{animation:drop .7s cubic-bezier(.2,1.4,.4,1) both}
.on .pk div:nth-child(2){animation-delay:.18s}
.on .pk div:nth-child(3){animation-delay:.36s}
.on .pk div:nth-child(4){animation-delay:.54s}
@keyframes drop{from{transform:translateY(-120px);opacity:0}to{transform:none;opacity:1}}
/* 박스(받는 그릇) / 재시작 */
.box{margin:30px auto 0;width:min(320px,90%);height:96px;border:2px solid var(--acc);border-top:none;display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:0 20px 50px rgba(184,255,92,.1)}
.restart{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:20px;color:var(--gold);font-weight:800}
.restart svg{width:26px;height:26px}
.on .restart svg{animation:spin 1.4s .9s 2 ease-in-out}
@keyframes spin{to{transform:rotate(360deg)}}
/* 파형 박스 + 구간 브래킷 */
.wavebox canvas{width:100%;height:170px;display:block}
.bracket{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--dim);border-top:2px solid var(--acc);margin-top:8px;padding-top:6px}
/* DO / DON'T */
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.dos div{border:1px solid var(--line);padding:10px 12px;font-weight:700;font-size:15px}
.dos .x{color:var(--red)}
.dos .o{color:var(--acc)}
/* 음성 결과 한 줄(.gl) + 재생 버튼 */
.gen{display:grid;gap:12px}
.gl{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);padding:10px 12px;background:var(--bg2)}
.gl .f{font-size:26px;text-align:center}
.gl .t{font-size:14px;color:#d5dde6;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl canvas{grid-column:1/3;width:100%;height:46px}
.play{border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:999px;padding:6px 14px;font-weight:800;font-size:13px}
.play.on{background:var(--acc);color:#06080b}
/* 입력 줄(.spk) + 노브 */
.spk{display:grid;gap:10px}
.spk .in{border:1px solid var(--line);background:var(--bg2);padding:10px 14px;font-size:17px;display:flex;gap:14px;align-items:center}
.spk .l{font-family:var(--mono);font-size:12px;color:var(--dim);min-width:58px}
.knobs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.knobs div{border:1px solid var(--line);padding:12px}
.knobs span{font-family:var(--mono);font-size:13px;color:var(--dim)}
.knobs b{display:block;font-size:30px;font-weight:900;color:var(--gold)}
.knobs small{color:var(--dim)}
.knobs i{display:block;height:6px;background:var(--line);margin:8px 0 6px;position:relative}
.knobs i:after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--w);background:var(--gold)}
/* 파일 묶음(zip) */
.zipv{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:20px}
.zipv div{border:1px solid var(--acc);padding:14px 6px;text-align:center;font-size:30px}
.zipv b{display:block;font-family:var(--mono);font-size:13px;color:var(--acc)}
.on .zipv div{animation:drop .7s cubic-bezier(.2,1.4,.4,1) both}
.zipbox{margin:34px auto 0;width:min(320px,90%);border:2px solid var(--gold);padding:22px;text-align:center;font-weight:900;font-size:22px;color:var(--gold)}
/* 원형 링(국기/아이콘 N개) */
.lring{position:relative;width:100%;max-width:440px;aspect-ratio:1;margin:0 auto}
.ld{position:absolute;transform:translate(-50%,-50%);width:13%;aspect-ratio:1;border-radius:50%;border:2px solid #3a434f;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.14),rgba(13,17,23,.92) 70%);font-size:clamp(14px,2.4vw,24px);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .25s,box-shadow .25s}
.ld.lit{border-color:var(--acc);box-shadow:0 0 18px -6px var(--acc)}
.ld.ja{border-color:var(--gold)}
.ld.cur,.ld:hover{transform:translate(-50%,-50%) scale(1.3);z-index:2}
.lc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;display:grid;place-items:center;gap:2px;width:60%}
.lc span{font-size:clamp(40px,7vw,64px);line-height:1}
.lc b{font-size:clamp(22px,3.4vw,34px);font-weight:900}
.lc .n23{font-size:clamp(60px,10vw,96px);line-height:1;text-shadow:0 0 40px rgba(184,255,92,.4)}
.lc i{font-style:normal;font-family:var(--mono);font-size:13px;color:var(--dim);letter-spacing:.12em}
.lc i.lit{color:var(--acc)}
.lc i.ja{color:var(--gold)}
/* 대결 카드(A vs B) */
.lab{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.duel{border:1px solid var(--line);padding:22px;background:var(--bg2)}
.duel h3{margin:0 0 6px;font-size:22px}
.duel .score{font-size:56px;font-weight:900;letter-spacing:-.04em;line-height:1}

/* ---------- 10. 차트 / 가격 막대 ---------- */
.chart{width:100%;display:block}
.chart text{font-family:Pretendard,sans-serif;fill:#d5dde6;font-size:13px}
.chart .ax{font-family:var(--mono);fill:var(--dim);font-size:11px}
.legend{display:flex;gap:18px;font-size:14px;color:var(--dim);margin:10px 0 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.price{display:grid;gap:10px}
.pr{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:center}
.pr span{font-weight:700;font-size:15px}
.pr .tr{position:relative;height:34px}
.pr .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.on .pr .tr i{width:var(--w)}
.pr .tr b{position:absolute;top:50%;transform:translateY(-50%);left:calc(var(--w) + 10px);font-family:var(--mono);font-size:16px;white-space:nowrap}

/* ---------- 11. 푸터 ---------- */
.foot{padding:70px 0 90px;text-align:center}
.foot p{color:var(--dim);margin:14px 0 26px}

/* ---------- 12. 반응형 / 모션 감소 ---------- */
@media (max-width:860px){
  .hero,.row,.lab{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr}
  .pr{grid-template-columns:1fr}
  .s{padding:60px 0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 13. 폴리시 레이어: 입체감·깊이 (원본에서 뒤에 덮어쓰는 규칙) ---------- */
body{background:radial-gradient(1400px 900px at 80% -10%,#0f1a14 0%,#06080b 55%)}
.aur{position:fixed;border-radius:50%;pointer-events:none;z-index:-1;opacity:.2;background:radial-gradient(closest-side,var(--c),transparent)}
.aur.a{width:1000px;height:800px;right:-300px;top:-360px;--c:#b8ff5c;animation:dr1 20s ease-in-out infinite alternate}
.aur.b{width:900px;height:800px;left:-300px;top:60vh;--c:#b79dff;opacity:.13;animation:dr2 24s ease-in-out infinite alternate}
@keyframes dr1{to{transform:translate(-240px,200px) scale(1.15)}}
@keyframes dr2{to{transform:translate(300px,-200px) scale(.9)}}
.grain{position:fixed;inset:0;pointer-events:none;z-index:70;opacity:.05;animation:gr .8s steps(5) infinite;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes gr{0%{background-position:0 0}25%{background-position:-60px 40px}50%{background-position:50px -70px}75%{background-position:-40px 60px}100%{background-position:0 0}}
.top .mark{display:flex;align-items:center;gap:12px;color:#fff;letter-spacing:.42em;font-weight:300;font-family:Pretendard,sans-serif}
.top .mark i{width:11px;height:11px;border-radius:50%;background:var(--acc);box-shadow:0 0 16px var(--acc);animation:pl 2.4s ease-in-out infinite}
@keyframes pl{50%{transform:scale(.7);opacity:.7}}
.presents{font-weight:300;letter-spacing:.9em;font-size:12px;color:var(--dim);margin-bottom:6px}
h1 .g{filter:drop-shadow(0 0 40px rgba(184,255,92,.35))}
.vis{background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01));backdrop-filter:blur(14px);border-color:rgba(255,255,255,.08);border-radius:22px;box-shadow:0 40px 100px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.kpis{border-radius:22px;overflow:hidden;background:rgba(255,255,255,.06)}
.kpi{background:rgba(6,8,11,.82);backdrop-filter:blur(10px)}
.kpi b.acc{text-shadow:0 0 40px rgba(184,255,92,.5)}
.chip,.pk div,.zipv div,.gl,.duel,.dos div,.spk .in,.knobs div{border-radius:14px}
.pk div,.zipv div{box-shadow:0 0 30px -10px var(--acc);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.01))}
.btn{box-shadow:0 0 50px rgba(184,255,92,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.cell i{border-radius:4px;box-shadow:0 0 18px rgba(184,255,92,.5)}
h2{background:linear-gradient(100deg,#fff 40%,#b8ff5c 130%);-webkit-background-clip:text;background-clip:text;color:transparent}
.endmark{font-weight:200;letter-spacing:.55em;font-size:18px;color:rgba(255,255,255,.5);margin-top:40px}
@media (prefers-reduced-motion:reduce){.aur,.grain{animation:none}}

/* ---------- 14. 필름 플레이어 (영상 극장) ---------- */
.film{padding:90px 0 40px}
.film .head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.film .head .one{margin:0}
.theater{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.stage{position:relative;border-radius:24px;padding:1.5px;background:conic-gradient(from var(--ang,0deg),rgba(184,255,92,.9),rgba(143,211,255,.25),rgba(183,157,255,.85),rgba(184,255,92,.15),rgba(184,255,92,.9));animation:spinb 8s linear infinite;--amb:184,255,92}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spinb{to{--ang:360deg}}
.stage:before{content:"";position:absolute;inset:6% 4%;border-radius:40px;background:rgb(var(--amb));filter:blur(70px);opacity:.38;z-index:-1;transition:background .6s}
.screen{position:relative;aspect-ratio:16/9;border-radius:22.5px;overflow:hidden;background:#000}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .45s ease,transform 1.2s cubic-bezier(.2,.8,.2,1),filter .45s}
.screen video.out{opacity:0;transform:scale(1.035);filter:blur(6px)}
.screen:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 18%,transparent 70%,rgba(0,0,0,.65));border-radius:inherit}
.hud{position:absolute;right:16px;top:14px;z-index:3;display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:#fff}
.hud .no{color:#06080b;background:var(--acc);padding:2px 8px;border-radius:4px;font-weight:800;box-shadow:0 0 18px rgba(184,255,92,.6)}
.hud .rec{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:pl 1.2s ease-in-out infinite}
.hud .rec.off{background:#666;box-shadow:none;animation:none}
.tcard{position:absolute;inset:0;z-index:4;display:grid;place-items:center;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(6,8,11,.78),rgba(6,8,11,.35) 70%)}
.tcard.go{animation:tc 1.6s cubic-bezier(.2,.8,.2,1) both}
.tcard div{text-align:center}
.tcard b{display:block;font-family:var(--mono);font-size:clamp(14px,1.6vw,18px);letter-spacing:.5em;color:var(--acc);margin-bottom:8px}

<script>
/* ===== PREP LAB 앱: 단계 이동 · 규칙 기반 채점 · 성장 코칭 ===== */
(function(){
'use strict';
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function nl(s){ return esc(s).replace(/\n/g, '<br>'); }

/* ---- 저장 (실패해도 앱은 그대로 동작) ---- */
function sget(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function sset(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

var STEPS = ['난이도', '스타일·대상', '상황', '작성', '결과'];
var MATKINDS = ['표', '그래프', '사진', '도면', '체크리스트', '기타'];
var TYPECUES = {
  urgent:  ['긴급','지연','발생','즉시','우선','오늘','내일','결정','연기','확인','조치','승인'],
  weekly:  ['이번 주','금주','다음 주','차주','이슈','계획','완료','순연','실적','공정률','월요일'],
  interim: ['진척','진행','계획','대비','차이','%','남은','현재','대응','예정'],
  result:  ['결과','완료','달성','이수','재발','방지','원인','마무리','남은','부적합','건']
};
var S = {
  step: 0, max: 0, lv: null, ty: null, au: null, sid: null,
  ans: {P1:'', R:'', E:'', P2:''},
  mat: {inc:false, items:[]},
  res: null, force: false,
  self: {voice:null, eye:null, emph:[], pair:{a:false,b:false,c:false}, time:null}
};
var tick = null;

function scenario(){
  for (var i = 0; i < SC.length; i++) if (SC[i].lv === S.lv && SC[i].ty === S.ty) return SC[i];
  return null;
}
function scById(id){ for (var i = 0; i < SC.length; i++) if (SC[i].id === id) return SC[i]; return null; }
function draftKey(){ return 'preplab.d.' + S.sid + '.' + S.au; }
function saveDraft(){ if (S.sid && S.au) sset(draftKey(), {ans:S.ans, mat:S.mat}); }
function loadDraft(){
  var d = sget(draftKey());
  S.ans = {P1:'', R:'', E:'', P2:''}; S.mat = {inc:false, items:[]};
  if (d && d.ans) { S.ans = d.ans; S.mat = d.mat || S.mat; }
}

/* ---- 문자열 도구 ---- */
function norm(s){ return String(s).replace(/\s+/g, '').toLowerCase(); }
function has(text, term){ return text.indexOf(term) >= 0 || norm(text).indexOf(norm(term)) >= 0; }
function hitGroup(text, g){ for (var i = 0; i < g.length; i++) if (has(text, g[i])) return true; return false; }
function cov(text, groups){
  var n = 0, miss = [];
  for (var i = 0; i < groups.length; i++) { if (hitGroup(text, groups[i])) n++; else miss.push(groups[i]); }
  return {n:n, total:groups.length, ratio: groups.length ? n / groups.length : 1, missing:miss};
}
function nums(text){ return String(text).match(/\d+(?:\.\d+)?/g) || []; }
function firstSentence(t){ var m = String(t).trim().split(/[.!?。\n]/); return (m[0] || '').trim(); }
function countRe(text, re){ var m = String(text).match(re); return m ? m.length : 0; }

/* ---- 규칙 기반 채점 ---- */
function score(sc){
  var au = AU[S.au], ty = TY[sc.ty];
  var A = {}; ['P1','R','E','P2'].forEach(function(k){ A[k] = (S.ans[k] || '').trim(); });
  var all = [A.P1, A.R, A.E, A.P2].join(' ');
  var items = [], x;

  /* P1 결론 */
  var c1 = cov(A.P1, sc.kp.P1), fs = firstSentence(A.P1);
  x = (A.P1.length >= 15 ? 6 : 0) + Math.round(c1.ratio * 10) + (!A.P1 ? 0 : (fs.length <= 60 ? 4 : (fs.length <= 90 ? 2 : 0)));
  items.push({key:'P1', label:'결론 (P)', got:Math.min(20, x), max:20, miss:c1.missing, fsLen:fs.length});

  /* R 이유 */
  var c2 = cov(A.R, sc.kp.R);
  var conn = /(때문|왜냐하면|이유는|따라서|그래서|첫째|둘째|영향|겹쳐|탓)/.test(A.R);
  x = (A.R.length >= 15 ? 6 : 0) + Math.round(c2.ratio * 10) + (conn ? 4 : 0);
  items.push({key:'R', label:'이유 (R)', got:Math.min(20, x), max:20, miss:c2.missing, conn:conn});

  /* E 근거 */
  var allowed = {};
  nums(sc.facts.join(' ')).forEach(function(n){ allowed[n] = 1; });
  var modelNums = {};
  nums([sc.m.P1, sc.m.R, sc.m.E, sc.m.P2].join(' ')).forEach(function(n){ modelNums[n] = 1; });
  var seen = {}, matched = 0, unknown = [];
  nums(A.E + ' ' + A.R + ' ' + A.P1 + ' ' + A.P2).forEach(function(n){
    if (seen[n]) return; seen[n] = 1;
    if (allowed[n] || modelNums[n]) return;
    if (parseFloat(n) <= 3) return;
    unknown.push(n);
  });
  var seenE = {};
  nums(A.E).forEach(function(n){ if (!seenE[n] && allowed[n]) { seenE[n] = 1; matched++; } });
  var c3 = cov(A.E, sc.kp.E);
  x = (A.E.length >= 20 ? 5 : 0) + Math.round(Math.min(matched, 2) / 2 * 8) + Math.round(c3.ratio * 7) - Math.min(4, unknown.length * 2);
  items.push({key:'E', label:'근거 (E)', got:Math.max(0, Math.min(20, x)), max:20, miss:c3.missing, matched:matched, unknown:unknown});

  /* P2 마무리 */
  var req = /(요청|부탁|승인|결재|지시|말씀|검토|결정해)/.test(A.P2);
  var act = /(드리겠습니다|하겠습니다|공유|보고|연락)/.test(A.P2);
  var ov = cov(A.P2, sc.kp.P1).n >= 1;
  x = (A.P2.length >= 10 ? 3 : 0) + (req ? 4 : (act ? 3 : 0)) + (ov ? 3 : 0);
  items.push({key:'P2', label:'마무리 (P)', got:Math.min(10, x), max:10, req:req, act:act, ov:ov});

  /* 유형·대상 적합성 */
  var total = A.P1.length + A.R.length + A.E.length + A.P2.length;
  var lenS = total === 0 ? 0 : (total < 60 ? 2 : (total <= ty.limit ? 5 : (total <= ty.limit * 1.3 ? 3 : 1)));
  var tc = 0; TYPECUES[sc.ty].forEach(function(w){ if (has(all, w)) tc++; });
  var typeS = tc >= 3 ? 5 : (tc === 2 ? 4 : (tc === 1 ? 2 : 0));
  var ac = 0; au.cues.forEach(function(w){ if (has(all, w)) ac++; });
  var audS = total === 0 ? 0 : (ac >= 2 ? 5 : (ac === 1 ? 4 : 2));
  items.push({key:'fit', label:'유형·대상 맞춤', got:lenS + typeS + audS, max:15, lenS:lenS, typeS:typeS, audS:audS, total:total});

  /* 보고자료 */
  var pol = sc.pol, inc = S.mat.inc;
  var jd = pol === 'required' ? (inc ? 5 : 0) : (pol === 'recommended' ? (inc ? 5 : 3) : (inc ? 2 : 5));
  var contentApplicable = inc || pol === 'required';
  var mtxt = S.mat.items.map(function(i){ return i.text || ''; }).join(' ').trim();
  var ct = 0;
  if (contentApplicable && inc && mtxt.length >= 10) {
    var mc = cov(mtxt, sc.mk);
    ct = 4 + Math.round(mc.ratio * 6);
    if (pol === 'unnecessary') ct = Math.min(ct, 5);
  }
  var mmax = 5 + (contentApplicable ? 10 : 0);
  items.push({key:'mat', label:'보고자료', got:jd + ct, max:mmax, pol:pol, inc:inc, jd:jd, ct:ct, applicable:contentApplicable, mtxtLen:mtxt.length, miss: mtxt ? cov(mtxt, sc.mk).missing : sc.mk});

  var earned = 0, appl = 0;
  items.forEach(function(i){ earned += i.got; appl += i.max; });
  var totalPct = appl ? Math.round(earned / appl * 100) : 0;
  if (!total) totalPct = 0;
  return {items:items, total:totalPct, earned:earned, appl:appl, A:A};
}

function gradeOf(t){
  if (t >= 90) return {k:'탄탄합니다', cheer:'구조와 근거가 안정적인 보고입니다. 이 흐름을 현장에 그대로 적용하셔도 좋습니다.'};
  if (t >= 75) return {k:'양호합니다', cheer:'전반적인 흐름이 양호합니다. 한 가지만 보완하면 완성도가 한층 높아집니다.'};
  if (t >= 60) return {k:'보완 단계입니다', cheer:'핵심 구조는 갖추어졌습니다. 항목별 제안을 반영하면 다음 보고에서 뚜렷한 향상을 기대할 수 있습니다.'};
  return {k:'재작성을 권장합니다', cheer:'모범 답안의 구성을 먼저 확인하신 뒤 다시 작성해 보시기 바랍니다. 두 번째 시도에서 개선 폭이 가장 큽니다.'};
}

/* ---- 피드백 문구 (강점 먼저, 제안은 한 가지, 전문적이고 정중한 어조) ---- */
function msgGood(it){
  var m = {
    P1: '첫 문장에 상황과 결론이 명확히 담겨 있습니다.',
    R:  '이유가 결론과 논리적으로 연결되어 있습니다.',
    E:  '주어진 사실과 수치를 근거로 적절히 활용하셨습니다.',
    P2: '마무리에서 요청 사항과 다음 행동을 분명히 제시하셨습니다.',
    fit:'보고 유형과 대상에 적합한 어조와 분량입니다.',
    mat:'이 상황에 맞게 보고자료 필요 여부를 판단하셨습니다.'
  };
  return m[it.key];
}
function msgNext(it, sc){
  var au = AU[S.au], ty = TY[sc.ty], first;
  switch (it.key) {
    case 'P1':
      if (!S.ans.P1.trim()) return '결론 칸이 비어 있습니다. 결론을 한 문장으로 먼저 작성해 보시기 바랍니다.';
      if (it.miss && it.miss.length) return '결론에 ‘' + it.miss[0][0] + '’ 내용을 함께 제시하면 좋습니다. 한 문장 안에 상황과 요청이 함께 담기면 상대가 즉시 상황을 파악할 수 있습니다.';
      if (it.fsLen > 60) return '첫 문장이 다소 깁니다. 60자 내외로 압축하면 전달력이 높아집니다.';
      return '첫 문장에 요청 사항(결정·승인·확인) 한 가지를 추가해 보시기 바랍니다.';
    case 'R':
      if (!S.ans.R.trim()) return '이유 칸이 비어 있습니다. “~ 때문입니다” 형식으로 한 문장을 작성해 보시기 바랍니다.';
      if (!it.conn) return '이유는 “~ 때문입니다”로 연결해 보시기 바랍니다. 결론과 이유의 인과가 명확해집니다.';
      if (it.miss && it.miss.length) return '‘' + it.miss[0][0] + '’ 내용이 이유에 반영되면 설득력이 높아집니다.';
      return '이유를 한두 가지로 압축하면 논점이 더 선명해집니다.';
    case 'E':
      if (!S.ans.E.trim()) return '근거 칸이 비어 있습니다. 주어진 사실 중 수치 하나를 먼저 제시해 보시기 바랍니다.';
      if (it.unknown && it.unknown.length) return '시나리오에 없는 수치(' + it.unknown.join(', ') + ')가 포함되어 있습니다. 사실관계를 한 번 더 확인해 보시기 바랍니다.';
      if (it.matched < 2) return '근거에 수치를 하나 더 제시하면 신뢰도가 높아집니다. ' + (it.miss && it.miss.length ? '예를 들어 ‘' + it.miss[0][0] + '’ 관련 내용이 있습니다.' : '');
      if (it.miss && it.miss.length) return '‘' + it.miss[0][0] + '’ 사실도 근거에 포함하시기를 권장합니다.';
      return '근거를 두세 개로 정리하면 청취자가 따라가기 수월합니다.';
    case 'P2':
      if (!S.ans.P2.trim()) return '마무리 칸이 비어 있습니다. 결론을 다시 짚고 요청 사항 한 가지를 작성해 보시기 바랍니다.';
      if (!it.req && !it.act) return '마지막 문장에서 상대에게 요청할 사항(결정·승인·확인)을 한 가지 제시해 보시기 바랍니다.';
      if (!it.ov) return '결론의 핵심 표현을 마무리에서 한 번 더 언급하면 기억에 오래 남습니다.';
      return '마지막 문장을 한 줄로 간결하게 다듬어 보시기 바랍니다.';
    case 'fit':
      if (it.lenS <= 3 && it.total > ty.limit) return '전체 분량이 다소 깁니다. 이 보고는 ' + ty.size + ' 정도가 적정합니다. 이유와 근거를 하나씩만 남겨 보시기 바랍니다.';
      if (it.lenS <= 3 && it.total < 60) return '조금 더 구체적으로 작성하시기를 권장합니다. 칸마다 한두 문장이면 충분합니다.';
      if (it.audS <= 4) return au.name + '께서는 다음과 같은 점을 중시하십니다. “' + au.care + '” 이에 맞추어 ‘' + au.cues[0] + '’ 등의 표현을 활용해 보시기 바랍니다.';
      return ty.name + '에서는 “' + ty.tips[0] + '” 점을 유념하시기 바랍니다.';
    case 'mat':
      if (it.pol === 'required' && !it.inc) return '이 상황은 수치가 많아 보고자료를 함께 제시하면 이해도가 크게 높아집니다. 다음에는 표 한 장을 구상하여 ‘보고자료 포함’을 체크해 보시기 바랍니다.';
      if (it.pol === 'recommended' && !it.inc) return '이 상황에서는 자료를 함께 제시하면 효과적입니다. 표나 그래프 한 장을 구상해 보시기 바랍니다.';
      if (it.pol === 'unnecessary' && it.inc) return '이 보고는 신속성이 우선이므로 구두 보고로 충분합니다. 긴급할수록 자료보다 결론 한 문장이 효과적입니다.';
      if (it.inc && it.mtxtLen < 10) return '자료 칸에 담을 내용을 구체적으로 작성해 보시기 바랍니다. 항목명만 기재하셔도 충분합니다.';
      if (it.miss && it.miss.length) return '자료에 ‘' + it.miss[0][0] + '’ 항목이 포함되면 가독성이 높아집니다.';
      return '자료에 제목을 한 줄 붙이면 더욱 좋습니다.';
  }
  return '';
}

/* ---- 성장 코칭 신호 (글에서 읽어낼 수 있는 것만, 감점 없음) ---- */
function signals(sc, res){
  var A = res.A, list = [];
  var p1 = res.items[0], all = [A.P1, A.R, A.E, A.P2].join(' ');
  list.push(p1.fsLen > 0 && p1.fsLen <= 60
    ? {ok:true,  t:'첫 문장이 간결하여 청취자가 즉시 핵심을 파악할 수 있습니다.'}
    : {ok:false, t:'첫 문장이 다소 깁니다. 60자 내외가 전달력 측면에서 적정합니다.'});
  var hedge = countRe(all, /(것 같|듯합니다|듯하|아마|일지도|않을까)/g);
  list.push(hedge <= 1
    ? {ok:true,  t:'확정된 사항을 명확하게 표현하여 신뢰감을 줍니다.', hedge:hedge}
    : {ok:false, t:'“~것 같습니다” 표현이 ' + hedge + '회 사용되었습니다. 확인된 내용은 단정적으로, 미확인 사항은 “현재 확인 중입니다”로 구분하면 신뢰도가 높아집니다.', hedge:hedge});
  list.push(nums(all).length > 0
    ? {ok:true,  t:'수치가 포함되어 있어 설득력이 있습니다.'}
    : {ok:false, t:'수치를 하나만 추가해도 설득력이 크게 높아집니다.'});
  var last = firstSentence(A.P2.split(/\n/).pop() || '');
  var lastAll = A.P2.trim().split(/[.!?。\n]/).filter(function(s){ return s.trim(); }).pop() || '';
  list.push(/(요청|부탁|승인|결재|지시|말씀|검토|확인|드리겠습니다|하겠습니다)/.test(lastAll)
    ? {ok:true,  t:'마지막 문장에 요청 사항 또는 다음 행동이 제시되어 있어, 상대가 취할 조치가 분명합니다.'}
    : {ok:false, t:'마지막 문장에 요청 사항이나 다음 행동을 명시하면 보고가 명확하게 마무리됩니다.'});
  var unk = res.items[2].unknown || [];
  if (unk.length) list.push({ok:false, t:'시나리오에 없는 수치(' + unk.join(', ') + ')가 포함되어 있습니다. 사실관계를 한 번 더 확인해 보시기 바랍니다.'});
  var apology = /^(죄송|송구|면목)/.test(A.P1.trim());
  list.push(!apology
    ? {ok:true,  t:'결론으로 시작하셨습니다. 사과보다 해결 방안을 먼저 제시하면 신뢰감이 높아집니다.'}
    : {ok:false, t:'사과는 한 문장이면 충분합니다. 결론과 해결 방안을 먼저 보고해 보시기 바랍니다.'});
  return {list:list, hedge:hedge, apology:apology};
}

function onePractice(sc, res, sg){
  if (sg.hedge >= 2) return '다음 보고에서는 “~것 같습니다” 표현을 1회 이하로 줄여 보시기 바랍니다.';
  if (res.items[0].fsLen > 60) return '다음 보고에서는 첫 문장을 60자 내외로 압축해 보시기 바랍니다.';
  if (!res.items[3].req && !res.items[3].act) return '다음 보고에서는 마지막 문장에 요청 사항 한 가지를 반드시 포함해 보시기 바랍니다.';
  var low = res.items.slice().sort(function(a, b){ return a.got / a.max - b.got / b.max; })[0];
  if (low.got / low.max < .8) return '다음에는 “' + low.label + '” 항목을 우선 보완해 보시기 바랍니다. 한 단계 높은 완성도를 기대할 수 있습니다.';
  return '첫 문장은 평소보다 천천히, 문장 끝은 낮추어 발화해 보시기 바랍니다.';
}

var app, rail, railWrap;
function go(n){
  S.step = n; if (n > S.max) S.max = n;
  stopTimer();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function render(){
  rail.hidden = S.step === 0;
  railWrap.innerHTML = STEPS.map(function(n, i){
    var cls = (i + 1 === S.step) ? 'cur' : '';
    var dis = (i + 1 > S.max) ? ' disabled' : '';
    return '<a href="#" role="button" data-go="' + (i + 1) + '" class="' + cls + '"' + (dis ? ' aria-disabled="true"' : '') + '>' + (i + 1) + ' · ' + n + '</a>';
  }).join('');
  [intro, stepLevel, stepStyle, stepScene, stepWrite, stepResult][S.step]();
}

  }).join('') + '</div>';
}

    '<div class="cc"><h5>목소리 <i>SELF</i></h5><p>첫 문장은 평소보다 약간 천천히, 또렷하게 발화합니다. 문장 끝을 낮추어 마무리하면 안정감 있게 전달됩니다. 긴급할수록 속도를 낮추는 것이 효과적입니다.</p>' +
      '<div class="timer"><span class="t" id="tv">' + (S.self.time != null ? S.self.time + '초' : '0초') + '</span><button type="button" class="btn ghost" id="tbtn" data-act="timer" style="padding:8px 18px;font-size:14px">' + (tick ? '■ 멈추기' : '▶ 소리 내어 읽기') + '</button></div>' +
      '<p style="margin-top:10px">목표 ' + ty.target + '초 안팎 · ' + esc(tmsg || '답안을 소리 내어 읽으며 소요 시간을 측정해 보시기 바랍니다.') + '</p>' +
      '<p style="margin-bottom:6px">첫 문장을 또렷하고 천천히 발화하셨습니까?</p>' + seg('voice', [['y','그렇다'],['m','보통'],['n','보완 필요']]) + '</div>' +
    '<div class="cc"><h5>시선 · 자세 <i>PAIR</i></h5><p>보고 시작과 결론·요청 시에는 상대와 눈을 맞추고, 자료를 가리킨 뒤에는 다시 상대를 향합니다. 원고만 보며 고개를 숙이는 것은 지양합니다.</p>' +
      '<p style="margin-bottom:6px">시선을 맞추려 노력하셨습니까?</p>' + seg('eye', [['y','그렇다'],['m','보통'],['n','보완 필요']]) +
      '<p style="margin:12px 0 6px"><b>동료 관찰</b> · 옆 동료에게 요청하여 점검해 보시기 바랍니다</p>' +
      ['a:시작과 요청 시 상대와 눈을 맞추었다','b:고개와 자세가 안정적이었다','c:속도가 듣기에 적절했다'].map(function(s){ var p = s.split(':'); return '<label class="chk" style="font-weight:500;font-size:14px;margin-bottom:6px"><input type="checkbox" data-pair="' + p[0] + '"' + (S.self.pair[p[0]] ? ' checked' : '') + '><span>' + p[1] + '</span></label>'; }).join('') + '</div>' +
    '<div class="cc"><h5>강조 <i>SELF</i></h5><p>강조는 핵심어 한두 개에 한정합니다. 앞뒤에 짧은 정적을 두면 전달력이 높아집니다.</p><p style="margin-bottom:6px">첫 문장에서 강조할 단어를 최대 2개 선택해 보시기 바랍니다.</p>' +
      '<div class="words">' + (words.length ? words.map(function(w){ return '<button type="button" data-emph="' + esc(w) + '" class="' + (S.self.emph.indexOf(w) >= 0 ? 'on' : '') + '">' + esc(w) + '</button>'; }).join('') : '<span class="empty">결론 칸을 작성하면 단어가 표시됩니다</span>') + '</div>' +
      '<p style="margin:0">' + (S.self.emph.length ? '“' + esc(S.self.emph.join(' · ')) + '” 앞뒤에서 짧게 쉬며 낭독해 보시기 바랍니다. 나머지는 차분하게 읽습니다.' : '') + '</p></div>' +
    '<div class="cc"><h5>태도 <i>SELF</i></h5><p>미확인 사항은 “현재 확인 중입니다”라고 투명하게 밝히고, 부정적인 소식은 해결 방안과 함께 전달합니다. 변명보다 사실과 다음 행동이 신뢰를 형성합니다.</p>' +
      '<p style="margin:0"><b class="acc">실천 목표</b> · 다음 보고에서는 결론을 먼저 제시하고, 마무리에 요청 사항 한 가지를 반드시 명시한다.</p></div></div>';
}

function stopTimer(){ if (tick) { clearInterval(tick); tick = null; } }

/* ---- 이벤트 ---- */
function init(){
  app = $('#app'); rail = $('#rail'); railWrap = $('#railwrap');
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-go],[data-act],[data-lv],[data-ty],[data-au],[data-reau],[data-sf],[data-emph],[data-mdel],[data-madd]');
    if (!t) return;
    if (t.tagName === 'A') e.preventDefault();
    if (t.hasAttribute('data-go')) { var n = +t.getAttribute('data-go'); if (n <= S.max) go(n); return; }
    if (t.hasAttribute('data-lv')) { S.lv = t.getAttribute('data-lv'); render(); return; }
    if (t.hasAttribute('data-ty')) { S.ty = t.getAttribute('data-ty'); render(); return; }
    if (t.hasAttribute('data-au')) { S.au = t.getAttribute('data-au'); render(); return; }
    if (t.hasAttribute('data-reau')) { S.au = t.getAttribute('data-reau'); S.res = null; lastDraftFor = S.sid + '|' + S.au; saveDraft(); go(4); return; }
    if (t.hasAttribute('data-sf')) { S.self[t.getAttribute('data-sf')] = t.getAttribute('data-sv'); renderCoach(); return; }
    if (t.hasAttribute('data-emph')) {
      var w = t.getAttribute('data-emph'), i = S.self.emph.indexOf(w);
      if (i >= 0) S.self.emph.splice(i, 1); else if (S.self.emph.length < 2) S.self.emph.push(w);
      renderCoach(); return;
    }
    if (t.hasAttribute('data-mdel')) { S.mat.items.splice(+t.getAttribute('data-mdel'), 1); saveDraft(); drawMat(); return; }
    if (t.hasAttribute('data-madd')) { if (S.mat.items.length < 5) S.mat.items.push({kind:'표', text:''}); saveDraft(); drawMat(); return; }
    var a = t.getAttribute('data-act');
    if (a === 'start') go(1);
    else if (a === 'to2') { if (S.lv) go(2); }
    else if (a === 'to3') { if (S.ty && S.au) { S.res = null; lastDraftFor = ''; go(3); } }
    else if (a === 'to4') go(4);
    else if (a === 'done') done();
    else if (a === 'redo') { S.res = null; go(4); }
    else if (a === 'copy') copyAns();
    else if (a === 'timer') {
      if (tick) { stopTimer(); S.self.time = Math.round((Date.now() - S._t0) / 1000); renderCoach(); }
      else { S._t0 = Date.now(); renderCoach(); tick = setInterval(function(){ var tv = $('#tv'); if (tv) tv.textContent = Math.round((Date.now() - S._t0) / 1000) + '초'; }, 250); }
    }
  });
  document.addEventListener('input', function(e){
    var t = e.target;
    if (t.matches('textarea[data-k]')) { S.ans[t.getAttribute('data-k')] = t.value; S.force = false; var w = $('#warn'); if (w) w.innerHTML = ''; updCounts(); saveDraft(); }
    else if (t.matches('textarea[data-mt]')) { S.mat.items[+t.getAttribute('data-mt')].text = t.value; saveDraft(); }
  });
  document.addEventListener('change', function(e){
    var t = e.target;
    if (t.id === 'mcheck') { S.mat.inc = t.checked; saveDraft(); drawMat(); }
    else if (t.matches('select[data-mk]')) { S.mat.items[+t.getAttribute('data-mk')].kind = t.value; saveDraft(); }
    else if (t.matches('input[data-pair]')) { S.self.pair[t.getAttribute('data-pair')] = t.checked; }
  });
  var prog = $('#prog');
  window.addEventListener('scroll', function(){
    var h = document.documentElement; var m = h.scrollHeight - h.clientHeight;
    prog.style.transform = 'scaleX(' + (m > 0 ? h.scrollTop / m : 0) + ')';
  }, {passive:true});
  render();
}
function copyAns(){
  var sc = scenario(), txt = '[' + sc.title + ' · ' + TY[sc.ty].name + ' · ' + AU[S.au].name + '께]\n\n';
  ['P1','R','E','P2'].forEach(function(k){ txt += '(' + LET[k] + ') ' + PL[k].t + '\n' + (S.ans[k] || '') + '\n\n'; });
  if (S.mat.inc) S.mat.items.forEach(function(i){ if ((i.text || '').trim()) txt += '[보고자료: ' + i.kind + '] ' + i.text + '\n'; });
  var m = $('#cpmsg');
  try { navigator.clipboard.writeText(txt).then(function(){ m.textContent = '복사되었습니다'; }, function(){ m.textContent = '복사하지 못했습니다. 직접 선택하여 복사해 주십시오'; }); }
  catch (e) { m.textContent = '복사하지 못했습니다. 직접 선택하여 복사해 주십시오'; }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
</html>
