<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>신호 vs 노이즈 카드 분류 레이스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1FF; --panel:#FFFFFF; --ink:#1B1464; --muted:#5A5690; --line:#1B1464; --shadow:#1B1464; --soft:#DDE3FF;
  --signal:#00B37E; --signal-bg:#CFF7E8; --signal-ink:#00533A;
  --noise:#FF4D6D; --noise-bg:#FFDCE3; --noise-ink:#8A1230;
  --check:#FFB800; --check-bg:#FFF0B8; --check-ink:#5C4200;
  --accent:#5B3DF5; --accent-bg:#E4DEFF; --on-accent:#FFFFFF; --on:#1B1464;
  --display:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12103A; --panel:#1E1B52; --ink:#F2F0FF; --muted:#B3AEE6; --line:#9C8CFF; --shadow:#07061F; --soft:#2B2768;
    --signal:#2BE0A5; --signal-bg:#0F4A3A; --signal-ink:#C9FFEB;
    --noise:#FF7A92; --noise-bg:#56213A; --noise-ink:#FFD9E1;
    --check:#FFD23F; --check-bg:#54430C; --check-ink:#FFF1B8;
    --accent:#A594FF; --accent-bg:#332C86; --on-accent:#12103A; --on:#12103A;
  }
}
:root[data-theme="dark"]{
  --bg:#12103A; --panel:#1E1B52; --ink:#F2F0FF; --muted:#B3AEE6; --line:#9C8CFF; --shadow:#07061F; --soft:#2B2768;
  --signal:#2BE0A5; --signal-bg:#0F4A3A; --signal-ink:#C9FFEB;
  --noise:#FF7A92; --noise-bg:#56213A; --noise-ink:#FFD9E1;
  --check:#FFD23F; --check-bg:#54430C; --check-ink:#FFF1B8;
  --accent:#A594FF; --accent-bg:#332C86; --on-accent:#12103A; --on:#12103A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);min-height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--accent);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(14px,3vw,28px) 56px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;background:var(--bg);border-bottom:3px dashed var(--soft)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:clamp(1.15rem,2.6vw,1.6rem);line-height:1.2}
.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--accent);color:var(--on-accent);border:3px solid var(--line);box-shadow:0 3px 0 var(--shadow);font-size:1.3rem;flex:none}
.brand small{display:block;font-family:var(--body);font-size:.78rem;color:var(--muted);font-weight:500}
.tools{display:flex;gap:8px;align-items:center}
.ico{width:42px;height:42px;border-radius:14px;border:3px solid var(--line);background:var(--panel);cursor:pointer;font-size:1.15rem;box-shadow:0 3px 0 var(--shadow);transition:transform .12s}
.ico:active{transform:translateY(2px)}

/* buttons */
.btn{font-family:var(--display);font-size:1.1rem;padding:.65em 1.2em;border:3px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--shadow);transition:transform .12s,box-shadow .12s,background .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--shadow)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--shadow)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.big{font-size:clamp(1.25rem,2.6vw,1.6rem);padding:.7em 1.7em}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed}
.btn.ghost:hover{box-shadow:none}
.mini{font-family:var(--body);font-weight:700;font-size:.85rem;padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:var(--panel);cursor:pointer}

/* hero */
.hero{padding:clamp(22px,5vw,46px) 0 18px;text-align:center}
.sticker{display:inline-block;transform:rotate(-3deg);background:var(--check);color:#1B1464;border:3px solid var(--line);border-radius:12px;padding:4px 14px;font-family:var(--display);font-size:1rem;box-shadow:0 3px 0 var(--shadow);margin-bottom:14px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,7vw,4.4rem);line-height:1.15;margin:0 0 10px;letter-spacing:-.01em}
.hl{padding:0 .22em;border-radius:.3em;border:3px solid var(--line);display:inline-block;transform:rotate(-1.5deg)}
.hl.s{background:var(--signal-bg);color:var(--signal-ink)}
.hl.n{background:var(--noise-bg);color:var(--noise-ink);transform:rotate(1.5deg)}
.hero .sub{font-size:clamp(1rem,2.2vw,1.25rem);color:var(--muted);margin:0 auto;max-width:36em;word-break:keep-all}

/* panels */
.panel{background:var(--panel);border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--shadow);padding:clamp(16px,2.6vw,26px);margin-top:22px}
.panel h2{font-family:var(--display);font-weight:400;font-size:clamp(1.3rem,2.8vw,1.75rem);margin:0 0 12px}
.why{background:var(--accent-bg);border:3px solid var(--line);border-radius:24px;box-shadow:0 7px 0 var(--shadow);padding:clamp(16px,3vw,28px);margin-top:10px}
.why h2{font-family:var(--display);font-weight:400;font-size:clamp(1.35rem,3vw,1.9rem);margin:0 0 14px}
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.why-item{background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:16px}
.why-item .em{font-size:1.9rem;display:block;margin-bottom:4px}
.why-item h3{font-family:var(--display);font-weight:400;font-size:1.2rem;margin:0 0 6px}
.why-item p{margin:0;font-size:.98rem;word-break:keep-all}
.why-sum{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.why.compact{padding:10px 16px;box-shadow:0 4px 0 var(--shadow);border-radius:18px;margin-top:14px}
.why-line{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.why-line b{font-family:var(--display);font-weight:400;font-size:1.1rem}
.why.compact .why-grid{margin-top:12px}

.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.92rem;background:var(--panel)}
.chip.signal{background:var(--signal-bg);color:var(--signal-ink)}
.chip.noise{background:var(--noise-bg);color:var(--noise-ink)}
.chip.check{background:var(--check-bg);color:var(--check-ink)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.scn p{margin:0 0 8px;word-break:keep-all}
.crit{display:inline-block;background:var(--check-bg);color:var(--check-ink);border:2px solid var(--line);border-radius:10px;padding:2px 10px;font-weight:900}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:flex-start;word-break:keep-all}
.steps .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--display);border:2px solid var(--line)}
.defs{display:grid;gap:8px;margin-top:14px}
.def{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;word-break:keep-all}
.def .chip{flex:none}

/* setup */
.trow{display:flex;align-items:center;gap:10px;border:3px solid var(--tc);border-radius:16px;padding:6px 10px;background:var(--panel)}
.tav{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--tc);font-size:1.25rem;flex:none}
.trow input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-weight:700;font-size:1.05rem;color:var(--ink);padding:6px 4px}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.opt{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:14px}
.opt>b{min-width:5.5em}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:3px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 16px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.step-btn{width:42px;height:42px;border-radius:50%;border:3px solid var(--line);background:var(--panel);font-family:var(--display);font-size:1.3rem;cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
.step-btn[disabled]{opacity:.4;cursor:not-allowed}
.count{font-family:var(--display);font-size:1.5rem;min-width:2.4em;text-align:center}
.startbar{display:flex;justify-content:center;margin-top:28px}
.resume{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--check-bg);color:var(--check-ink);border:3px solid var(--line);border-radius:18px;padding:12px 16px;margin-top:16px;font-weight:700}

/* play */
.score{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.schip{display:flex;align-items:center;gap:8px;border:3px solid var(--tc);border-radius:999px;padding:4px 14px 4px 6px;background:var(--panel);font-weight:900}
.schip .tav{width:30px;height:30px;font-size:1rem}
.schip.act{box-shadow:0 0 0 4px var(--accent-bg),0 0 0 6px var(--tc)}
.schip .pt{font-family:var(--display);font-size:1.15rem;font-weight:400}
.schip .pt.bump{animation:bump .6s}
.prog{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:18px 0 12px}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--panel)}
.dots i.done{background:var(--accent)}
.dots i.cur{background:var(--check);transform:scale(1.35)}
.prog .no{font-family:var(--display);font-size:1.25rem}
.timer{position:relative;height:22px;border:3px solid var(--line);border-radius:999px;background:var(--panel);overflow:hidden;margin-bottom:16px}
.tfill{position:absolute;inset:0 auto 0 0;width:100%;background:var(--signal);transition:width .2s linear}
.timer.hurry .tfill{background:var(--noise)}
.timer.hurry{animation:shake .4s infinite}
#tnum{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:.8rem;color:var(--on)}
.msg{background:var(--panel);border:3px solid var(--line);border-radius:24px;box-shadow:0 8px 0 var(--shadow);overflow:hidden;animation:deal .55s cubic-bezier(.2,1.4,.4,1)}
.msg-top{display:flex;align-items:center;gap:10px;background:var(--accent-bg);padding:10px 20px;border-bottom:3px solid var(--line);font-weight:900}
.msg-top .ic{font-size:1.5rem}
.msg-top .who{font-size:1.05rem}
.msg-body{padding:clamp(20px,4vw,40px);font-size:clamp(1.4rem,3.6vw,2.4rem);line-height:1.5;font-weight:700;word-break:keep-all}
.ask{margin:20px 0 8px;font-family:var(--display);font-size:1.25rem}
.arow{display:grid;grid-template-columns:180px 1fr;gap:12px;align-items:center;margin-bottom:12px}
.alabel{display:flex;align-items:center;gap:8px;font-weight:900;border-left:8px solid var(--tc);padding:6px 10px;background:var(--panel);border-radius:10px;border-top:2px solid var(--soft);border-right:2px solid var(--soft);border-bottom:2px solid var(--soft)}
.alabel .res{margin-left:auto;font-size:1.2rem}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ch{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:72px;padding:10px 8px;border:3px solid var(--line);border-radius:16px;background:var(--cbg);color:var(--cink);font-family:var(--display);font-size:clamp(1.05rem,2.2vw,1.4rem);cursor:pointer;box-shadow:0 5px 0 var(--shadow);transition:transform .12s,box-shadow .12s,background .12s}
.ch .e{font-size:1.5rem;line-height:1}
.ch:hover:not([disabled]){transform:translateY(-2px)}
.ch[aria-pressed="true"]{background:var(--c);color:var(--on);transform:translateY(-3px);box-shadow:0 8px 0 var(--shadow)}
.ch[disabled]{cursor:default}
.ch.right{background:var(--c);color:var(--on)}
.ch.right::after{content:"정답";position:absolute;top:-12px;right:-6px;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:999px;font-family:var(--body);font-weight:900;font-size:.75rem;padding:0 8px}
.ch.wrong{opacity:.55;text-decoration:line-through}
[data-c="signal"]{--c:var(--signal);--cbg:var(--signal-bg);--cink:var(--signal-ink)}
[data-c="noise"]{--c:var(--noise);--cbg:var(--noise-bg);--cink:var(--noise-ink)}
[data-c="check"]{--c:var(--check);--cbg:var(--check-bg);--cink:var(--check-ink)}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:18px}
.hint{font-weight:700;color:var(--muted)}

/* feedback */
.fb{margin-top:22px;border:3px solid var(--c);border-radius:22px;background:var(--panel);box-shadow:0 7px 0 var(--c);overflow:hidden;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.fb-head{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;background:var(--cbg);color:var(--cink);padding:14px 20px;border-bottom:3px solid var(--c)}
.fb-head .big{font-size:2.6rem;line-height:1}
.fb-head h3{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,4vw,2.3rem);margin:0;line-height:1.1}
.fb-head .kick{font-size:.9rem;font-weight:700}
.fb-head .act{margin-left:auto;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:700;font-size:.95rem;max-width:22em;word-break:keep-all}
.fb-body{padding:clamp(14px,2.6vw,24px)}
.mood{font-family:var(--display);font-size:1.25rem;margin:0 0 8px}
.why-text{margin:0 0 14px;font-size:1.08rem;word-break:keep-all}
.gates{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.gate{border:3px dashed var(--line);border-radius:16px;padding:12px 14px;background:var(--bg)}
.gate .gh{display:flex;align-items:center;gap:8px;font-weight:900}
.gate .gh small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
.gate .gv{margin-left:auto;font-family:var(--display);font-size:1.1rem;padding:2px 12px;border-radius:999px;border:2px solid var(--line)}
.gv.ok{background:var(--signal-bg);color:var(--signal-ink)}
.gv.no{background:var(--noise-bg);color:var(--noise-ink)}
.gv.na{background:var(--soft);color:var(--muted)}
.gate p{margin:6px 0 0;font-size:.95rem;word-break:keep-all}
.tip{background:var(--check-bg);color:var(--check-ink);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700;margin:0 0 14px;word-break:keep-all}
.rlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rlist li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 12px;border-radius:12px;border:2px solid var(--soft);background:var(--bg);font-weight:700}
.rlist li.ok{border-color:var(--signal)}
.rlist li.bad{border-color:var(--noise)}
.rlist .pts{margin-left:auto;font-family:var(--display);font-size:1.15rem}
.combo{background:var(--check);color:#1B1464;border:2px solid var(--line);border-radius:999px;padding:0 10px;font-size:.85rem;font-weight:900}

/* result */
.rhead{text-align:center;margin:30px 0 8px}
.rhead h2{font-family:var(--display);font-weight:400;font-size:clamp(2rem,6vw,3.6rem);margin:0;line-height:1.2}
.rhead p{margin:6px 0 0;color:var(--muted);font-weight:700}
.rlist2{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:12px}
.rrow{display:grid;grid-template-columns:64px 52px minmax(90px,200px) 1fr auto;gap:12px;align-items:center;background:var(--panel);border:3px solid var(--line);border-radius:20px;padding:12px 16px;box-shadow:0 5px 0 var(--shadow);opacity:.55;filter:grayscale(.6)}
.rrow.in{opacity:1;filter:none;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.rrow.first.in{border-color:var(--check);box-shadow:0 0 0 4px var(--check),0 8px 0 var(--shadow);background:var(--check-bg);color:var(--check-ink)}
.rk{font-family:var(--display);font-size:1.8rem;text-align:center}
.rav{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--tc);font-size:1.6rem}
.rname{font-family:var(--display);font-size:clamp(1.1rem,2.6vw,1.6rem);overflow-wrap:anywhere}
.rbar{height:20px;border:3px solid var(--line);border-radius:999px;background:var(--bg);overflow:hidden}
.rbar i{display:block;height:100%;width:0;background:var(--tc);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.rrow.in .rbar i{width:var(--w)}
.rscore{text-align:right;min-width:5.5em}
.rscore b{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,4vw,2.4rem)}
.rscore small{font-weight:700;margin-left:2px}
.rmeta{display:block;font-size:.8rem;font-weight:700;opacity:.8}
.skip{display:flex;justify-content:center;margin-top:16px}
.after{margin-top:34px}
.after[hidden]{display:none}
.after.show{animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.tscroll{overflow-x:auto;border:3px solid var(--line);border-radius:18px;background:var(--panel)}
table.rv{border-collapse:collapse;width:100%;min-width:560px;font-size:.95rem}
.rv th,.rv td{padding:8px 10px;border-bottom:2px solid var(--soft);text-align:left;vertical-align:top}
.rv th{background:var(--accent-bg);font-weight:900;white-space:nowrap}
.rv td.c{text-align:center;white-space:nowrap}
.compass{display:grid;gap:12px;margin-top:6px}
.cq{border:3px solid var(--line);border-radius:18px;padding:14px 16px;background:var(--panel)}
.cq b{font-family:var(--display);font-weight:400;font-size:1.15rem}
.cq span{display:block;word-break:keep-all}
.cq small{color:var(--muted);font-weight:700}
.cout{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding-left:14px;font-weight:700}
.crits{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.crits div{border:3px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--panel);text-align:center}
.crits b{font-family:var(--display);font-weight:400;font-size:1.2rem;display:block}
.crits span{font-size:.9rem;color:var(--muted);font-weight:700}
.todayq{margin-top:18px;text-align:center;font-family:var(--display);font-size:clamp(1.2rem,3vw,1.8rem);background:var(--accent);color:var(--on-accent);border:3px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 6px 0 var(--shadow);word-break:keep-all}
.endbtns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:26px}

/* modal + confetti */
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.ov{position:fixed;inset:0;z-index:70;background:rgba(10,8,40,.6);display:grid;place-items:center;padding:20px}
.dlg{background:var(--panel);border:3px solid var(--line);border-radius:22px;box-shadow:0 8px 0 var(--shadow);padding:22px;max-width:420px;width:100%}
.dlg h3{font-family:var(--display);font-weight:400;font-size:1.4rem;margin:0 0 8px}
.dlg p{margin:0 0 16px;word-break:keep-all}
.dact{display:flex;gap:12px;justify-content:flex-end}

@keyframes deal{from{opacity:0;transform:translateY(-34px) rotate(-3deg) scale(.96)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

@media (max-width:820px){
  .why-grid,.two,.gates{grid-template-columns:1fr}
  .arow{grid-template-columns:1fr;gap:6px}
  .crits{grid-template-columns:1fr 1fr}

/* ───────── 소리 ───────── */
var AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,when,vol){
  var a=ac();if(!a)return;
  try{
    var o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+(when||0);
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.12,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+0.05);
  }catch(e){}
}
function sfx(k){
  if(!S.sound)return;

    if(k==='click'){tone(520,.08,'triangle',0,.08);}
    else if(k==='correct'){tone(660,.14,'triangle',0,.14);tone(880,.22,'triangle',.12,.14);}
    else if(k==='wrong'){tone(220,.2,'sawtooth',0,.08);tone(170,.3,'sawtooth',.16,.08);}
    else if(k==='tick'){tone(900,.05,'square',0,.04);}
    else if(k==='pop'){tone(400,.1,'triangle',0,.12);tone(600,.12,'triangle',.07,.12);}
    else if(k==='drum'){for(var i=0;i<22;i++){tone(110,.1,'triangle',i*(0.1-i*0.0025),.1);}}
    else if(k==='fanfare'){[523,659,784,1047,784,1047].forEach(function(f,i){tone(f,.28,'square',i*.14,.07);});tone(1047,.6,'triangle',.9,.12);}
  }catch(e){}
}

var cv=document.getElementById('confetti'),cx=cv.getContext('2d'),parts=[],raf=0,rainInt=null;
var CCOL=['#7C5CFF','#FF4D6D','#FFB800','#00B37E','#2E8BFF','#FF8A1F','#FF5FA8'];
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function sizeCv(){var d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);}
window.addEventListener('resize',sizeCv);sizeCv();
function burst(x,y,n,o){
  o=o||{};if(reduce)n=Math.ceil(n/5);
  var ang=o.angle==null?-90:o.angle,sp=o.spread==null?50:o.spread,v=o.speed||[12,24];
  for(var i=0;i<n;i++){
    var a=(ang+(Math.random()-.5)*sp)*Math.PI/180,s=v[0]+Math.random()*(v[1]-v[0]);
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,w:6+Math.random()*8,h:8+Math.random()*10,
      c:CCOL[Math.floor(Math.random()*CCOL.length)],r:Math.random()*6,vr:(Math.random()-.5)*.4,
      round:Math.random()<.25,life:0,max:110+Math.random()*80});
  }
  if(!raf)raf=requestAnimationFrame(loop);
}
function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];p.life++;p.vy+=.45;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    var al=Math.max(0,1-Math.max(0,p.life-p.max+30)/30);
    if(p.life>p.max||p.y>innerHeight+30){parts.splice(i,1);continue;}
    cx.save();cx.globalAlpha=al;cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
    if(p.round){cx.beginPath();cx.arc(0,0,p.w/2,0,6.283);cx.fill();}else{cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);}
    cx.restore();
  }
  if(parts.length){raf=requestAnimationFrame(loop);}else{raf=0;cx.clearRect(0,0,innerWidth,innerHeight);}
}
function cannons(){
  var w=innerWidth,h=innerHeight;
  burst(0,h,110,{angle:-58,spread:38,speed:[16,30]});
  burst(w,h,110,{angle:-122,spread:38,speed:[16,30]});
  setTimeout(function(){burst(w*.5,h*.95,120,{angle:-90,spread:70,speed:[18,32]});},450);
  setTimeout(function(){burst(0,h,80,{angle:-65,spread:35,speed:[14,26]});burst(w,h,80,{angle:-115,spread:35,speed:[14,26]});},1000);
  if(rainInt)clearInterval(rainInt);
  var n=0;rainInt=setInterval(function(){
    burst(Math.random()*innerWidth,-10,10,{angle:90,spread:60,speed:[2,6]});
    if(++n>16){clearInterval(rainInt);rainInt=null;}
  },180);
}

function countUp(el,to,ms){
  var t0=null;
  function step(ts){
    if(t0===null)t0=ts;
    var p=Math.min(1,(ts-t0)/ms);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function revealRow(row,instant){
  if(row.classList.contains('in'))return;
  row.classList.add('in');
  var rank=+row.dataset.rank,score=+row.dataset.score;
  row.querySelector('.rk').textContent=rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':rank+'위';
  var b=row.querySelector('[data-count]');
  if(instant){b.textContent=score;}else{countUp(b,score,900);sfx('pop');}
}

  if(S.cheered)return;S.cheered=true;

  var h=document.getElementById('rhead'),s=document.getElementById('rsub');
  if(h)h.textContent='🏆 '+w.join(', ')+(w.length>1?' 공동 우승!':' 우승!');
  if(s)s.textContent=w.length>1?'막상막하! 모두 박수 쳐 주세요 👏':'신호 탐지 레이더가 제일 밝았어요! 모두 박수 👏';
  sfx('fanfare');cannons();
}

function render(){

  else{body=whyHTML(true)+resultHTML();}

function stopTimer(){if(S.tInt){clearInterval(S.tInt);S.tInt=null;}}
function tick(){
  var left=Math.max(0,(S.tEnd-Date.now())/1000),f=document.getElementById('tfill'),n=document.getElementById('tnum'),tm=document.getElementById('timer');
  if(f)f.style.width=(left/S.timer*100)+'%';
  var sec=Math.ceil(left);
  if(n)n.textContent=sec+'초';
  if(tm)tm.classList.toggle('hurry',sec<=5);
  if(sec!==S.lastSec){S.lastSec=sec;if(sec<=5&&sec>0)sfx('tick');}
  if(left<=0){stopTimer();reveal(true);}
}
function startTimer(){
  stopTimer();
  if(!S.timer||S.revealed)return;
  S.tEnd=Date.now()+S.timer*1000;S.lastSec=null;
  S.tInt=setInterval(tick,200);tick();
}
function startCard(){
  S.picks={};S.revealed=false;S.lastRes=null;
  render();startTimer();save();
}
function reveal(auto){
  if(S.revealed||S.phase!=='play')return;
  stopTimer();
  var c=CARDS[S.idx],res=[],bump=[];
  activeTeams().forEach(function(t){
    var team=S.teams[t],ch=S.picks[t]||null,ok=(ch===c.ans),pts=0,combo=false;
    if(ok){team.streak++;pts=10;if(team.streak>=2){pts+=5;combo=true;}}else{team.streak=0;}
    team.score+=pts;team.hist[S.idx]={choice:ch,ok:ok,pts:pts,combo:combo};
    res.push({t:t,ch:ch,ok:ok,pts:pts,combo:combo});
    if(pts)bump.push(t);
  });
  S.revealed=true;S.lastRes=res;
  paintScore(bump);paintAsk();paintAnswers();paintFeedback();paintControls();
  var any=res.some(function(r){return r.ok;});
  sfx(any?'correct':'wrong');
  if(any){burst(innerWidth/2,innerHeight*.45,45,{angle:-90,spread:140,speed:[8,17]});}
  var fb=document.getElementById('fb');
  if(fb&&fb.scrollIntoView){setTimeout(function(){fb.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'});},120);}
  save();
}
function nextCard(){
  if(S.idx<CARDS.length-1){S.idx++;startCard();window.scrollTo(0,0);}
  else{S.phase='result';stopTimer();render();save();window.scrollTo(0,0);}
}
function startGame(){
  S.teams=teamsFromSetup();S.idx=0;S.phase='play';S.saved=null;
  ac();startCard();window.scrollTo(0,0);
}
function toReady(){
  stopTimer();clearRT();parts.length=0;

  clearSave();S.saved=null;S.phase='ready';render();window.scrollTo(0,0);
}
function toggleTheme(){
  var el=document.documentElement,cur=el.getAttribute('data-theme');
  if(!cur){cur=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
  el.setAttribute('data-theme',cur==='dark'?'light':'dark');
}

root.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  var a=b.dataset.a;
  if(a==='sound'){S.sound=!S.sound;b.textContent=S.sound?'🔊':'🔇';if(S.sound)sfx('click');}
  else if(a==='theme'){toggleTheme();}
  else if(a==='home'){ask('처음으로 돌아갈까요?','진행 중인 점수가 모두 사라져요.','처음으로',toReady);}
  else if(a==='why'){S.whyOpen=!S.whyOpen;render();}
  else if(a==='tc-'){if(S.teamCount>2){S.teamCount--;render();}}
  else if(a==='tc+'){if(S.teamCount<8){S.teamCount++;render();}}
  else if(a==='mode'){S.mode=b.dataset.v;render();}
  else if(a==='timer'){S.timer=+b.dataset.v;render();}
  else if(a==='start'){startGame();}
  else if(a==='resume'){
    var sv=S.saved;if(!sv)return;
    S.teams=sv.teams;S.mode=sv.mode;S.timer=sv.timer;S.idx=sv.idx;S.picks=sv.picks||{};S.revealed=!!sv.revealed;S.lastRes=sv.lastRes;S.phase=sv.phase;S.saved=null;
    ac();render();if(S.phase==='play'&&!S.revealed)startTimer();
  }
  else if(a==='discard'){clearSave();S.saved=null;render();}
  else if(a==='pick'){
    if(S.revealed)return;
    S.picks[+b.dataset.t]=b.dataset.c;sfx('click');paintAnswers();paintControls();save();
  }
  else if(a==='reveal'){reveal(false);}
  else if(a==='next'){nextCard();}
  else if(a==='skip'){skipShow();}
  else if(a==='again'){
    S.teams.forEach(function(t){t.score=0;t.streak=0;t.hist=new Array(CARDS.length).fill(null);});
    parts.length=0;S.idx=0;S.phase='play';startCard();window.scrollTo(0,0);
  }
  else if(a==='newgame'){toReady();}
});
root.addEventListener('input',function(e){
  var n=e.target&&e.target.dataset?e.target.dataset.name:undefined;
  if(n!==undefined){S.names[+n]=e.target.value;}
});

/* ───────── 시작 ───────── */
(function init(){
  var sv=load();
  if(sv&&sv.teams&&sv.teams.length&&(sv.phase==='play'||sv.phase==='result')){S.saved=sv;}
  render();
})();
})();
</script>
