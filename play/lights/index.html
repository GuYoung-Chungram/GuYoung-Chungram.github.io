<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>색 신호등</title>
  <style>
    :root {
      --header-height: 64px;
      --page-bg: #111318;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--page-bg);
      color: #fff;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .app { min-height: 100dvh; }

    .topbar {
      position: fixed;
      z-index: 10;
      top: 0;
      left: 0;
      right: 0;
      height: calc(var(--header-height) + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 16px 0;
      display: flex;
      align-items: center;
      background: rgba(17, 19, 24, .92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,.12);
    }

    .home-button {
      min-width: 78px;
      height: 42px;
      border: 0;
      border-radius: 12px;
      padding: 0 16px;
      color: #17191e;
      background: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }

    .home-button:active { transform: scale(.97); }

    .title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 17px;
      font-weight: 800;
      white-space: nowrap;
    }

    .count-button {
      margin-left: auto;
      min-width: 56px;
      height: 42px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 12px;
      padding: 0 14px;
      color: #fff;
      background: rgba(255,255,255,.08);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }

    .count-button:active { transform: scale(.97); }

    .count-panel {
      display: none;
      position: fixed;
      z-index: 15;
      top: calc(var(--header-height) + env(safe-area-inset-top) + 8px);
      right: 16px;
      background: #1c1f27;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 12px 32px rgba(0,0,0,.4);
      gap: 8px;
      flex-wrap: wrap;
      max-width: 220px;
    }

    .count-panel.open { display: flex; }

    .count-option {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 10px;
      background: rgba(255,255,255,.1);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .count-option.active { background: #fff; color: #17191e; }
    .count-option:active { transform: scale(.95); }

    .signal-list {
      min-height: 100dvh;
      padding-top: calc(var(--header-height) + env(safe-area-inset-top));
      display: grid;
      gap: 12px;
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }

    .color-button {
      border: 0;
      border-radius: 24px;
      cursor: pointer;
      box-shadow: inset 0 -8px 20px rgba(0,0,0,.18), 0 8px 24px rgba(0,0,0,.24);
      transition: transform .15s ease, filter .15s ease;
    }

    .color-button:active { transform: scale(.98); filter: brightness(.88); }

    .fullscreen-color {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5;
      cursor: pointer;
    }

    body.fullscreen-mode .signal-list { display: none; }
    body.fullscreen-mode .fullscreen-color { display: block; }
    body.fullscreen-mode .count-panel { display: none !important; }
    body.fullscreen-mode .topbar {
      background: rgba(0, 0, 0, .18);
      border-bottom-color: rgba(255,255,255,.2);
    }

    .hint {
      display: none;
      position: fixed;
      z-index: 11;
      right: 16px;
      top: calc(env(safe-area-inset-top) + 22px);
      font-size: 13px;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0,0,0,.35);
      pointer-events: none;
    }

    body.fullscreen-mode .hint { display: block; }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button id="homeButton" class="home-button" type="button" aria-label="홈으로 돌아가기">홈</button>
      <span class="title">색 신호등</span>
      <button id="countButton" class="count-button" type="button" aria-label="색상 개수 선택">개수</button>
    </header>

    <div id="countPanel" class="count-panel" aria-label="색상 개수 선택 패널"></div>

    <section id="signalList" class="signal-list" aria-label="색 선택"></section>

    <div id="fullscreenColor" class="fullscreen-color" aria-label="색상 전체화면"></div>
    <span class="hint">화면을 누르거나 홈을 누르세요</span>
  </main>

  <script>
    const body = document.body;
    const homeButton = document.getElementById('homeButton');
    const countButton = document.getElementById('countButton');
    const countPanel = document.getElementById('countPanel');
    const signalList = document.getElementById('signalList');
    const fullscreenColor = document.getElementById('fullscreenColor');

    // 사용 가능한 색상 팔레트 (개수 늘어날 때 순서대로 추가됨)
    const palette = [
      { hex: '#ef233c', label: '빨강' },
      { hex: '#20bf6b', label: '초록' },
      { hex: '#2f80ed', label: '파랑' },
      { hex: '#f7b731', label: '노랑' },
      { hex: '#9b59b6', label: '보라' },
      { hex: '#ff7f50', label: '주황' },
    ];

    const MIN_COUNT = 2;
    const MAX_COUNT = palette.length;

    let currentCount = 3;

    function renderCountOptions() {
      countPanel.innerHTML = '';
      for (let n = MIN_COUNT; n <= MAX_COUNT; n++) {
        const btn = document.createElement('button');
        btn.className = 'count-option' + (n === currentCount ? ' active' : '');
        btn.type = 'button';
        btn.textContent = n;
        btn.setAttribute('aria-label', `색상 ${n}개로 설정`);
        btn.addEventListener('click', () => setCount(n));
        countPanel.appendChild(btn);
      }
    }

    function renderSignalList() {
      signalList.style.gridTemplateRows = `repeat(${currentCount}, 1fr)`;
      signalList.innerHTML = '';
      palette.slice(0, currentCount).forEach((color) => {
        const btn = document.createElement('button');
        btn.className = 'color-button';
        btn.type = 'button';
        btn.style.background = color.hex;
        btn.dataset.color = color.hex;
        btn.setAttribute('aria-label', `${color.label} 전체화면`);
        btn.addEventListener('click', () => showColor(color.hex));
        signalList.appendChild(btn);
      });
    }

    function setCount(n) {
      currentCount = n;
      renderCountOptions();
      renderSignalList();
      countPanel.classList.remove('open');
    }

    function showHome() {
      body.classList.remove('fullscreen-mode');
      fullscreenColor.style.backgroundColor = '';
      document.querySelector('meta[name="theme-color"]').content = '#111111';
    }

    function showColor(color) {
      fullscreenColor.style.backgroundColor = color;
      body.classList.add('fullscreen-mode');
      document.querySelector('meta[name="theme-color"]').content = color;
    }

    countButton.addEventListener('click', () => {
      countPanel.classList.toggle('open');
    });

    document.addEventListener('click', (event) => {
      if (!countPanel.contains(event.target) && event.target !== countButton) {
        countPanel.classList.remove('open');
      }
    });

    homeButton.addEventListener('click', showHome);
    fullscreenColor.addEventListener('click', showHome);

    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') showHome();
    });

    renderCountOptions();
    renderSignalList();
  </script>
</body>
</html>
