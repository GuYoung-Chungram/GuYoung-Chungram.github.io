<!DOCTYPE html>
<html lang="ko" class="theme-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎲 주사위 토크 — 골드마인 Q카드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html.theme-light {
  --bg: #EFE0C2;
  --surface: #FBF4E3;
  --surface2: #F4E8CD;
  --text: #33220F;
  --text-sec: #7C6444;
  --border: rgba(122,74,18,0.22);
  --accent: #B7791F;
  --accent2: #7A4A12;
  --blue-dice: #C8921A;
  --blue-light: #EDC050;
  --blue-dark: #8C6410;
  --green-dice: #B8582A;
  --green-light: #DA8150;
  --green-dark: #7E3A17;
  --shine: rgba(255,255,255,0.40);
  --q-bg: linear-gradient(135deg, #B7791F 0%, #7A4A12 100%);
  --q-card: #FFFAEC;
  --shadow: 0 8px 36px rgba(90,58,20,0.20);
  --shadow-sm: 0 2px 12px rgba(90,58,20,0.13);
  --modal-bg: rgba(35,20,8,0.62);
  --tag-bg: rgba(183,121,31,0.12);
  --edit-bg: #F7ECD3;
  --tbl-head: #7A4A12;
  --tbl-odd: #F7ECD3;
  --tbl-even: #FFFAEC;
  --tbl-border: rgba(122,74,18,0.18);
}
html.theme-dark {
  --bg: #17100A;
  --surface: #241810;
  --surface2: #2D1F14;
  --text: #F3E6CC;
  --text-sec: #B79F7A;
  --border: rgba(240,200,120,0.15);
  --accent: #E0B040;
  --accent2: #F0C860;
  --blue-dice: #D9A52A;
  --blue-light: #F2CB62;
  --blue-dark: #9A6E10;
  --green-dice: #C0612F;
  --green-light: #E08A58;
  --green-dark: #84401B;
  --shine: rgba(255,255,255,0.16);
  --q-bg: linear-gradient(135deg, #6B4513 0%, #2E1C08 100%);
  --q-card: #2A1C11;
  --shadow: 0 8px 36px rgba(0,0,0,0.55);
  --shadow-sm: 0 2px 12px rgba(0,0,0,0.35);
  --modal-bg: rgba(0,0,0,0.78);
  --tag-bg: rgba(224,176,64,0.13);
  --edit-bg: #2D1F14;
  --tbl-head: #6B4513;
  --tbl-odd: #2A1C11;
  --tbl-even: #221710;
  --tbl-border: rgba(240,200,120,0.10);
}

body {
  font-family: 'Noto Sans KR', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center;
  overflow-x: hidden;
  transition: background .3s, color .3s;
}

/* ─ HEADER ─ */
header {
  width: 100%; background: var(--accent); color: #fff;
  padding: 12px 16px 10px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 300;
  box-shadow: 0 2px 18px rgba(183,121,31,.32);
}
.hdr-left h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: -.02em; }
.hdr-left .sub { font-size: .68rem; opacity: .78; }
.hdr-btns { display: flex; gap: 6px; }
.hdr-btn {
  background: rgba(255,255,255,.18); border: none; color: #fff;
  width: 34px; height: 34px; border-radius: 50%; font-size: .95rem;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background .18s; flex-shrink: 0;
}
.hdr-btn:hover { background: rgba(255,255,255,.32); }

/* ─ MAIN ─ */
main {
  width: 100%; max-width: 480px;
  padding: 20px 15px 72px;
  display: flex; flex-direction: column; align-items: center; gap: 20px;
}

/* ─ GUIDE ─ */
.guide-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 15px 18px;
  width: 100%; text-align: center; box-shadow: var(--shadow-sm);
}
.guide-box .er { font-size: 1.7rem; margin-bottom: 5px; }
.guide-box h2 { font-size: 1rem; font-weight: 700; color: var(--accent); margin-bottom: 3px; }
.guide-box p { font-size: .8rem; color: var(--text-sec); line-height: 1.7; }

/* ─ DICE ─ */
.dice-section { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.dice-pair { display: flex; align-items: center; justify-content: center; gap: 22px; }
.dice-wrapper { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.dice-label { font-size: .76rem; font-weight: 700; letter-spacing: .04em; display: flex; align-items: center; gap: 4px; }
.dice-label.blue { color: var(--blue-dice); }
.dice-label.green { color: var(--green-dice); }
.axis-badge { font-size: .66rem; padding: 2px 7px; border-radius: 20px; font-weight: 700; }
.dice-label.blue .axis-badge { background: rgba(183,121,31,.1); color: var(--blue-dice); }
.dice-label.green .axis-badge { background: rgba(184,88,42,.12); color: var(--green-dice); }

/* ── dice-scene: 스피너 / 결과 겹침 컨테이너 ── */
.dice-scene {
  width: 96px; height: 96px;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  user-select: none; position: relative;
}

/* ── 3D 스피너 (굴리는 중만 보임) ── */
.dice-spinner {
  width: 96px; height: 96px;
  position: absolute; inset: 0;
  transform-style: preserve-3d;
  perspective: 420px;
  opacity: 0; pointer-events: none;
  transition: opacity .12s;
}
.dice-spinner.spinning { opacity: 1; animation: spinRoll .85s cubic-bezier(.4,0,.2,1) infinite; }
@keyframes spinRoll {
  0%   { transform: rotateX(0deg)   rotateY(0deg); }
  33%  { transform: rotateX(120deg) rotateY(80deg); }
  66%  { transform: rotateX(240deg) rotateY(200deg); }
  100% { transform: rotateX(360deg) rotateY(360deg); }
}
.sp-face {
  position: absolute; width: 96px; height: 96px; border-radius: 14px;
  backface-visibility: hidden;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.22);
}
.blue-dice  .sp-face { background: var(--blue-dice); }
.green-dice .sp-face { background: var(--green-dice); }
.blue-dice  .sp-front  { background: linear-gradient(145deg,var(--blue-light),var(--blue-dice)); }
.green-dice .sp-front  { background: linear-gradient(145deg,var(--green-light),var(--green-dice)); }
.sp-front  { transform: translateZ(48px); }
.sp-back   { transform: rotateY(180deg) translateZ(48px); }
.sp-right  { transform: rotateY(90deg)  translateZ(48px); }
.sp-left   { transform: rotateY(-90deg) translateZ(48px); }
.sp-top    { transform: rotateX(90deg)  translateZ(48px); }
.sp-bottom { transform: rotateX(-90deg) translateZ(48px); }

/* ── 결과 주사위 (2D 정면, 점만 표시) ── */
.dice-result {
  width: 96px; height: 96px; border-radius: 14px;
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  opacity: 1; transition: opacity .15s;
  box-shadow: 0 4px 20px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.3);
}
.dice-result.hidden { opacity: 0; }
.blue-result  { background: linear-gradient(145deg,var(--blue-light),var(--blue-dice)); }
.green-result { background: linear-gradient(145deg,var(--green-light),var(--green-dice)); }

/* ── 점 그리드 (JS로 동적 생성) ── */
.dot-grid {
  display: grid; gap: 7px; padding: 12px;
  width: 100%; height: 100%;
  align-items: center; justify-items: center;
}
/* 숫자별 그리드 레이아웃 */
.dot-grid.n1 { grid-template: 1fr / 1fr; }
.dot-grid.n2 { grid-template: 1fr 1fr / 1fr; }
.dot-grid.n3 { grid-template: repeat(3,1fr) / 1fr; }
.dot-grid.n4 { grid-template: 1fr 1fr / 1fr 1fr; }
.dot-grid.n5 { grid-template: repeat(3,1fr) / 1fr 1fr 1fr; }
.dot-grid.n6 { grid-template: repeat(3,1fr) / 1fr 1fr; }
.dot-grid .dot {
  width: 13px; height: 13px;
  background: rgba(255,255,255,.95);
  border-radius: 50%;
  box-shadow: 0 1px 4px rgba(0,0,0,.3);
}
.dot-grid .dot.h { opacity: 0; }
/* 초기(굴리기 전) 물음표 */
.dot-grid.empty {
  grid-template: 1fr / 1fr;
  align-items: center; justify-items: center;
}
.dot-grid.empty::after {
  content: "?";
  font-size: 2rem; font-weight: 800;
  color: rgba(255,255,255,.7);
  font-family: 'Noto Sans KR', sans-serif;
}

.dice-num {
  font-size: 1.65rem; font-weight: 800;
  min-width: 50px; height: 50px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  letter-spacing: -.03em; transition: color .2s;
}
.dice-num.blue { background: rgba(183,121,31,.08); color: var(--blue-dice); border: 2px solid rgba(183,121,31,.2); }
.dice-num.green { background: rgba(184,88,42,.08); color: var(--green-dice); border: 2px solid rgba(184,88,42,.2); }
@keyframes numPop { from { transform: scale(.6); opacity: .3; } to { transform: scale(1); opacity: 1; } }
.pop { animation: numPop .28s cubic-bezier(.34,1.56,.64,1); }

/* ─ BUTTONS ─ */
.roll-btn {
  width: 100%; max-width: 310px; padding: 14px 20px;
  background: linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);
  color: #fff; border: none; border-radius: 14px;
  font-family: 'Noto Sans KR',sans-serif;
  font-size: .98rem; font-weight: 700; cursor: pointer;
  box-shadow: 0 5px 20px rgba(183,121,31,.3);
  transition: transform .12s, box-shadow .12s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.roll-btn:active { transform: scale(.95); box-shadow: 0 2px 8px rgba(183,121,31,.18); }
.ind-btns { display: flex; gap: 8px; width: 100%; max-width: 310px; }
.ind-btn {
  flex: 1; padding: 9px 5px; border: none; border-radius: 11px;
  font-family: 'Noto Sans KR',sans-serif; font-size: .78rem; font-weight: 600;
  cursor: pointer; transition: transform .12s;
  display: flex; align-items: center; justify-content: center; gap: 4px;
}
.ind-btn:active { transform: scale(.92); }
.ind-btn.blue { background: rgba(183,121,31,.09); color: var(--blue-dice); border: 1.5px solid rgba(183,121,31,.2); }
.ind-btn.green { background: rgba(184,88,42,.09); color: var(--green-dice); border: 1.5px solid rgba(184,88,42,.2); }


/* ─ QUESTION CARD ─ */
.question-card {
  width: 100%; border-radius: 18px; overflow: hidden;
  box-shadow: var(--shadow); display: none;
}
.question-card.show { display: block; animation: qReveal .55s cubic-bezier(.34,1.56,.64,1); }
@keyframes qReveal {
  0%   { opacity:0; transform:translateY(32px) scale(.88) rotate(-1.5deg); }
  55%  { opacity:1; transform:scale(1.045) rotate(.5deg); }
  75%  { transform:scale(.97) rotate(-.3deg); }
  100% { opacity:1; transform:scale(1) rotate(0deg); }
}

/* 짜짠 — 화면 플래시 오버레이 */
.tada-flash {
  position: fixed; inset: 0; z-index: 9000;
  background: radial-gradient(ellipse at center, rgba(183,121,31,.22) 0%, rgba(183,121,31,0) 70%);
  pointer-events: none; opacity: 0;
  animation: flashPop .55s ease-out forwards;
}
@keyframes flashPop {
  0%   { opacity: 0; transform: scale(.8); }
  30%  { opacity: 1; transform: scale(1.05); }
  100% { opacity: 0; transform: scale(1.2); }
}

/* 짜짠 — 파티클 캔버스 */
#confettiCanvas {
  position: fixed; inset: 0; z-index: 8999;
  pointer-events: none; width: 100%; height: 100%;
}

/* 짜짠 — q-icon 팡팡 */
.q-icon { font-size: 2rem; display: inline-block; }
.q-icon.tada { animation: iconBounce .6s cubic-bezier(.34,1.56,.64,1); }
@keyframes iconBounce {
  0%   { transform: scale(0) rotate(-20deg); }
  60%  { transform: scale(1.45) rotate(10deg); }
  80%  { transform: scale(.88) rotate(-5deg); }
  100% { transform: scale(1) rotate(0deg); }
}

/* 짜짠 — q-text 글자 등장 */
.q-text { font-size: 1.12rem; font-weight: 700; color: var(--text); line-height: 1.65; letter-spacing: -.02em; word-break: keep-all; }
.q-text.text-in { animation: textSlide .45s .18s cubic-bezier(.34,1.4,.64,1) both; }
@keyframes textSlide {
  from { opacity:0; transform: translateX(-12px); }
  to   { opacity:1; transform: none; }
}

/* 짜짠 — 카드 광택 스윕 */
.question-card.show .q-hdr::after {
  content:''; position:absolute; inset:0; pointer-events:none;
  background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,.28) 50%, transparent 70%);
  animation: shimmerSweep .7s .1s ease-out forwards;
  border-radius: 0;
}
.q-hdr { position: relative; background: var(--q-bg); color: #fff; padding: 15px 18px 13px;
  display: flex; align-items: center; justify-content: space-between; overflow: hidden; }
@keyframes shimmerSweep {
  from { transform: translateX(-100%); }
  to   { transform: translateX(200%); }
}

.q-hdr-title { font-size: .88rem; font-weight: 700; opacity: .92; letter-spacing: -.01em; }
.q-coord { display: flex; align-items: center; gap: 7px; font-size: 1rem; font-weight: 700; }
.q-coord .cb { padding: 3px 10px; border-radius: 20px; font-size: .8rem; font-weight: 700; background: rgba(255,255,255,.22); }
.q-body { background: var(--q-card); padding: 20px 18px 18px; }
.q-mark { font-size: 1.7rem; color: var(--accent); line-height: 1; margin-bottom: 7px; }
.q-hint { margin-top: 12px; padding: 8px 12px; background: var(--tag-bg); border-left: 3px solid var(--accent); border-radius: 0 7px 7px 0; font-size: .78rem; color: var(--text-sec); line-height: 1.6; }

.reset-btn {
  width: 100%; max-width: 310px; padding: 11px;
  background: transparent; border: 1.5px solid var(--border); border-radius: 12px;
  font-family: 'Noto Sans KR',sans-serif; font-size: .86rem; font-weight: 600; color: var(--text-sec);
  cursor: pointer; transition: all .16s; display: none;
}
.reset-btn.show { display: block; }
.reset-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--tag-bg); }

/* ─ MODAL ─ */
.modal-overlay {
  position: fixed; inset: 0; background: var(--modal-bg);
  z-index: 500; display: none; align-items: flex-end; justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-overlay.show { display: flex; }
.modal-sheet {
  background: var(--surface); width: 100%; max-width: 520px;
  max-height: 92dvh; border-radius: 22px 22px 0 0;
  overflow: hidden; display: flex; flex-direction: column;
  animation: slideUp .3s cubic-bezier(.34,1.3,.64,1);
}
@keyframes slideUp { from { transform: translateY(100%); opacity: .5; } to { transform: translateY(0); opacity: 1; } }
.modal-hdr {
  padding: 15px 16px 13px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.modal-hdr h3 { font-size: .98rem; font-weight: 700; }
.modal-close {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--surface2); border: none;
  font-size: 1rem; cursor: pointer; color: var(--text-sec);
  display: flex; align-items: center; justify-content: center; transition: background .16s;
}
.modal-close:hover { background: var(--border); }
.modal-body { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }

/* ─ TABLE MODAL ─ */
.tbl-info {
  padding: 10px 15px; background: var(--tag-bg);
  font-size: .77rem; color: var(--text-sec); line-height: 1.6;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.tbl-info strong { color: var(--accent); }
.tbl-scroll { overflow-x: auto; padding-bottom: 16px; }
.q-table { border-collapse: collapse; min-width: 560px; width: 100%; font-size: .71rem; }
.q-table th, .q-table td { border: 1px solid var(--tbl-border); padding: 7px 8px; text-align: center; vertical-align: middle; line-height: 1.5; word-break: keep-all; }
.q-table thead th { background: var(--tbl-head); color: #fff; font-weight: 700; font-size: .74rem; }
.q-table thead th:first-child { width: 36px; }
.q-table .row-head { background: var(--tbl-head); color: #fff; font-weight: 700; width: 36px; }
.q-table tbody tr:nth-child(odd) td:not(.row-head) { background: var(--tbl-odd); }
.q-table tbody tr:nth-child(even) td:not(.row-head) { background: var(--tbl-even); }
.q-table td.hl { background: rgba(183,121,31,.18) !important; font-weight: 700; color: var(--accent); border: 2px solid var(--accent); }

/* ─ EDIT MODAL ─ */
.edit-tabs {
  display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0;
  overflow-x: auto; scrollbar-width: none;
}
.edit-tabs::-webkit-scrollbar { display: none; }
.edit-tab {
  padding: 10px 13px; font-size: .77rem; font-weight: 600; color: var(--text-sec);
  background: none; border: none; cursor: pointer; white-space: nowrap;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  font-family: 'Noto Sans KR',sans-serif;
  transition: color .16s, border-color .16s;
}
.edit-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.edit-intro {
  padding: 10px 15px 0; font-size: .77rem; color: var(--text-sec); line-height: 1.6;
}
.edit-intro strong { color: var(--accent); }
.edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 14px 16px; }
.edit-cell { display: flex; flex-direction: column; gap: 4px; }
.edit-cell label { font-size: .67rem; font-weight: 700; color: var(--text-sec); letter-spacing: .04em; display: flex; align-items: center; gap: 4px; }
.col-badge { display: inline-block; width: 16px; height: 16px; border-radius: 4px; font-size: .6rem; font-weight: 800; color: #fff; text-align: center; line-height: 16px; }
.col-badge.b { background: var(--blue-dice); }
.col-badge.g { background: var(--green-dice); }
.edit-cell textarea {
  width: 100%; padding: 7px 9px;
  background: var(--edit-bg); color: var(--text);
  border: 1.5px solid var(--border); border-radius: 9px;
  font-family: 'Noto Sans KR',sans-serif; font-size: .77rem; line-height: 1.55;
  resize: vertical; min-height: 70px;
  transition: border-color .16s;
}
.edit-cell textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(183,121,31,.1); }
.edit-footer {
  padding: 10px 14px 18px; border-top: 1px solid var(--border);
  display: flex; gap: 8px; flex-shrink: 0;
}
.btn-save {
  flex: 1; padding: 12px;
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  color: #fff; border: none; border-radius: 11px;
  font-family: 'Noto Sans KR',sans-serif; font-size: .9rem; font-weight: 700;
  cursor: pointer; transition: opacity .16s;
}
.btn-save:hover { opacity: .88; }
.btn-restore {
  padding: 12px 14px;
  background: var(--surface2); border: 1.5px solid var(--border); border-radius: 11px;
  font-family: 'Noto Sans KR',sans-serif; font-size: .8rem; font-weight: 600; color: var(--text-sec);
  cursor: pointer; transition: all .16s; white-space: nowrap;
}
.btn-restore:hover { color: #e11d48; border-color: #e11d48; background: rgba(225,29,72,.05); }

/* ─ TOAST ─ */
.toast {
  position: fixed; bottom: 52px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #1A1A2E; color: #fff;
  padding: 10px 22px; border-radius: 30px;
  font-size: .82rem; font-weight: 600;
  box-shadow: 0 4px 20px rgba(0,0,0,.3);
  z-index: 999; transition: transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s;
  opacity: 0; pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* ─ FOOTER ─ */
.site-footer {
  width: 100%;
  position: fixed; bottom: 0; left: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
  padding: 6px 12px;
  box-shadow: 0 -2px 10px rgba(183,121,31,.07);
}
.site-footer a {
  font-size: .62rem; color: var(--text-sec);
  text-decoration: none; letter-spacing: .01em;
  display: flex; align-items: center; gap: 5px;
  transition: color .16s;
  opacity: .72;
}
.site-footer a:hover { color: var(--accent); opacity: 1; }
.site-footer .footer-logo {
  font-weight: 700; color: var(--accent); opacity: 1;
  font-size: .64rem; letter-spacing: -.01em;
}
.site-footer .footer-sep {
  color: var(--border); font-size: .55rem; margin: 0 4px;
}
html.theme-dark .site-footer {
  background: var(--surface);
}

/* ─ ANI ─ */
.ani { opacity: 0; transform: translateY(18px); }
@media (prefers-reduced-motion: no-preference) {
  .ani { transition: opacity .45s ease, transform .45s ease; }
  .ani.in { opacity: 1; transform: none; }
}

/* ━━━ 진짜 랜덤 (crypto.getRandomValues) ━━━ */
function rand6() {
  if(window.crypto&&window.crypto.getRandomValues){
    var buf=new Uint32Array(1), v, limit=Math.floor(0xFFFFFFFF/6)*6;
    do{ window.crypto.getRandomValues(buf); v=buf[0]; } while(v>=limit);
    return (v%6)+1;
  }
  return Math.floor(Math.random()*6)+1;
}

/* ━━━ 짜짠! 파티클 엔진 ━━━ */
(function(){
  var canvas = document.getElementById("confettiCanvas");
  var ctx = canvas.getContext("2d");
  var particles = [];
  var raf = null;

  var COLORS = ["#FFD24A","#E8A317","#C8921A","#B8582A","#E9C98A","#8C5A2B","#F5E1A4","#7A9A45"];

  function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
  window.addEventListener("resize", resize); resize();

  function Particle(x, y) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - .5) * 9;
    this.vy = -(Math.random() * 7 + 3);
    this.gravity = .32;
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.w = Math.random() * 9 + 4;
    this.h = Math.random() * 5 + 3;
    this.rot = Math.random() * Math.PI * 2;
    this.rotV = (Math.random() - .5) * .28;
    this.alpha = 1;
    this.life = Math.random() * 40 + 50;
    this.age = 0;
    this.shape = Math.random() < .5 ? "rect" : "circle";
  }

  function burst(x, y, count) {
    for (var i = 0; i < count; i++) particles.push(new Particle(x, y));
    if (!raf) loop();
  }

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += p.gravity;
      p.vx *= .98; p.rot += p.rotV; p.age++;
      p.alpha = Math.max(0, 1 - p.age / p.life);
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === "circle") {
        ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      }
      ctx.restore();
      if (p.age >= p.life) particles.splice(i, 1);
    }
    raf = particles.length ? requestAnimationFrame(loop) : null;
  }

  window.tadaBurst = function() {
    /* 카드 위치 기준으로 터짐 */
    var card = document.getElementById("questionCard");
    var rect = card ? card.getBoundingClientRect() : null;
    var cx = rect ? rect.left + rect.width / 2 : window.innerWidth / 2;
    var cy = rect ? rect.top + 30 : window.innerHeight * .35;
    /* 3연발 — 약간씩 위치와 타이밍 다르게 */
    burst(cx, cy, 38);
    setTimeout(function(){ burst(cx - 60, cy + 10, 22); }, 90);
    setTimeout(function(){ burst(cx + 60, cy + 10, 22); }, 150);
  };
})();

/* ━━━ 점 배치 정의 (true=점, false=빈칸) ━━━
   각 숫자별로 그리드 셀에 점이 있는지 배열로 정의
   n1: 1x1(1셀), n2: 1x2(2셀), n3: 1x3(3셀),
   n4: 2x2(4셀), n5: 3x2(6셀), n6: 3x2(6셀)
*/
var DOT_LAYOUT = {
  1: [true],
  2: [true, true],
  3: [true, true, true],
  4: [true, true, true, true],
  /* 3x3 그리드(9칸): ●○● / ○●○ / ●○● */
  5: [true, false, true,
      false, true, false,
      true, false, true],
  6: [true, true, true, true, true, true]
};

/* 결과 주사위에 점 렌더링 */
function renderDots(dotGridId, n) {
  var grid = document.getElementById(dotGridId);
  grid.className = "dot-grid n" + n;
  var layout = DOT_LAYOUT[n];
  var html = "";
  for (var i = 0; i < layout.length; i++) {
    html += "<div class='dot" + (layout[i] ? "" : " h") + "'></div>";
  }
  grid.innerHTML = html;
}

/* 결과 주사위 초기화 (물음표) */
function clearDots(dotGridId) {
  var grid = document.getElementById(dotGridId);
  grid.className = "dot-grid empty";
  grid.innerHTML = "";
}

function showCard(card, b, g) {

  document.getElementById("leadLabel").textContent = card.s ? "📣 상황 한마디" : "🎯 핵심 질문";
  document.getElementById("questionText").textContent = card.l;
  var h = "";
  for (var i = 0; i < card.q.length; i++) h += "<li class='fade' style='animation-delay:" + (0.3 + i * 0.12) + "s'>" + esc(card.q[i]) + "</li>";
  document.getElementById("subQ").innerHTML = h;
  /* 원문 */
  var changed = card.ol !== card.l;
  for (var k = 0; k < card.q.length; k++) if (card.oq[k] !== card.q[k]) changed = true;
  var ob = document.getElementById("origBox");
  ob.classList.remove("show");

  ob.innerHTML = oh;

  qc.classList.remove("show"); void qc.offsetWidth; qc.classList.add("show");
  document.getElementById("resetBtn").classList.add("show");
  updateTabs();

  tadaFlash();
  setTimeout(function(){ window.tadaBurst && window.tadaBurst(); }, 80);

  if (icon) { icon.classList.remove("tada"); void icon.offsetWidth; icon.classList.add("tada"); }

/* ━━━ 주사위 눈 → 카드 ━━━
   두 눈으로 1~36번 칸을 정하고, 30번 칸까지가 카드입니다.
   31~36번 칸(빈칸)은 자동으로 한 번 더 굴려 모든 카드가 똑같은 확률을 갖습니다. */
function finishRoll() {
  if (!blueVal || !greenVal) return;
  var n = (greenVal - 1) * 6 + blueVal;
  if (n > 30) {
    showToast("🎲 " + n + "번 칸은 빈칸! 한 번 더 굴립니다");
    autoTimer = setTimeout(function(){ autoTimer = null; rollBoth(); }, 1500);
    return;
  }
  var list = cardsOf(cat);
  showCard(list[(n - 1) % list.length], blueVal, greenVal);
}

/* ━━━ 굴리기 로직 ━━━ */
var rolling = { blue: false, green: false };
var blueVal = 0, greenVal = 0;

/* 스피너 ON/OFF + 결과 주사위 ON/OFF */
function showSpinner(color) {
  document.getElementById(color + "Spinner").classList.add("spinning");
  document.getElementById(color + "Result").classList.add("hidden");
}
function showResult(color, n) {
  document.getElementById(color + "Spinner").classList.remove("spinning");
  var result = document.getElementById(color + "Result");
  result.classList.remove("hidden");
  /* 점 렌더링 */
  renderDots(color + "Dots", n);
  /* 착지 애니메이션 */
  result.style.transform = "scale(.85)";
  result.style.transition = "transform 0s";
  requestAnimationFrame(function() {
    result.style.transition = "transform .35s cubic-bezier(.34,1.56,.64,1)";
    result.style.transform = "scale(1)";
  });
}


function cancelAuto() { if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; } }
function hideCard() {
  document.getElementById("questionCard").classList.remove("show");
  document.getElementById("resetBtn").classList.remove("show");
}

function rollBoth() {
  if (rolling.blue || rolling.green) return;
  cancelAuto();
  rolling.blue = true; rolling.green = true;
  blueVal = 0; greenVal = 0;
  setNum("blueNum", 0); setNum("greenNum", 0);
  hideCard();

  var b = rand6(), g = rand6();
  var dur = 820 + rand6() * 60;
  showSpinner("blue");
  showSpinner("green");

  setTimeout(function() {
    showResult("blue", b); blueVal = b; setNum("blueNum", b);
    rolling.blue = false;
    if (!rolling.green) finishRoll();
  }, dur);
  setTimeout(function() {
    showResult("green", g); greenVal = g; setNum("greenNum", g);
    rolling.green = false;
    if (!rolling.blue) finishRoll();
  }, dur + rand6() * 80);
}

function rollSingle(color) {
  if (rolling[color]) return;
  cancelAuto();
  rolling[color] = true;
  if (color === "blue") blueVal = 0; else greenVal = 0;
  setNum(color === "blue" ? "blueNum" : "greenNum", 0);
  hideCard();
  var val = rand6();
  var dur = 820 + rand6() * 60;
  showSpinner(color);
  setTimeout(function() {
    showResult(color, val);
    if (color === "blue") blueVal = val; else greenVal = val;
    setNum(color === "blue" ? "blueNum" : "greenNum", val);
    rolling[color] = false;
    if (blueVal && greenVal) finishRoll();
  }, dur);
}

function resetAll() {
  cancelAuto();
  curCard = null;
  blueVal = 0; greenVal = 0;
  setNum("blueNum", 0); setNum("greenNum", 0);
  ["blue","green"].forEach(function(c) {
    document.getElementById(c + "Spinner").classList.remove("spinning");
    document.getElementById(c + "Result").classList.remove("hidden");
    document.getElementById(c + "Result").style.transform = "";
    clearDots(c + "Dots");
  });
  hideCard();
}

  var h = "", list = cardsOf(listCat);
  list.forEach(function(card){
    var cur = curCard && curCard.t === card.t && curCard.n === card.n;
    h += "<div class='lst-item cat-" + card.t + (cur ? " cur" : "") + "' onclick='pickFromList(\"" + card.t + "\"," + card.n + ")'>";
    h += "<div class='lst-no'>" + pad(card.n) + (drawn[card.t][card.n] ? "<span class='ck'>✓</span>" : "") + "</div>";
    h += "<div><div class='lst-lead'>" + esc(card.l) + "</div><div class='lst-qs'>";
    card.q.forEach(function(q, i){ h += (i ? "<br>" : "") + "· " + esc(q); });
    h += "</div></div></div>";
  });
  document.getElementById("lstBody").innerHTML = h;
  document.getElementById("lstCount").textContent = "뽑은 카드 " + Object.keys(drawn[listCat]).length + " / " + list.length;
}
function openList() { listCat = cat; buildList(); document.getElementById("listModal").classList.add("show"); document.body.style.overflow = "hidden"; }
function switchList(c) { listCat = c; buildList(); }
function pickFromList(t, n) {
  var card = CARDS.filter(function(x){ return x.t === t && x.n === n; })[0];
  if (!card) return;
  cancelAuto();
  closeModal("listModal");
  cat = t;
  blueVal = 0; greenVal = 0;
  setNum("blueNum", 0); setNum("greenNum", 0);
  ["blue","green"].forEach(function(c){ clearDots(c + "Dots"); });
  showCard(card, 0, 0);
}
function clearDrawn() {
  drawn = { A: {}, E: {} };
  updateTabs(); buildList();
  showToast("🧹 뽑은 기록을 지웠습니다.");
}

/* ━━━ 모달 공통 ━━━ */
function closeModal(id){ document.getElementById(id).classList.remove("show"); document.body.style.overflow=""; }
function overlayClose(id,e){ if(e.target===document.getElementById(id))closeModal(id); }

/* ━━━ 테마 ━━━ */
function toggleTheme(){
  var html=document.documentElement, dark=html.classList.contains("theme-dark");
  html.classList.toggle("theme-dark",!dark); html.classList.toggle("theme-light",dark);
  document.getElementById("themeBtn").textContent=dark?"🌙":"☀️";
  try{localStorage.setItem("diceTheme",dark?"light":"dark");}catch(e){}
}

/* ━━━ 유틸 ━━━ */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
var toastTimer=null;
function showToast(msg){
  var el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.remove("show");},2600);
}


/* ━━━ 초기화 ━━━ */
(function(){
  try{
    var t=localStorage.getItem("diceTheme");
    if(t==="dark"){ document.documentElement.classList.replace("theme-light","theme-dark"); document.getElementById("themeBtn").textContent="☀️"; }
  }catch(e){}
  clearDots("blueDots");
  clearDots("greenDots");
  updateTabs();
  document.querySelectorAll(".ani").forEach(function(el,i){ setTimeout(function(){el.classList.add("in");},80+i*110); });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ closeModal("listModal"); }
    if((e.key===" "||e.key==="Enter") && !document.getElementById("listModal").classList.contains("show") && e.target===document.body){ e.preventDefault(); rollBoth(); }
  });
})();
</script>
</body>
