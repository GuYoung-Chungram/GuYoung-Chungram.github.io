<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#071230">
<title>의원 이슈 질문 생성기 · 청람M&amp;C</title>
<style>
  html, body { margin: 0; height: 100%; background: #071230; }
  body { font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #071230; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #cfd8f0; font-size: 15px; }
  #loading .ring { width: 34px; height: 34px; border: 3px solid rgba(255,255,255,.18); border-top-color: #d9b86c; border-radius: 50%; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  #direct { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 5; font-size: 12px; color: #fff; background: rgba(7,18,48,.72); border: 1px solid rgba(255,255,255,.25); padding: 6px 11px; border-radius: 99px; text-decoration: none; opacity: .75; }
  #direct:hover { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #loading .ring { animation: none; } }
</style>
</head>
<body>
  <div id="loading" role="status"><div class="ring"></div>질문 생성기를 불러오는 중입니다</div>
  <iframe id="app" title="의원 이슈 질문 생성기"
    src="https://script.google.com/macros/s/AKfycbyeAY8m-cVuvmUJwrGEV01ACnscgFyVkA0gtAVABlbx5BAEPsffAZVV719Lnu7cr1SsgQ/exec"
    allow="clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
  <a id="direct" href="https://script.google.com/macros/s/AKfycbyeAY8m-cVuvmUJwrGEV01ACnscgFyVkA0gtAVABlbx5BAEPsffAZVV719Lnu7cr1SsgQ/exec" target="_blank" rel="noopener">화면이 안 보이면 새 창으로 열기</a>
  <script>
    document.getElementById('app').addEventListener('load', function () {
      document.getElementById('loading').style.display = 'none';
    });
  </script>
</body>
</html>
